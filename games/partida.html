<script>
/*PURE_START*/
function UF(){const p=new Map();const f=x=>{if(!p.has(x))p.set(x,x);let r=x;while(p.get(r)!==r)r=p.get(r);let c=x;while(p.get(c)!==r){const n=p.get(c);p.set(c,r);c=n}return r};return{find:f,union:(a,b)=>{const ra=f(a),rb=f(b);if(ra!==rb)p.set(ra,rb)}}}
function mkState(comps){const st={master:true,q:{},k:{},press:{},hold:{},trip:{},blown:{}};comps.forEach(c=>{if(c.type==='Q')st.q[c.id]=false;if(c.type==='K')st.k[c.id]=false;if(c.type==='FU')st.blown[c.id]=false;if(c.type==='F2')st.trip[c.id]=false});return st}
function edgesOf(comps,st,skipFU){const E=[];const add=(id,a,b)=>E.push([id+'.'+a,id+'.'+b]);
 for(const c of comps){const id=c.id;
  if(c.type==='Q'){if(st.q[id]){add(id,1,2);add(id,3,4);add(id,5,6)}}
  else if(c.type==='FU'){if(!st.blown[id]&&!skipFU)add(id,1,2)}
  else if(c.type==='K'){if(st.k[id]){add(id,1,2);add(id,3,4);add(id,5,6);add(id,13,14)}else add(id,21,22)}
  else if(c.type==='F2'){add(id,1,2);add(id,3,4);add(id,5,6);if(st.trip[id])add(id,97,98);else add(id,95,96)}
  else if(c.type==='S0'){if(!st.press[id])add(id,11,12)}
  else if(c.type==='SB'){if(st.press[id])add(id,13,14);else if(c.nf)add(id,21,22)}}
 return E}
function evalOnce(comps,wires,st,skipFU){
 const uf=UF();for(const w of wires)uf.union(w[0],w[1]);for(const e of edgesOf(comps,st,skipFU))uf.union(e[0],e[1]);
 const lab={},shorts=new Set();const src=comps.find(c=>c.type==='SRC');
 if(src&&st.master)for(const n of ['R','S','T','N']){const rt=uf.find(src.id+'.'+n);if(lab[rt]&&lab[rt]!==n)shorts.add(rt);else lab[rt]=n}
 const L=t=>lab[uf.find(t)]||null;
 const volt=(a,b)=>{const ra=uf.find(a),rb=uf.find(b);if(ra===rb||shorts.has(ra)||shorts.has(rb))return 0;const la=lab[ra],lb=lab[rb];if(!la||!lb)return 0;return(la==='N'||lb==='N')?220:380};
 const loads={};
 for(const c of comps){if(c.type==='K')loads[c.id]=volt(c.id+'.A1',c.id+'.A2');if(c.type==='H')loads[c.id]=volt(c.id+'.X1',c.id+'.X2')}
 let motor={state:'off',dir:0};
 for(const c of comps){if(c.type!=='M')continue;
  const l=['U','V','W'].map(n=>L(c.id+'.'+n));const non=l.filter(Boolean);const idx={R:0,S:1,T:2};
  if(non.length===0)motor={state:'off',dir:0,id:c.id};
  else if(l.includes('N'))motor={state:'bad',dir:0,id:c.id};
  else if(non.length===3&&new Set(non).size===3){const a=idx[l[0]],b=idx[l[1]],d=idx[l[2]];motor={state:'run',dir:((b-a+3)%3===1&&(d-b+3)%3===1)?1:-1,id:c.id}}
  else if(new Set(non).size>=2)motor={state:'phase',dir:0,id:c.id};
  else motor={state:'off',dir:0,id:c.id};}
 return{root:uf.find,shorts:[...shorts],loads,motor,L}}
function solve(comps,wires,st){
 const faults=[];let r;
 for(let it=0;it<60;it++){
  r=evalOnce(comps,wires,st,false);
  if(r.shorts.length){
   const r2=evalOnce(comps,wires,st,true);let did=false;
   if(!r2.shorts.length)comps.forEach(c=>{if(c.type==='FU'&&!st.blown[c.id]&&r.shorts.includes(r.root(c.id+'.1'))){st.blown[c.id]=true;faults.push('fuse:'+c.id);did=true}});
   if(!did)comps.forEach(c=>{if(c.type==='Q'&&st.q[c.id]&&[1,2,3,4,5,6].some(p=>r.shorts.includes(r.root(c.id+'.'+p)))){st.q[c.id]=false;faults.push('trip:'+c.id);did=true}});
   if(!did){st.master=false;faults.push('master')}
   continue}
  let ch=false;
  for(const c of comps){if(c.type!=='K')continue;const on=r.loads[c.id]===220||!!st.hold[c.id];if(on!==!!st.k[c.id]){st.k[c.id]=on;ch=true;break}}
  if(!ch){r.faults=faults;return r}}
 r.faults=faults;r.osc=true;return r}
function applyStep(st,s){if(s.q)st.q[s.q[0]]=s.q[1];if(s.p)st.press[s.p]=true;if(s.r)st.press[s.r]=false;if(s.h)st.hold[s.h]=true;if(s.u)st.hold[s.u]=false;if(s.trip)st.trip[s.trip]=true;if(s.reset)st.trip[s.reset]=false;if(s.master)st.master=true;if(s.fuse)st.blown[s.fuse]=false}
function isOn(id,st,r){if(id in st.k)return!!st.k[id];return r.loads[id]===220}
function checkEx(ex,st,r){
 if(ex.M&&r.motor.state!==ex.M)return false;
 if(ex.dir!==undefined&&r.motor.dir!==ex.dir)return false;
 if(ex.on)for(const k in ex.on)if(isOn(k,st,r)!==ex.on[k])return false;
 if(ex.q)for(const k in ex.q)if(!!st.q[k]!==ex.q[k])return false;
 if(ex.fault&&!(r.faults||[]).some(f=>f.indexOf(ex.fault)===0))return false;
 return true}
function runTests(level,wires){
 return level.tests.map(t=>{const st=mkState(level.comps);let r=solve(level.comps,wires,st),fail=null;
  const faultsAll=[];
  for(const s of t.steps){applyStep(st,s);r=solve(level.comps,wires,st);(r.faults||[]).forEach(f=>faultsAll.push(f));
   if(s.ex){r.faults=faultsAll.slice();if(!checkEx(s.ex,st,r)){fail=s.msg||'Algo não saiu como esperado.';break}}}
  return{name:t.name,ok:!fail,msg:fail}})}
function wireSat(wires,a,b){const uf=UF();wires.forEach(w=>uf.union(w[0],w[1]));return uf.find(a)===uf.find(b)}
/*PURE_END*/

/*LV_START*/
const q_=(id,v)=>({q:[id,v]}),P_=id=>({p:id}),R_=id=>({r:id}),H_=id=>({h:id}),U_=id=>({u:id}),TR=id=>({trip:id}),RS=id=>({reset:id}),E_=(ex,msg)=>({ex,msg});
const PWs=[['SRC.R','Q1.1'],['SRC.S','Q1.3'],['SRC.T','Q1.5']];
const PWk1=[['Q1.2','K1.1'],['Q1.4','K1.3'],['Q1.6','K1.5'],['K1.2','F2.1'],['K1.4','F2.3'],['K1.6','F2.5']];
const PWm=[['F2.2','M1.U'],['F2.4','M1.V'],['F2.6','M1.W']];
const PW=[...PWs,...PWk1,...PWm];
const CT_BASE=[['Q1.2','FU1.1'],['FU1.2','S0.11'],['S0.12','S1.13'],['S1.14','K1.A1']];
const CT_SEAL=[['S0.12','K1.13'],['K1.14','K1.A1']];
const CT_TERM=[['K1.A2','F2.95'],['F2.96','SRC.N']];
const LAMPS=[['K1.A1','H1.X1'],['H1.X2','SRC.N'],['FU1.2','K1.21'],['K1.22','H2.X1'],['H2.X2','SRC.N'],['FU1.2','F2.97'],['F2.98','H3.X1'],['H3.X2','SRC.N']];
const cSRC={id:'SRC',type:'SRC'},cQ={id:'Q1',type:'Q'},cFU={id:'FU1',type:'FU'},cK={id:'K1',type:'K'},cF2={id:'F2',type:'F2'},cS0={id:'S0',type:'S0'},cS1={id:'S1',type:'SB',nf:false,color:'#19c37d',label:'S1 · LIGA'},cM={id:'M1',type:'M'};
const cH1={id:'H1',type:'H',color:'#19c37d',label:'H1 · LIGADO'},cH2={id:'H2',type:'H',color:'#ff4d5e',label:'H2 · PARADO'},cH3={id:'H3',type:'H',color:'#ffc400',label:'H3 · SOBRECARGA'};
const FULLTESTS=[
 {name:'Ligou o disjuntor: motor parado, lâmpada de parado acesa',steps:[q_('Q1',true),E_({M:'off',on:{K1:false,H2:true,H1:false,H3:false}},'Com Q1 ligado e nada apertado, o motor fica parado e H2 (vermelha) acesa.')]},
 {name:'Aperta S1: motor liga e H1 acende',steps:[q_('Q1',true),P_('S1'),E_({M:'run',dir:1,on:{K1:true,H1:true,H2:false}},'S1 deveria ligar K1 e o motor, e H1 deveria acender.')]},
 {name:'Solta S1: selo mantém o motor ligado',steps:[q_('Q1',true),P_('S1'),R_('S1'),E_({M:'run',on:{K1:true}},'Faltou o selo: o contato 13-14 de K1 deve ficar em paralelo com S1.')]},
 {name:'Aperta S0: desliga',steps:[q_('Q1',true),P_('S1'),R_('S1'),P_('S0'),R_('S0'),E_({M:'off',on:{K1:false,H2:true}},'S0 (NF) deve ficar em série e cortar o comando.')]},
 {name:'Sobrecarga: térmico desliga tudo e H3 acende',steps:[q_('Q1',true),P_('S1'),R_('S1'),TR('F2'),E_({M:'off',on:{K1:false,H3:true,H1:false}},'O térmico (95-96) deve cortar a bobina e 97-98 deve acender H3.'),P_('S1'),R_('S1'),E_({M:'off'},'Com o térmico desarmado o motor não pode religar.'),RS('F2'),P_('S1'),R_('S1'),E_({M:'run'},'Depois de rearmar o térmico, S1 deve ligar de novo.')]}];
const GAME={id:'partida',title:'Bancada do Relê · Partida Direta',key:'fabricaRele_partida_v1',levels:[
{id:1,name:'Fechando o circuito',goal:'Acenda a lâmpada H1: fase R → disjuntor Q1 → lâmpada → neutro N.',
 learn:'Corrente precisa de um caminho de IDA (fase) e de VOLTA (neutro). O disjuntor Q1 abre e fecha esse caminho.',
 tip:'Use 3 cabos: R até Q1 (borne 1), Q1 (borne 2) até a lâmpada, e a lâmpada até N. Depois clique no disjuntor Q1 para ligar.',
 comps:[cSRC,cQ,{...cH1}],pre:[],sol:[['SRC.R','Q1.1'],['Q1.2','H1.X1'],['H1.X2','SRC.N']],
 tests:[{name:'Disjuntor desligado: lâmpada apagada',steps:[E_({on:{H1:false}},'Com Q1 desligado a lâmpada deve ficar apagada.')]},
  {name:'Disjuntor ligado: lâmpada acende',steps:[q_('Q1',true),E_({on:{H1:true}},'A lâmpada não acendeu. Falta o caminho de ida (R) ou o de volta (N).')]},
  {name:'Desligou de novo: apaga',steps:[q_('Q1',true),q_('Q1',false),E_({on:{H1:false}},'Ao desligar Q1 a lâmpada deve apagar.')]}]},
{id:2,name:'Botão liga (contato NA)',goal:'A lâmpada só acende enquanto você aperta o botão S1.',
 learn:'Contato NA (normalmente aberto) fecha ao ser acionado. Ele é o botão LIGA: 13 e 14 são seus bornes.',
 tip:'Coloque S1 (bornes 13-14) no caminho, entre Q1 e a lâmpada.',
 comps:[cSRC,cQ,cS1,{...cH1}],pre:[],sol:[['SRC.R','Q1.1'],['Q1.2','S1.13'],['S1.14','H1.X1'],['H1.X2','SRC.N']],
 tests:[{name:'Sem apertar: apagada',steps:[q_('Q1',true),E_({on:{H1:false}},'Sem apertar S1 a lâmpada deve ficar apagada.')]},
  {name:'Apertou: acende',steps:[q_('Q1',true),P_('S1'),E_({on:{H1:true}},'Ao apertar S1 a lâmpada deve acender.')]},
  {name:'Soltou: apaga',steps:[q_('Q1',true),P_('S1'),R_('S1'),E_({on:{H1:false}},'Ao soltar S1 a lâmpada deve apagar.')]}]},
{id:3,name:'Botão desliga (contato NF)',goal:'A lâmpada fica acesa e apaga quando você aperta S0.',
 learn:'Contato NF (normalmente fechado) abre ao ser acionado. Ele é o botão DESLIGA: 11 e 12 são seus bornes.',
 tip:'S0 fica em série no caminho: Q1 → S0 (11-12) → lâmpada.',
 comps:[cSRC,cQ,cS0,{...cH1}],pre:[],sol:[['SRC.R','Q1.1'],['Q1.2','S0.11'],['S0.12','H1.X1'],['H1.X2','SRC.N']],
 tests:[{name:'Sem apertar: acesa',steps:[q_('Q1',true),E_({on:{H1:true}},'Com S0 solto a lâmpada deve ficar acesa.')]},
  {name:'Apertou S0: apaga',steps:[q_('Q1',true),P_('S0'),E_({on:{H1:false}},'Ao apertar S0 a lâmpada deve apagar.')]},
  {name:'Soltou: acende de novo',steps:[q_('Q1',true),P_('S0'),R_('S0'),E_({on:{H1:true}},'Ao soltar S0 a lâmpada deve acender de novo.')]}]},
{id:4,name:'Circuito de potência',goal:'Ligue Q1 → contator K1 → relé térmico F2 → motor M1. Teste acionando o contator com a mão.',
 learn:'Potência é o caminho dos 3 fios que alimentam o motor. Os bornes 1-3-5 são entradas e 2-4-6 são saídas, sempre na mesma ordem.',
 tip:'Fonte R-S-T vai nos bornes 1-3-5 de Q1; saídas 2-4-6 de Q1 nos 1-3-5 de K1; 2-4-6 de K1 nos 1-3-5 de F2; 2-4-6 de F2 em U-V-W. Para testar, ligue Q1 e segure o corpo do contator K1.',
 comps:[cSRC,cQ,cK,cF2,cM],pre:[],sol:PW,

 else{if(armed&&armed!==d.from){addWire(armed,d.from);armed=null}else if(armed===d.from)armed=null;else{armed=d.from;say(`Borne ${termName(d.from)} escolhido. Toque no outro borne para ligar o cabo.`)}}

$('#cols').addEventListener('click',e=>{const b=e.target.closest('.cdot');if(!b)return;color=b.dataset.c;document.querySelectorAll('.cdot').forEach(x=>x.classList.toggle('on',x===b))});
$('#zin').onclick=()=>setZoom(zoom+.12);$('#zout').onclick=()=>setZoom(zoom-.12);$('#zfit').onclick=fit;
$('#snd').onclick=()=>{S.sound=!S.sound;save();$('#snd').textContent=S.sound?'🔊':'🔇';sfx.tick()};
/* ---------- simulação ao vivo ---------- */
const FMSG={fuse:'💥 O fusível queimou: curto no comando. Remova o cabo errado e clique no fusível para trocar.',trip:'⚡ Curto-circuito! O disjuntor desarmou. Corrija os cabos e ligue o disjuntor de novo.',master:'⚡ Curto direto na fonte! O disjuntor GERAL desarmou. Corrija e clique em GERAL.'};
let lastK={},flash=null;
function refresh(){
 res=solve(comps,[...pre,...wires],st);
 const msgs=[];(res.faults||[]).forEach(f=>{const k=f.split(':')[0];msgs.push(FMSG[k]);sfx.alarm()});
 for(const c of comps){const p=document.getElementById.bind(document);
  if(c.type==='Q'){const on=st.q[c.id];p(c.id+'_lev').setAttribute('transform',`rotate(${on?-26:26} 100 105)`)}
  else if(c.type==='FU'){p(c.id+'_x').setAttribute('display',st.blown[c.id]?'':'none');p(c.id+'_link').setAttribute('stroke',st.blown[c.id]?'#ff4d5e':INK)}
  else if(c.type==='K'){const on=st.k[c.id];p(c.id+'_arm').setAttribute('fill',on?'#19c37d':'#c3bddb');p(c.id+'_arm').setAttribute('y',on?84:78);const t=p(c.id+'_stt');t.textContent=on?'LIGADO':'DESLIGADO';if(lastK[c.id]!==undefined&&lastK[c.id]!==on)sfx.clack();lastK[c.id]=on;
   if(res.loads[c.id]===380)msgs.push(`⚠️ Bobina de ${c.id} ligada em 380 V (entre duas fases): queimaria! Use fase e neutro.`)}
  else if(c.type==='F2'){const t=p(c.id+'_st');t.textContent=st.trip[c.id]?'DESARMOU':'OK';t.setAttribute('fill',st.trip[c.id]?'#c0182c':'#0a7a4b')}
  else if(c.type==='H'){const on=res.loads[c.id]===220;p(c.id+'_bulb').setAttribute('fill',on?c.color:'#ddd');p(c.id+'_glow').setAttribute('opacity',on?.55:0);p(c.id+'_glow').setAttribute('filter',on?'url(#glow)':'');if(res.loads[c.id]===380)msgs.push('⚠️ Lâmpada ligada em 380 V: queimaria! Use fase e neutro.')}
  else if(c.type==='S0'||c.type==='SB'){p(c.id+'_b').setAttribute('transform',st.press[c.id]?'translate(0,3) scale(.94)':'');p(c.id+'_b').style.transformOrigin='center'}
  else if(c.type==='SRC'){p(c.id+'_mst').setAttribute('fill',st.master?'#19c37d':'#ff4d5e');p(c.id+'_mst').setAttribute('x',st.master?266:292)}
  else if(c.type==='M'){const m=res.motor,t=p(c.id+'_st');motorRun=m.state==='run'?1:m.state==='phase'?.25:0;motorDir=m.state==='run'?m.dir:1;
   t.textContent={off:'PARADO',run:m.dir>0?'↻ FRENTE':'↺ REVERSO',phase:'🔊 ZUMBINDO (falta fase)',bad:'⚠️ LIGAÇÃO ERRADA'}[m.state]}}
 if(res.motor.state==='phase')msgs.push('🔊 O motor está zumbindo: falta uma fase ou duas fases iguais. Confira U, V e W.');
 if(res.motor.state==='bad')msgs.push('⚠️ O motor foi ligado ao neutro. Ele precisa das 3 fases.');
 if(res.osc)msgs.push('Circuito vibrando (oscila). Revise o intertravamento.');
 if(msgs.length){flash=msgs.join(' ');$('#status').className='bad';$('#status').textContent=flash}
 else{const m=res.motor;$('#status').className=m.state==='run'?'good':'';$('#status').textContent=m.state==='run'?(m.dir>0?'✅ Motor girando para a FRENTE (↻).':'✅ Motor girando em REVERSO (↺).'):'Arraste de um borne a outro para ligar um cabo. Toque num cabo para remover. Clique nos botões e no disjuntor para operar.'}
}
(function spin(){motorAng+=motorRun*motorDir*7;const f=document.getElementById('M1_fan');if(f){const j=motorRun===.25?(Math.random()*4-2):0;f.setAttribute('transform',`rotate(${motorAng+j} 120 124)`)}requestAnimationFrame(spin)})();
/* ---------- fases ---------- */
function chips(){$('#lv').innerHTML=GAME.levels.map(l=>`<button class="chip${l.id===LV.id?' cur':''}${l.bonus?' bonus':''}${l.boss?' boss':''}" data-i="${l.id}" title="${l.name}">${l.boss?'🏆':l.id}<i>${'★'.repeat(S.stars[l.id]||0)+'☆'.repeat(3-(S.stars[l.id]||0))}</i></button>`).join('')}
$('#lv').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b&&!lock)openLevel(+b.dataset.i)});
function openLevel(id){
 LV=GAME.levels.find(l=>l.id===id);comps=LV.comps;pre=LV.pre.map(w=>[w[0],w[1]]);wires=(S.wires[id]||[]).filter(w=>jposOK(w));hist=[];armed=null;hints=0;attempts=0;listUsed=false;lastK={};st=mkState(comps);
 $('#resbox').classList.add('hidden');$('#cheat').classList.add('hidden');
 $('#lesson').innerHTML=`<h2>${LV.boss?'🏆 ':''}Fase ${id} · ${LV.name}${LV.bonus?' (bônus)':''}</h2><p><b>Missão:</b> ${LV.goal}</p><div class="learn">💡 <b>Aprenda:</b> ${LV.learn}</div>`;
 $('#btest').textContent=LV.demo?'⚡ Provocar o curto':'▶ Testar';
 chips();buildBench();fit();refresh();say(`<b>Fase ${id}:</b> ${LV.goal}`);
 $('#scroll').scrollTo(0,0);window.scrollTo({top:0})}
function jposOK(w){return comps.some(c=>w[0].startsWith(c.id+'.'))&&comps.some(c=>w[1].startsWith(c.id+'.'))}
function clearResult(){if(!lock)$('#resbox').classList.add('hidden');if(!$('#cheat').classList.contains('hidden'))renderCheat()}
/* ---------- dicas, lista, desfazer, limpar ---------- */
const allW=()=>[...pre,...wires];
function missing(){return LV.sol.filter(w=>!wireSat(allW(),w[0],w[1]))}
$('#bhint').onclick=()=>{if(lock)return;hints++;const m=missing();
 if(hints===1||!m.length){say('💡 '+LV.tip);return}
 const w=m[0];say(`💡 Falta ligar <b>${termName(w[0])}</b> → <b>${termName(w[1])}</b>. Veja os bornes piscando.`);
 const hl=$('#hl');hl.innerHTML=[w[0],w[1]].map(t=>`<circle class="blink" cx="${jpos[t].x}" cy="${jpos[t].y}" r="14" fill="none" stroke="#6c4cf1" stroke-width="5"/>`).join('');setTimeout(()=>{hl.innerHTML=''},4000)};
function renderCheat(){const s=LV.sol;if(!s.length){$('#cheat').innerHTML='<b>Nesta fase não há cabos para ligar.</b>';return}
 $('#cheat').innerHTML=`<b>📋 Lista de ligações desta fase</b> <span class="hint" style="font-size:12px">(${s.filter(w=>wireSat(allW(),w[0],w[1])).length}/${s.length} feitas)</span><ul>${s.map(w=>`<li class="${wireSat(allW(),w[0],w[1])?'ok':''}">${termName(w[0])} → ${termName(w[1])}</li>`).join('')}</ul>`}
$('#blist').onclick=()=>{if(lock)return;const c=$('#cheat');if(c.classList.contains('hidden')){if(!listUsed){listUsed=true;hints+=2}renderCheat();c.classList.remove('hidden')}else c.classList.add('hidden')};
$('#bundo').onclick=()=>{if(lock||!hist.length)return;wires=JSON.parse(hist.pop());persist();sfx.unplug();renderWires();refresh();clearResult()};
$('#bclear').onclick=()=>{if(lock||!wires.length)return;pushHist();wires=[];persist();sfx.unplug();renderWires();refresh();clearResult()};
/* ---------- teste animado ---------- */
$('#btest').onclick=async()=>{
 if(lock)return;lock=true;attempts++;const box=$('#resbox');box.classList.remove('hidden');
 const all=allW(),out=[];let firstBad=null;
 for(const t of LV.tests){st=mkState(comps);refresh();say('Teste: <b>'+t.name+'</b>');let fail=null;const faultsAll=[];
  await sleep(450);
  for(const s of t.steps){applyStep(st,s);refresh();(res.faults||[]).forEach(f=>faultsAll.push(f));await sleep(s.ex?650:520);
   if(s.ex){res.faults=faultsAll.slice();if(!checkEx(s.ex,st,res)){fail=s.msg||'Não saiu como esperado.';break}}}
  out.push({name:t.name,ok:!fail,msg:fail});if(fail&&!firstBad)firstBad=fail;
  box.innerHTML=`<b>Resultado dos testes</b><ul>${out.map(r=>`<li class="${r.ok?'ok':'bad'}">${r.ok?'✔':'✘'} ${r.name}${r.ok?'':`<small>🤖 ${r.msg}</small>`}</li>`).join('')}</ul>`}
 st=mkState(comps);lastK={};refresh();lock=false;
 if(!firstBad){const stars=hints===0&&attempts<=3?3:hints<=2?2:1;S.stars[LV.id]=Math.max(S.stars[LV.id]||0,stars);save();chips();sfx.win();say(LV.boss?'Chefão derrotado! Você é mestre da bancada! 🏆':'Funcionou! Fase concluída! 🎉');showWin(stars)}
 else{sfx.bad();say('Quase! '+firstBad,'bad')}};
function showWin(stars){const i=GAME.levels.findIndex(l=>l.id===LV.id),nx=GAME.levels[i+1];
 $('#mbody').innerHTML=`<h2>${LV.boss?'🏆':'🎉'} Fase ${LV.id} concluída!</h2><div class="bigstars">${'★'.repeat(stars)+'☆'.repeat(3-stars)}</div><p>${LV.learn}</p><p style="font-size:12px;opacity:.7">3 estrelas: sem dicas e em até 3 testes · 2 estrelas: poucas dicas</p><div class="mbts"><button class="btn rst" id="m-stay">Continuar na bancada</button>${nx?'<button class="btn run" id="m-next">Próxima fase ▶</button>':''}</div>`;
 $('#modal').classList.remove('hidden');$('#m-stay').onclick=()=>$('#modal').classList.add('hidden');if(nx)$('#m-next').onclick=()=>{$('#modal').classList.add('hidden');openLevel(nx.id)}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.add('hidden')});
$('#snd').textContent=S.sound?'🔊':'🔇';
window.addEventListener('resize',()=>{});
openLevel(GAME.levels.find(l=>!S.stars[l.id])?GAME.levels.find(l=>!S.stars[l.id]).id:1);

</script></body></html>
