ul.ci{margin:8px 0;padding-left:18px;font-size:13.5px;line-height:1.45}#cnt.full{color:#0a7a4b}

</style></head><body>

<script>
/*PURE_START*/
const SPD={pneu:0.5,hid:0.25},SLOW=0.22;
/* port: [x,y,dx,dy,flags]  flags: 'x'=escape (nao liga mangueira) */
function defs(mode){
 const R=mode==='pneu'?'x':'';
 return {
 SRC:{w:130,h:76,ports:{P:[130,38,1,0]}},
 TANK:{w:110,h:62,ports:{T:[55,0,0,-1,'e']}},
 V32:{w:90,h:60,sq:2,ports:{2:[45,0,0,-1],1:[68,60,0,1],3:[22,60,0,1,R?'xe':'']}},
 V52:{w:130,h:60,sq:2,ports:{4:[35,0,0,-1],2:[95,0,0,-1],5:[18,60,0,1,'xe'],1:[65,60,0,1],3:[112,60,0,1,'xe'],14:[0,30,-1,0],12:[130,30,1,0]}},
 V42:{w:130,h:60,sq:2,ports:{A:[35,0,0,-1],B:[95,0,0,-1],P:[45,60,0,1],T:[85,60,0,1]}},
 V43:{w:150,h:60,sq:3,ports:{A:[40,0,0,-1],B:[110,0,0,-1],P:[55,60,0,1],T:[95,60,0,1]}},
 CYL1:{w:230,h:50,ports:{A:[34,0,0,-1]}},
 CYL2:{w:230,h:50,ports:{A:[34,0,0,-1],B:[150,0,0,-1]}},
 FC:{w:90,h:44,ports:{IN:[0,22,-1,0],OUT:[90,22,1,0]}},
 REL:{w:76,h:64,ports:{P:[38,0,0,-1],T:[38,64,0,1]}},
 MAN:{w:50,h:50,ports:{P:[25,50,0,1]}}};}
function portDefs(c,mode){return defs(mode)[c.type].ports}
function nodeOf(c,p){return c.id+'.'+p}
/* arestas internas por estado */
function inner(c){const s=c.s||0;
 switch(c.type){
  case 'V32':{const n=!!c.no;return (s^(n?1:0))?[['1','2']]:[['2','3']]}
  case 'V52':return s?[['1','4'],['2','3']]:[['1','2'],['4','5']];
  case 'V42':return s?[['P','A'],['B','T']]:[['P','B'],['A','T']];
  case 'V43':return s===1?[['P','A'],['B','T']]:s===2?[['P','B'],['A','T']]:[];
 }return[]}
function newSim(level,wires,mode){
 const sim={mode,level,comps:{},wires:[...(level.pre||[]),...wires],pump:false,fault:null,msgs:[],t:0,
  cyl:{},press:new Set(),fast:new Set(),exh:new Set(),hasRelief:false,moving:false,leak:false,stall:false};
 level.comps.forEach(c=>{sim.comps[c.id]=Object.assign({s:0},c);if(c.type==='CYL1'||c.type==='CYL2')sim.cyl[c.id]={pos:0,dir:0,slowSeen:false,reached:false,back:false}});
 sim.D=defs(mode);return sim}
function evalNet(sim){
 const adj=new Map(),radj=new Map(),add=(m,a,b,thr)=>{if(!m.has(a))m.set(a,[]);m.get(a).push({to:b,thr})};
 const edge=(a,b,thr)=>{add(adj,a,b,thr);add(radj,b,a,thr)};
 const exhN=[];let src=null;
 for(const id in sim.comps){const c=sim.comps[id],pd=sim.D[c.type].ports;
  for(const p in pd){const fl=pd[p][4]||'';if(fl.includes('e'))exhN.push(nodeOf(c,p));}
  if(c.type==='SRC')src=nodeOf(c,'P');
  for(const [a,b] of inner(c)){edge(nodeOf(c,a),nodeOf(c,b));edge(nodeOf(c,b),nodeOf(c,a))}
  if(c.type==='FC'){edge(nodeOf(c,'IN'),nodeOf(c,'OUT'),true);edge(nodeOf(c,'OUT'),nodeOf(c,'IN'))}}
 for(const [a,b] of sim.wires){edge(a,b);edge(b,a)}
 const bfs=(starts,m,skip)=>{const seen=new Set(starts),q=[...starts];while(q.length){const n=q.shift();for(const e of (m.get(n)||[])){if(skip&&e.thr)continue;if(!seen.has(e.to)){seen.add(e.to);q.push(e.to)}}}return seen};
 sim.press=sim.pump&&src?bfs([src],adj,false):new Set();
 sim.fast=sim.pump&&src?bfs([src],adj,true):new Set();
 sim.exh=bfs(exhN,radj,false);
 sim.src=src;
 sim.leak=sim.pump&&[...sim.press].some(n=>exhN.includes(n));
 sim.hasRelief=false;
 for(const id in sim.comps){const c=sim.comps[id];if(c.type==='REL'&&sim.press.has(nodeOf(c,'P'))&&sim.exh.has(nodeOf(c,'T')))sim.hasRelief=true}
 sim.netCount=sim.press.size}
function step(sim,dt){
 // pilotos (memoria): precisa de alguns ciclos
 for(let k=0;k<3;k++){evalNet(sim);let ch=false;
  for(const id in sim.comps){const c=sim.comps[id];
   if(c.act==='roller'){const cy=sim.cyl[c.cyl];const on=c.at===1?cy.pos>=0.97:cy.pos<=0.03;if(c.s!==(on?1:0)){c.s=on?1:0;ch=true}}
   if(c.act==='pilot'){const a=sim.press.has(nodeOf(c,'14')),b=sim.press.has(nodeOf(c,'12'));
    if(a&&!b&&c.s!==1){c.s=1;ch=true}else if(b&&!a&&c.s!==0){c.s=0;ch=true}}}
  if(!ch)break}
 sim.msgs=[];sim.moving=false;sim.stall=false;
 const spd=SPD[sim.mode];
 for(const id in sim.cyl){const c=sim.comps[id],y=sim.cyl[id],A=nodeOf(c,'A'),B=nodeOf(c,'B');
  const pA=sim.press.has(A),pB=c.type==='CYL2'&&sim.press.has(B),eA=sim.exh.has(A),eB=c.type==='CYL2'&&sim.exh.has(B);
  let dir=0,f=1;
  if(c.type==='CYL1'){if(pA){dir=1;f=sim.fast.has(A)?1:SLOW}else if(eA&&!pA){dir=-1}}
  else{if(pA&&!pB){if(eB){dir=1;f=sim.fast.has(A)?1:SLOW}else sim.msgs.push(`${c.label||id}: a câmara da frente não tem por onde ${sim.mode==='hid'?'o óleo voltar (ligue a saída T ao tanque)':'o ar sair'}.`)}
   else if(pB&&!pA){if(eA){dir=-1;f=sim.fast.has(B)?1:SLOW}else sim.msgs.push(`${c.label||id}: a câmara de trás não tem por onde ${sim.mode==='hid'?'o óleo voltar (ligue a saída T ao tanque)':'o ar sair'}.`)}}
  if(dir>0&&y.pos>=1)sim.stall=true;if(dir<0&&y.pos<=0&&c.type==='CYL2')sim.stall=true;
  y.dir=dir;
  if(dir&&!((dir>0&&y.pos>=1)||(dir<0&&y.pos<=0))){sim.moving=true;if(f<1)y.slowSeen=true;y.pos=Math.max(0,Math.min(1,y.pos+dir*spd*f*dt))}
  if(y.pos>=0.97)y.reached=true;if(y.reached&&y.pos<=0.03)y.back=true}
 // pressao / falhas
 const flow=sim.moving||sim.leak;
 if(sim.mode==='hid'&&sim.pump&&!sim.fault){
  if(sim.leak){sim.fault='leak'}
  else if(!sim.hasRelief&&!flow&&sim.netCount>1){sim.fault='burst';sim.pump=false;sim.press=new Set();sim.fast=new Set()}}
 if(sim.mode==='pneu'&&sim.leak&&sim.pump)sim.msgs.push('Ar escapando direto pelo escape: a fonte está ligada ao escape.');
 sim.bar=!sim.pump?0:sim.mode==='pneu'?6:(sim.hasRelief&&!sim.moving&&sim.netCount>1?150:40);
 sim.t+=dt}
function setS(sim,id,s){sim.comps[id].s=s}
/* roteiro de teste: steps = [['on'],['press','V1'],['rel','V1'],['set','V1',1],['wait',3]] */
function runScript(level,wires,steps,mode){
 const sim=newSim(level,wires,mode),dt=0.05;
 const run=t=>{for(let i=0;i<Math.round(t/dt);i++)step(sim,dt)};
 step(sim,0);
 for(const s of steps){const k=s[0];
  if(k==='on'){sim.pump=true}else if(k==='off'){sim.pump=false}
  else if(k==='press')sim.comps[s[1]].s=1;else if(k==='rel')sim.comps[s[1]].s=0;
  else if(k==='set')sim.comps[s[1]].s=s[2];else if(k==='wait')run(s[1])}
 return sim}
function posKind(p){return p>=0.97?'out':p<=0.03?'in':'mid'}
function checkEx(sim,ex){const out=[];
 for(const k in ex){const v=ex[k];
  if(k==='fault'){if((sim.fault||'none')!==v)out.push(`falha: ${sim.fault||'nenhuma'}`)}
  else if(k==='slow'){if(!sim.cyl[v].slowSeen)out.push(`${v} avançou rápido demais`)}
  else if(k==='reached'){if(!sim.cyl[v].reached)out.push(`${v} nunca chegou ao fim do curso`)}
  else if(k==='back'){if(!sim.cyl[v].back)out.push(`${v} não voltou ao início`)}
  else if(sim.cyl[k]){const p=posKind(sim.cyl[k].pos);if(p!==v)out.push(`${k} ficou ${p==='out'?'avançado':p==='in'?'recuado':'no meio'}, esperado ${v==='out'?'avançado':v==='in'?'recuado':'no meio'}`)}}
 return out}
/*PURE_END*/

const GAME={id:'hid',mode:'hid',key:'fabricaRele_hid_v1',title:'Mestre da Hidráulica',pump:'Ligar a bomba',levels:[
{id:1,name:'Circuito hidráulico básico',goal:'Ligue a bomba, a válvula 4/2, o cilindro e o tanque. A válvula de alívio já está instalada.',
 learn:'Na hidráulica o óleo é bombeado do reservatório, vai ao cilindro e VOLTA ao tanque pela via T. Sem retorno ao tanque o cilindro não anda.',tip:'P = pressão (bomba), T = tanque, A = câmara de trás (avança), B = câmara da frente (recua).',
 comps:[{id:'S',type:'SRC',x:10,y:120,label:'Bomba + motor'},{id:'R1',type:'REL',x:190,y:30,label:'R1 · alívio'},{id:'TK',type:'TANK',x:20,y:290,label:'Tanque'},{id:'V1',type:'V42',x:330,y:130,act:'lever',label:'V1 · 4/2 alavanca'},{id:'C1',type:'CYL2',x:560,y:280,label:'C1'}],
 pre:[['S.P','R1.P'],['R1.T','TK.T']],
 sol:[['S.P','V1.P'],['V1.T','TK.T'],['V1.A','C1.A'],['V1.B','C1.B']],
 tests:[{n:'Alavanca em 0: cilindro recuado',st:[['on'],['wait',2]],ex:{C1:'in',fault:'none'}},{n:'Alavanca em 1: cilindro avança',st:[['on'],['set','V1',1],['wait',5]],ex:{C1:'out',fault:'none'}},{n:'Volta a alavanca: recua',st:[['on'],['set','V1',1],['wait',5],['set','V1',0],['wait',5]],ex:{C1:'in',fault:'none'}}]},
{id:2,name:'Válvula de alívio de pressão',goal:'A mangueira já está montada. Instale a válvula de alívio entre a bomba e o tanque para o cilindro poder chegar ao fim do curso sem estourar nada.',
 learn:'Quando o cilindro chega ao fim, a bomba continua empurrando e a pressão sobe sem parar. A válvula de alívio abre no limite (ex.: 150 bar) e devolve o óleo ao tanque.',tip:'R1.P na linha de pressão (bomba) e R1.T no tanque. Sem ela a mangueira estoura!',
 comps:[{id:'S',type:'SRC',x:10,y:120,label:'Bomba + motor'},{id:'R1',type:'REL',x:190,y:30,label:'R1 · alívio'},{id:'M1',type:'MAN',x:120,y:20,label:'M1'},{id:'TK',type:'TANK',x:20,y:290,label:'Tanque'},{id:'V1',type:'V42',x:330,y:130,act:'lever',label:'V1 · 4/2 alavanca'},{id:'C1',type:'CYL2',x:560,y:280,label:'C1'}],
 pre:[['S.P','V1.P'],['V1.T','TK.T'],['V1.A','C1.A'],['V1.B','C1.B'],['S.P','M1.P']],
 sol:[['S.P','R1.P'],['R1.T','TK.T']],
 tests:[{n:'Avança até o fim sem estourar',st:[['on'],['set','V1',1],['wait',6]],ex:{C1:'out',fault:'none'}},{n:'Fica parado em pressão no fim',st:[['on'],['set','V1',1],['wait',10]],ex:{C1:'out',fault:'none'}},{n:'Recuado também sem estourar',st:[['on'],['wait',6]],ex:{C1:'in',fault:'none'}}]},
{id:3,name:'Controle de velocidade',goal:'Instale um regulador de fluxo na linha A para o cilindro avançar devagar.',

 if(c.act==='push'){g+=bt(-90,h/2-14,54,'⬇ '+c.id,(c.s?'#ffd23f':'#fff'),`data-b="${c.id}:push"`)+bt(-32,h/2-14,28,latch[c.id]?'🔒':'🔓',latch[c.id]?'#d6f7e7':'#fff',`data-b="${c.id}:lock"`)}
 if(c.act==='lever')g+=bt(-90,h/2-14,84,c.s?'1 ▣ ligada':'0 ▢ repouso',c.s?'#ffd23f':'#fff',`data-b="${c.id}:lever"`);
 if(c.act==='lever3'){[['◀',1],['●',0],['▶',2]].forEach(([t,v],i)=>g+=bt(-100+i*34,h/2-14,30,t,(c.s||0)===v?'#ffd23f':'#fff',`data-b="${c.id}:l3:${v}"`))}
 if(c.act==='roller')g+=`<g><circle cx="-14" cy="${h/2}" r="9" fill="#ddd" stroke="${INK}" stroke-width="3"/><path d="M-5 ${h/2}H0" stroke="${INK}" stroke-width="3"/>`+T(-50,h/2+4,'rolete',10,INK)+`</g>`;
 if(c.act==='pilot'){g+=T(w/2,h/2+4,'duplo piloto',9,'#7a6bd6')}
 return `<g transform="translate(${c.x},${c.y})">${g}</g>`}
function hosePath(a,b){const A=portPos(a),B=portPos(b),dist=Math.hypot(A.x-B.x,A.y-B.y),k=Math.min(90,dist/2+24);
 return `M${A.x} ${A.y}C${A.x+A.dx*k} ${A.y+A.dy*k} ${B.x+B.dx*k} ${B.y+B.dy*k} ${B.x} ${B.y}`}
function renderScene(level,wires,sm,opts={}){
 let W=0,H=0;for(const id in sm.comps){const c=sm.comps[id],D=sm.D[c.type];W=Math.max(W,c.x+D.w+(c.type.startsWith('CYL')?60:0));H=Math.max(H,c.y+D.h+34)}
 W+=70;H+=20;let s='',hs='';
 const press=sm.press;
 const all=[...(level.pre||[]).map(w=>({w,lk:true})),...wires.map(w=>({w,lk:false}))];
 all.forEach((o,i)=>{const [a,b]=o.w,on=press.has(a)&&press.has(b);const d=hosePath(a,b);
  hs+=`<path d="${d}" class="hose" stroke="${INK}" stroke-width="${o.lk?7:9}" opacity="${o.lk?.45:1}"/><path d="${d}" class="hose${on?' flowan':''}" stroke="${on?COL:(o.lk?'#c9c4e6':'#8d8aa0')}" stroke-width="${o.lk?3.5:5}"/>`;
  if(!opts.static&&!o.lk)hs+=`<path d="${d}" class="hosehit" data-w="${i-(level.pre||[]).length}"/>`});
 for(const id in sm.comps)s+=drawComp(sm.comps[id],sm,sm.pump||opts.show);
 const tmp=drag&&drag.to?`<line x1="${drag.fx}" y1="${drag.fy}" x2="${drag.to.x}" y2="${drag.to.y}" stroke="#6c4cf1" stroke-width="4" stroke-dasharray="6 6"/>`:'';
 return {W,H,svg:hs+s+tmp}}
function drawBench(){const r=renderScene(LV,WR(),sim);const svg=$('#bench');svg.setAttribute('width',r.W);svg.setAttribute('height',r.H);svg.setAttribute('viewBox',`0 0 ${r.W} ${r.H}`);svg.innerHTML=r.svg;
 $('#pbar').textContent=(sim.pump?Math.round(sim.bar):0)+' bar';$('#pbar').style.background=sim.pump&&sim.bar>=(HID?140:7)?'#ffe3d0':'#fff';
 $('#bpump').textContent=sim.pump?'⏹ Desligar':'▶ '+GAME.pump;
 const need=LV.sol.length,have=LV.sol.filter(w=>hasW(w)).length;$('#cnt').textContent='Mangueiras: '+WR().length+(LV.boss?'':' / '+need);$('#cnt').className=WR().length>=need?'full':''}
function hasW(w){return WR().some(x=>(x[0]===w[0]&&x[1]===w[1])||(x[0]===w[1]&&x[1]===w[0]))||(LV.pre||[]).some(x=>(x[0]===w[0]&&x[1]===w[1])||(x[0]===w[1]&&x[1]===w[0]))}
function schemHTML(level,wires){const sm=newSim(level,wires||level.sol,GAME.mode);sm.pump=true;
 for(const id in sm.comps)if(sm.comps[id].act==='roller')sm.comps[id].cyl=sm.comps[id].cyl;
 step(sm,0);const r=renderScene(level,wires||level.sol,sm,{static:true,show:false});
 return `<div style="overflow:auto;max-width:100%"><svg viewBox="0 0 ${r.W} ${r.H}" style="width:100%;max-width:${r.W}px;height:auto;background:#eef4f8;border-radius:10px">${r.svg}</svg></div>`}
function figComp(type){const lvl={comps:[{id:'X',type,x:90,y:20,label:CINFO[type][0],act:type==='V43'?'':''}]};const sm=newSim(lvl,[],GAME.mode);const D=sm.D[type];if(!sm.comps.X)return'';
 const c=sm.comps.X;c.x=30;c.y=14;const W=D.w+(type.startsWith('CYL')?150:60),H=D.h+44;return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${Math.round(W*1.5)}px;height:auto;display:block;margin:6px auto">${drawComp(c,sm,false)}</svg>`}
/* ---------- interacao ---------- */
function setStatus(t,cls){const s=$('#status');s.textContent=t;s.className=cls||''}
function addWire(a,b){if(a===b)return;const ca=a.split('.')[0],cb=b.split('.')[0];if(ca===cb&&false)return;
 if(hasW([a,b])){setStatus('Essas duas portas já estão ligadas.','bad');return}
 WR().push([a,b]);sim.wires=[...(LV.pre||[]),...WR()];save();sfx.plug();hl=null;dirty=true;
 setStatus(`Mangueira ligada: ${a} ↔ ${b}`);}
function evPt(e){const svg=$('#bench'),r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return{x:(e.clientX-r.left)*vb.width/r.width,y:(e.clientY-r.top)*vb.height/r.height}}
$('#bench').addEventListener('pointerdown',e=>{if(lock)return;
 const b=e.target.closest('[data-b]');
 if(b){const [id,k,v]=b.dataset.b.split(':'),c=sim.comps[id];
  if(k==='push'){pressed=id;c.s=1;sfx.clack()}
  else if(k==='lock'){latch[id]=!latch[id];if(!latch[id]&&pressed!==id)c.s=0;if(latch[id])c.s=1;sfx.tick()}
  else if(k==='lever'){c.s=c.s?0:1;sfx.clack()}
  else if(k==='l3'){c.s=+v;sfx.clack()}
  dirty=true;e.preventDefault();return}
 const w=e.target.closest('[data-w]');
 if(w){WR().splice(+w.dataset.w,1);sim.wires=[...(LV.pre||[]),...WR()];save();sfx.unplug();dirty=true;return}
 const p=e.target.closest('[data-t]');
 if(p){const t=p.dataset.t,pp=portPos(t);drag={from:t,fx:pp.x,fy:pp.y,moved:false,to:null};e.preventDefault()}});
window.addEventListener('pointermove',e=>{if(!drag)return;const pt=evPt(e);if(Math.hypot(pt.x-drag.fx,pt.y-drag.fy)>10){drag.moved=true;drag.to=pt;dirty=true}});
window.addEventListener('pointerup',e=>{
 if(pressed){const c=sim.comps[pressed];if(!latch[pressed])c.s=0;pressed=null;dirty=true}
 if(!drag)return;const d=drag;drag=null;dirty=true;
 const el=document.elementFromPoint(e.clientX,e.clientY),tp=el&&el.closest&&el.closest('[data-t]');
 if(d.moved){if(tp&&tp.dataset.t!==d.from)addWire(d.from,tp.dataset.t);sel=null}
 else{if(sel&&sel!==d.from){addWire(sel,d.from);sel=null}else if(sel===d.from)sel=null;else{sel=d.from;setStatus('Agora toque na porta de destino.')}}});
$('#bpump').onclick=()=>{if(lock)return;if(sim.fault){sim.fault=null;sim.pump=true}else sim.pump=!sim.pump;sfx.tick();dirty=true;if(sim.pump)say('Fonte ligada! Acione as válvulas e veja o que acontece.');else say('Fonte desligada.')};
$('#bundo').onclick=()=>{if(lock||!WR().length)return;WR().pop();sim.wires=[...(LV.pre||[]),...WR()];save();sfx.unplug();dirty=true};
$('#bclear').onclick=()=>{if(lock||!WR().length)return;S.wires[LV.id]=[];sim.wires=[...(LV.pre||[])];save();sfx.unplug();dirty=true};
/* ---------- loop ---------- */
let last=performance.now(),prevFault=null;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(sim&&!document.hidden){const before=JSON.stringify([sim.pump,Object.values(sim.cyl).map(c=>c.pos.toFixed(3)),Object.values(sim.comps).map(c=>c.s)]);
  step(sim,dt);const after=JSON.stringify([sim.pump,Object.values(sim.cyl).map(c=>c.pos.toFixed(3)),Object.values(sim.comps).map(c=>c.s)]);
  if(before!==after||dirty||sim.pump){drawBench();dirty=false}
  if(sim.fault&&sim.fault!==prevFault){prevFault=sim.fault;
   if(sim.fault==='burst'){sfx.alarm();setStatus('💥 A mangueira estourou! A bomba empurra o óleo e ele não tem saída. Falta a válvula de alívio ligando a linha de pressão ao tanque.','bad');say('Estourou! Toda hidráulica precisa de válvula de alívio.','bad')}
   else if(sim.fault==='leak'){sfx.bad();setStatus('⚠ A bomba está ligada direto no tanque: o óleo volta sem pressão.','bad');say('A bomba está ligada direto ao tanque, sem passar pelo alívio nem pelas válvulas.','bad')}}
  if(!sim.fault&&prevFault){prevFault=null}
  if(!sim.fault&&sim.msgs.length&&sim.pump)setStatus('⚠ '+sim.msgs[0],'bad')}
 requestAnimationFrame(loop)}
/* ---------- fases ---------- */
function stars(id){const n=S.stars[id]||0;return n?'★'.repeat(n)+'☆'.repeat(3-n):'☆☆☆'}
function drawNav(){$('#lv').innerHTML=`<div id="lvr" style="display:flex;gap:6px;flex-wrap:wrap">${GAME.levels.map(l=>`<button class="chip${l.id===LV.id?' cur':''}${l.boss?' boss':''}" data-l="${l.id}">${l.id}<i>${stars(l.id)}</i></button>`).join('')}</div>`;
 document.querySelectorAll('#lv .chip').forEach(b=>b.onclick=()=>{if(!lock){sfx.tick();openLevel(+b.dataset.l)}})}
function openLevel(id){LV=GAME.levels.find(l=>l.id===id);hints=0;attempts=0;tipShown=false;hl=null;sel=null;latch={};hintUsedSch=false;
 sim=newSim(LV,WR(),GAME.mode);sim.wires=[...(LV.pre||[]),...WR()];
 drawNav();$('#lesson').innerHTML=`<h2>${LV.boss?'🏆 ':''}Fase ${LV.id} · ${LV.name}</h2><p>${LV.goal}</p><div class="learn">💡 ${LV.learn}</div>`;
 $('#resbox').classList.add('hidden');setStatus('Monte o circuito, ligue a fonte e teste manualmente. Depois aperte ▶ Testar.');
 say(LV.boss?'Fase final! Monte tudo sozinho. Confie no que aprendeu.':'Vamos lá! Leia a trilha e depois monte as mangueiras.');
 dirty=true;drawBench();$('#scroll').scrollTo(0,0);
 if(typeof TRAIL!=='undefined'&&TRAIL[id]&&!S.seen[id])setTimeout(()=>{if(!lock)openTrail(id,0)},0)}
function showModal(h,w){$('#mbody').innerHTML=h;$('#mbody').style.maxWidth=w||'';$('#modal').classList.remove('hidden')}
function hideModal(){$('#modal').classList.add('hidden');$('#mbody').style.maxWidth=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')hideModal()});
$('#snd').textContent=S.sound?'🔊':'🔇';$('#snd').onclick=()=>{S.sound=!S.sound;$('#snd').textContent=S.sound?'🔊':'🔇';save()};
/* trilha */
let trStep=0;
function openTrail(id,step){const steps=TRAIL[id];if(!steps)return;trStep=step||0;const s=steps[trStep],last=trStep===steps.length-1,lv=GAME.levels.find(l=>l.id===id);
 const fig=!s.fig?'':s.fig==='schem'?schemHTML(lv):figComp(s.fig);
 const dots=steps.map((_,i)=>`<span style="display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid ${INK};margin:0 3px;background:${i===trStep?'var(--yellow)':i<trStep?'var(--green)':'#fff'}"></span>`).join('');
 showModal(`<h2>📖 Trilha · Fase ${id}</h2><div>${dots}</div><h3 style="margin:8px 0 2px">${s.t}</h3><p style="text-align:left">${s.p}</p>${fig}${last?`<p style="background:#f3efff;border-radius:10px;padding:8px"><b>🎯 Missão:</b> ${lv.goal}</p>`:''}<div class="mbts">${trStep>0?'<button class="btn" id="t-prev">◀ Voltar</button>':''}<button class="btn run" id="t-next">${last?'Começar a fase 🚀':'Próximo ▶'}</button></div><p><a href="#" id="t-skip" style="font-size:12px">pular trilha</a></p>`,'760px');
 const end=()=>{S.seen[id]=1;save();hideModal()};
 const pv=document.getElementById('t-prev');if(pv)pv.onclick=()=>openTrail(id,trStep-1);
 $('#t-next').onclick=()=>{sfx.tick();if(last)end();else openTrail(id,trStep+1)};
 $('#t-skip').onclick=e=>{e.preventDefault();end()}}
$('#btrail').onclick=()=>{if(!lock){sfx.tick();openTrail(LV.id,0)}};
$('#bsch').onclick=()=>{if(lock)return;if(LV.boss&&!hintUsedSch){hintUsedSch=true;hints++}
 showModal(`<h2>📐 Esquema · Fase ${LV.id}</h2>${schemHTML(LV)}${LV.boss?'<p class="hint" style="font-size:12px">Abrir o esquema nesta fase conta como 1 dica.</p>':''}<div class="mbts"><button class="btn run" id="m-x">Voltar à montagem</button></div>`,'980px');$('#m-x').onclick=hideModal};
$('#bcomp').onclick=()=>{if(lock)return;const seen=[...new Set(LV.comps.map(c=>c.type))];
 showModal(`<h2>🧩 Componentes desta fase</h2><div style="text-align:left">${seen.map(t=>`<div style="margin:8px 0;padding:8px;border:2px solid var(--grey);border-radius:12px"><b>${CINFO[t][0]}</b><p style="margin:2px 0">${CINFO[t][1]}</p>${figComp(t)}</div>`).join('')}</div><div class="mbts"><button class="btn run" id="m-x">Fechar</button></div>`,'640px');$('#m-x').onclick=hideModal};
$('#bhint').onclick=()=>{if(lock)return;hints++;sfx.tick();
 if(!tipShown){tipShown=true;say('💡 '+LV.tip);setStatus('💡 '+LV.tip);return}
 const w=LV.sol.find(x=>!hasW(x));if(!w){say('Todas as mangueiras certas já estão aí! Se não funcionar, teste a fonte e as válvulas manualmente.');return}
 hl=[w[0],w[1]];dirty=true;setStatus(`💡 Falta ligar: ${w[0]} ↔ ${w[1]} (portas piscando)`);say(`Falta uma mangueira entre ${w[0]} e ${w[1]}.`);
 setTimeout(()=>{hl=null;dirty=true},6000)};
/* testar */
$('#btest').onclick=()=>{if(lock)return;attempts++;const res=LV.tests.map(t=>{const ex=Object.fromEntries(Object.entries(t.ex).filter(e=>e[1]!==undefined));const sm=runScript(LV,WR(),t.st,GAME.mode);const bad=checkEx(sm,ex);if(sm.fault==='burst'&&!bad.length&&ex.fault!=='none'){}return{n:t.n,ok:!bad.length,bad}});
 const okAll=res.every(r=>r.ok);const rb=$('#resbox');rb.classList.remove('hidden');
 rb.innerHTML=`<h3>Resultado do teste ${okAll?'✅':''}</h3><ul>${res.map(r=>`<li class="${r.ok?'ok':'bad'}">${r.ok?'✔':'✘'} ${r.n}${r.ok?'':`<small>${r.bad.join(' · ')}</small>`}</li>`).join('')}</ul>`;
 rb.scrollIntoView({behavior:'smooth',block:'nearest'});
 if(okAll){const st=hints===0&&attempts<=3?3:hints<=2?2:1;S.stars[LV.id]=Math.max(S.stars[LV.id]||0,st);save();drawNav();sfx.win();say('Fase concluída! Você montou o circuito certinho.');showWin(st)}
 else{sfx.bad();say('Ainda não passou em todos os testes. Veja o que falhou e ajuste as mangueiras.','bad')}};
function showWin(stars){const i=GAME.levels.findIndex(l=>l.id===LV.id),nx=GAME.levels[i+1];
 showModal(`<h2>${LV.boss?'🏆':'🎉'} Fase ${LV.id} concluída!</h2><div class="bigstars">${'★'.repeat(stars)+'☆'.repeat(3-stars)}</div><p>${LV.learn}</p><p style="font-size:12px;opacity:.7">3 estrelas: sem dicas e em até 3 testes · 2 estrelas: até 2 dicas</p><div class="mbts"><button class="btn" id="m-stay">Ficar na fase</button>${nx?'<button class="btn run" id="m-next">Próxima fase ▶</button>':'<span>🏁 Você terminou o jogo!</span>'}</div>`);
 $('#m-stay').onclick=hideModal;if(nx)$('#m-next').onclick=()=>{hideModal();openLevel(nx.id)}}
const first=GAME.levels.find(l=>!S.stars[l.id]);
openLevel(first?first.id:1);requestAnimationFrame(loop);

</script></body></html>
