<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fábrica Maluca do Relê</title>
<style>
:root{--ink:#2b2250;--bg1:#fff3c9;--bg2:#ffd9ec;--purple:#6c4cf1;--pink:#ff5fa2;--yellow:#ffd23f;--teal:#2ec4b6;--orange:#ff9f1c;--green:#19c37d;--grey:#c3bddb;--red:#ff4d5e;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,select{-webkit-user-select:auto;user-select:auto}
h1,h2,p{margin:0}
h2{font-size:15px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.hidden{display:none!important}
#app{display:grid;height:100vh;height:100dvh;padding:10px;gap:10px;grid-template-columns:158px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "pal ed mach" "foot foot foot"}
.btn{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:12px}
.btn.run{background:var(--green);color:#fff}.btn.stop{background:var(--red);color:#fff}.btn.rst{background:var(--yellow)}.btn.chk{background:var(--purple);color:#fff}
/* header */
#top{grid-area:top;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.row1,.row2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;font-size:18px;color:var(--purple);white-space:nowrap}
#lv{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.chip{width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:#fff;font:inherit;font-weight:900;font-size:15px;line-height:1;cursor:pointer;padding:0;color:var(--ink)}
.chip i{display:block;font-style:normal;font-size:8px;color:var(--orange);letter-spacing:-1px;margin-top:1px}
.chip.bonus{border-color:var(--purple)}.chip.cur{background:var(--yellow)}.chip.lock{opacity:.45;cursor:not-allowed}
.row2{justify-content:space-between}
.ttl{flex:1;min-width:220px}
.ttl h1{font-size:19px}
.ttl p{font-size:14px;margin-top:2px}
.side{display:flex;align-items:center;gap:10px}
#stars{font-size:26px;color:var(--orange);letter-spacing:2px}
/* palette */
#pal{grid-area:pal;padding:10px;overflow:auto}
#pal h2{margin-bottom:8px}
.pitem{display:flex;align-items:center;gap:8px;padding:7px;border:3px solid var(--ink);border-radius:12px;background:#fff7d6;cursor:grab;margin-bottom:8px;font-weight:800;font-size:12px;line-height:1.1}
.pitem small{display:block;font-weight:600;font-size:10px;opacity:.7}
.pitem svg{width:38px;height:28px;flex:none}
.pitem .mini{flex:none;width:38px;height:26px;border:3px solid var(--ink);border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:900;background:#fff}
.pitem.armed{background:var(--yellow);transform:scale(1.04)}
.pitem.locked{opacity:.4;cursor:not-allowed;filter:grayscale(1)}
.tip{font-size:11px;opacity:.75;margin-top:6px;line-height:1.3}
/* editor */
#ed{grid-area:ed;display:flex;flex-direction:column;min-height:0;min-width:0}
.edtop{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:3px dashed var(--grey);gap:8px;flex-wrap:wrap}
#rungs{overflow:auto;padding:14px 12px 24px;flex:1;min-height:0}
.rung{position:relative;display:flex;align-items:stretch;margin:0 0 16px;padding-left:28px;width:max-content;min-width:100%}
.rnum{position:absolute;left:0;top:30px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.rail{width:9px;background:var(--grey);border-radius:5px;flex:none;transition:background .1s}
.rail.on{background:var(--green)}
.rdel{align-self:flex-start;margin:28px 0 0 8px;border:0;background:none;font-size:18px;cursor:pointer}
.cols{display:flex;align-items:flex-start}
.col{position:relative;width:96px;flex:none}
.cell{position:relative;height:84px}
.cell.row1.empty{height:34px}
.cell.out{width:150px}
.cell .wl,.cell .wr{position:absolute;top:50%;height:6px;margin-top:-3px;background:var(--grey);border-radius:3px;transition:background .1s}
.cell.row1.empty .wl,.cell.row1.empty .wr{display:none}
.cell.in .wl,.cell.pass .wr{background:var(--green)}
.cell .wl{left:0;right:calc(50% + 16px)}.cell .wr{left:calc(50% + 16px);right:0}
.cell.k-COIL .wl{right:calc(50% + 15px)}.cell.k-COIL .wr{left:calc(50% + 15px)}
.cell.k-TON .wl,.cell.k-CTU .wl{right:calc(50% + 40px)}.cell.k-TON .wr,.cell.k-CTU .wr{left:calc(50% + 40px)}
.cell.thru .wl{right:50%}.cell.thru .wr{left:50%}
.col.par::before,.col.par::after{content:"";position:absolute;top:42px;width:6px;height:84px;background:var(--grey);border-radius:3px;transition:background .1s}
.col.par::before{left:0}.col.par::after{right:0}
.col.par.in::before{background:var(--green)}.col.par.out::after{background:var(--green)}
.ph{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:46px;height:30px;padding:0 8px;border:2px dashed var(--grey);border-radius:10px;display:grid;place-items:center;color:#a39cc4;font-weight:800;font-size:12px;background:#fff;white-space:nowrap}
.cell.row1 .ph{height:24px;font-size:10px}
body[data-armed="contact"] .cell[data-zone="c"].empty .ph,body[data-armed="out"] .cell[data-zone="o"].empty .ph{border-color:var(--pink);color:var(--pink);animation:pulse 1s infinite}
.cell.over .ph{background:var(--yellow);border-style:solid;border-color:var(--ink)}
.piece{position:absolute;inset:0;color:var(--ink)}
.cell.pass .piece .symw{color:var(--green)}
.piece select,.piece input{font:inherit;font-size:10.5px;font-weight:700;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
.piece>select{position:absolute;left:3px;top:0;width:76px;height:22px;padding:0 2px}
.cell.out .piece>select{width:104px}
.symw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);line-height:0}
.cap{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10px;font-weight:700;opacity:.6;height:20px;line-height:20px}
.cap.row{opacity:1;display:flex;align-items:center;justify-content:center;gap:3px}
.cap.row input{width:44px;height:19px;padding:0 2px}
.cap.row select{width:62px;height:19px;padding:0}
.rm{position:absolute;right:1px;top:2px;width:17px;height:17px;border-radius:50%;border:2px solid var(--ink);background:var(--pink);color:#fff;font-size:11px;line-height:1;font-weight:900;padding:0;cursor:pointer}
.box{width:78px;height:40px;border:3px solid currentColor;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:#fff;font-weight:900;font-size:13px}
.box small{font-size:10px;font-weight:700;margin-top:3px;color:var(--ink)}
/* machine */
#mach{grid-area:mach;display:flex;flex-direction:column;padding:10px;gap:8px;min-height:0;overflow:auto}
#mview{border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#eaf4ff}
#mview svg{display:block;width:100%;height:auto}
#glow,#rays,#heat,#steam{transition:opacity .15s}
#mbtns{display:flex;flex-wrap:wrap;gap:8px}
.mbtn{flex:1 1 90px;font:inherit;border:3px solid var(--ink);border-radius:14px;padding:8px 6px;font-weight:900;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 var(--ink);background:#fff;touch-action:none}
.mbtn small{display:block;font-weight:600;font-size:10px;opacity:.7}
.mbtn.green{background:#b8f2d6}.mbtn.red{background:#ffc2c8}.mbtn.yellow{background:#fff0a6}.mbtn.blue{background:#c3dcff}
.mbtn.emg{background:var(--red);color:#fff;border-radius:50px}
.mbtn.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);filter:brightness(.88);outline:4px solid var(--green)}
.mbtn.toggle::after{content:" ⏻";font-size:11px}
/* footer */
#foot{grid-area:foot;display:flex;align-items:center;gap:12px;padding:8px 12px}
#relewrap{width:64px;flex:none}
#rele{width:64px;height:70px;display:block;animation:bob 2.4s ease-in-out infinite}
#bubble{flex:1;position:relative;background:#f3efff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.3;min-height:48px;display:flex;align-items:center}
#bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hl{animation:pulse 1s infinite;outline:4px solid var(--pink);outline-offset:2px}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(43,34,80,.55);display:grid;place-items:center;z-index:50;padding:12px}
.mcard{max-width:520px;width:100%;padding:18px;max-height:92vh;overflow:auto;text-align:center}
.mcard h2{font-size:22px;margin-bottom:8px}
.mcard p{margin:6px 0;font-size:14px;line-height:1.4}
.bigstars{font-size:44px;color:var(--orange);letter-spacing:4px}
.tests{list-style:none;padding:0;margin:10px 0;text-align:left}
.tests li{padding:6px 10px;border-radius:10px;margin-bottom:5px;font-size:13px;font-weight:700}
.tests li.ok{background:#d6f7e7}.tests li.bad{background:#ffdde1}
.tests li small{display:block;font-weight:600;margin-top:2px}
.mbts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.mcard.wide{max-width:720px}
.mcard h3{margin:8px 0 4px;font-size:17px;color:var(--purple)}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots span{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots span.on{background:var(--yellow)}
.lex{border:3px dashed var(--grey);border-radius:14px;padding:10px 8px 2px;margin:8px 0;overflow:auto;text-align:left;background:#fbfaff;pointer-events:none}
.lex .rm,.lex .rdel{display:none}
.lex select,.lex input{appearance:none;-webkit-appearance:none}
.lbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.lcap{font-size:12px;opacity:.8}
.lbtns .mbtn{flex:0 1 150px}
.hintcard{text-align:left;background:#fff7d6;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;margin:8px 0}
.hintcard p{margin:2px 0 0}
.mcard a{color:var(--purple);font-size:12px;font-weight:700}
@media(max-width:900px){
 #app{height:auto;min-height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "pal" "ed" "mach" "foot"}
 #pal{overflow:visible}#pal h2,.tip{display:none}
 #pal,#mach,#top,#foot{min-width:0}
 #pitems{display:flex;gap:8px;overflow-x:auto;max-width:100%}
 .pitem{flex:none;margin:0}
 #rungs{min-height:260px}
 #foot{position:sticky;bottom:6px;z-index:20;flex-wrap:wrap;padding:6px 8px;gap:8px}
 #relewrap,#rele{width:44px;height:48px}
 #bubble{min-width:150px;font-size:12px;padding:6px 8px;min-height:40px}
 .btns{width:100%;justify-content:center}
 .btn{padding:6px 10px;font-size:13px}
 .logo{font-size:15px}.ttl h1{font-size:16px}
}
</style>
</head>
<body data-armed="">
<div id="app">
 <header id="top" class="card">
  <div class="row1">
   <div class="logo">🍬 Fábrica Maluca do Relê</div><a class="btn sm" href="../index.html" style="text-decoration:none" title="Voltar ao portal">🏠 Portal</a>
   <nav id="lv"></nav>
   <div><button class="btn sm" id="snd" title="Sons">🔊</button> <button class="btn sm" id="rstp" title="Zerar progresso">↺ Zerar</button></div>
  </div>
  <div class="row2">
   <div class="ttl"><h1 id="ltitle"></h1><p id="lmission"></p></div>
   <div class="side"><div id="stars"></div><button class="btn sm" id="lessonbtn">📖 Trilha</button><button class="btn sm rst" id="hintbtn">💡 Dica</button></div>
  </div>
 </header>
 <aside id="pal" class="card"><h2>🧰 Peças</h2><div id="pitems"></div><p class="tip">Arraste a peça para a linha. No celular: toque na peça e depois no espaço pontilhado.</p></aside>
 <main id="ed" class="card">
  <div class="edtop"><h2>🪜 Diagrama Ladder</h2><div><button class="btn sm" id="addrung">＋ Linha</button> <button class="btn sm" id="clear">🧹 Limpar</button></div></div>
  <div id="rungs"></div>
 </main>
 <section id="mach" class="card"><h2>🏭 Máquina</h2><div id="mview"></div><div id="mbtns"></div></section>
 <footer id="foot" class="card">
  <div id="relewrap">
   <svg id="rele" viewBox="0 0 90 100">
    <line x1="45" y1="8" x2="45" y2="22" stroke="#2b2250" stroke-width="4"/><circle cx="45" cy="7" r="6" fill="#ff5fa2" stroke="#2b2250" stroke-width="3"/>
    <rect x="22" y="80" width="46" height="16" rx="7" fill="#ff9f1c" stroke="#2b2250" stroke-width="4"/>
    <rect x="3" y="38" width="8" height="22" rx="4" fill="#ffd23f" stroke="#2b2250" stroke-width="3"/><rect x="79" y="38" width="8" height="22" rx="4" fill="#ffd23f" stroke="#2b2250" stroke-width="3"/>
    <rect x="10" y="20" width="70" height="58" rx="17" fill="#7fd8ff" stroke="#2b2250" stroke-width="4"/>
    <rect x="18" y="29" width="54" height="36" rx="11" fill="#2b2250"/>
    <circle class="eye" id="e1" cx="35" cy="44" r="5" fill="#7cff8a"/><circle class="eye" id="e2" cx="55" cy="44" r="5" fill="#7cff8a"/>
    <path id="mouth" d="M36 54Q45 63 54 54" stroke="#7cff8a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="25" cy="58" r="3" fill="#ff5fa2" opacity=".8"/><circle cx="65" cy="58" r="3" fill="#ff5fa2" opacity=".8"/>
   </svg>
  </div>
  <div id="bubble"></div>
  <div class="btns">
   <button class="btn run" id="run">▶ RODAR</button>
   <button class="btn stop" id="stop" disabled>■ PARAR</button>
   <button class="btn rst" id="restart">↻ REINICIAR</button>
   <button class="btn chk" id="chk">✓ VERIFICAR</button>
  </div>
 </footer>
</div>
<div id="modal" class="overlay hidden"><div class="mcard card" id="mbody"></div></div>

<script>
/*PURE_START*/
const S={set:o=>({set:o}),w:s=>({w:s}),pulse:a=>({pulse:a}),ex:(o,msg)=>({ex:o,msg})};
const rep=(n,s)=>Array(n).fill(s);
const press=(a,t=.3)=>[S.set({[a]:true}),S.w(t),S.set({[a]:false}),S.w(.3)];
const off=(...q)=>{const o={};q.forEach(k=>o[k]=false);return o};

const LEVELS=[
{id:1,name:'Lâmpada da entrada',mach:'lamp',cols:2,rungs:1,par:2,pieces:['NA','COIL'],
 mission:'Acenda a lâmpada (Q0.0) enquanto o botão Liga (I0.0) estiver apertado.',
 story:'Bem-vindo(a), técnico(a)! A lâmpada da entrada da fábrica está apagada. Vamos acendê-la com o seu primeiro circuito Ladder!',
 inputs:[{a:'I0.0',l:'Liga',t:'push',c:'green'}],
 outs:[{a:'Q0.0',l:'Lâmpada'}],
 hints:['Use o Contato NA (normalmente aberto): ele fecha quando o botão é apertado. Depois ponha a Bobina no fim da linha.','Escolha I0.0 no contato (botão Liga) e Q0.0 na bobina (a lâmpada).','A linha fica: trilho esquerdo — [NA I0.0] — (Q0.0) — trilho direito. Aperte RODAR e segure o botão Liga.'],
 tests:[
  {name:'Sem apertar nada, a lâmpada fica apagada',steps:[S.w(.3),S.ex({'Q0.0':false},'A lâmpada acendeu sozinha! Sem apertar o botão ela deve ficar apagada.')]},
  {name:'Apertou Liga: a lâmpada acende',steps:[S.set({'I0.0':true}),S.w(.3),S.ex({'Q0.0':true},'Apertei o botão e a lâmpada não acendeu. Ligue um contato NA de I0.0 até a bobina Q0.0.')]},
  {name:'Soltou Liga: a lâmpada apaga',steps:[S.set({'I0.0':true}),S.w(.3),S.set({'I0.0':false}),S.w(.3),S.ex({'Q0.0':false},'Soltei o botão e a lâmpada continuou acesa. Nesta fase ela só acende enquanto o botão estiver apertado.')]}
 ]},
{id:2,name:'Esteira com botão de parar',mach:'belt',cols:3,rungs:1,par:3,pieces:['NA','NF','COIL'],
 mission:'A esteira (Q0.0) roda com a chave Liga (I0.0) ligada, mas para quando o botão Parar (I0.1) é apertado.',
 story:'A esteira de balas precisa de um botão de parar! Descubra para que serve o contato NF (normalmente fechado).',
 inputs:[{a:'I0.0',l:'Liga',t:'toggle',c:'green'},{a:'I0.1',l:'Parar',t:'push',c:'red'}],
 outs:[{a:'Q0.0',l:'Esteira'}],
 hints:['A chave Liga fica ligada. O botão Parar só é apertado de vez em quando. A esteira roda quando Liga está ligada E Parar NÃO está apertado.','Ponha dois contatos em série (um depois do outro): um NA para Liga (I0.0) e um NF para Parar (I0.1).','A linha fica: [NA I0.0] — [NF I0.1] — (Q0.0).'],
 tests:[
  {name:'Esteira começa parada',steps:[S.w(.3),S.ex({'Q0.0':false},'A esteira andou sozinha! Ela só deve rodar com a chave Liga ligada.')]},
  {name:'Chave Liga ligada: a esteira anda',steps:[S.set({'I0.0':true}),S.w(.3),S.ex({'Q0.0':true},'Liguei a chave e a esteira não andou. Use um contato NA em I0.0.')]},
  {name:'Apertar Parar: a esteira para',steps:[S.set({'I0.0':true}),S.w(.3),S.set({'I0.1':true}),S.w(.3),S.ex({'Q0.0':false},'Apertei Parar e a esteira continuou! O contato de Parar (I0.1) precisa ser NF, em série com o Liga.')]},
  {name:'Soltar Parar: a esteira volta a andar',steps:[S.set({'I0.0':true,'I0.1':true}),S.w(.3),S.set({'I0.1':false}),S.w(.3),S.ex({'Q0.0':true},'Soltei o Parar e a esteira não voltou. Com o contato NF, ela deve voltar enquanto Liga estiver ligada.')]},
  {name:'Chave desligada: a esteira para',steps:[S.set({'I0.0':true}),S.w(.3),S.set({'I0.0':false}),S.w(.3),S.ex({'Q0.0':false},'Desliguei a chave e a esteira continuou rodando.')]}
 ]},
{id:3,name:'Esteira com selo',mach:'belt',cols:3,rungs:1,par:4,pieces:['NA','NF','COIL'],
 mission:'Aperte Liga (I0.0) uma vez e a esteira (Q0.0) continua rodando; ela só para com Desliga (I0.1).',
 story:'Agora a esteira precisa "lembrar" que foi ligada. Esse truque famoso do Ladder se chama SELO (ou retenção).',
 inputs:[{a:'I0.0',l:'Liga',t:'push',c:'green'},{a:'I0.1',l:'Desliga',t:'push',c:'red'}],
 outs:[{a:'Q0.0',l:'Esteira'}],
 hints:['Os botões são soltos logo depois de apertados. A saída Q0.0 pode ajudar a esteira a lembrar: use o próprio Q0.0 como contato!','Coloque um contato NA de Q0.0 logo abaixo do contato Liga (paralelo = OU). Depois um NF de Desliga (I0.1) em série.','A linha fica: [NA I0.0 // NA Q0.0] — [NF I0.1] — (Q0.0).'],
 tests:[
  {name:'Esteira começa parada',steps:[S.w(.3),S.ex({'Q0.0':false},'A esteira andou sozinha!')]},
  {name:'Liga e solta: a esteira continua',steps:[...press('I0.0'),S.w(.5),S.ex({'Q0.0':true},'Soltei o botão Liga e a esteira parou. Faltou o selo: ponha um contato NA de Q0.0 em paralelo com o Liga.')]},
  {name:'Desliga para a esteira (e ela não volta sozinha)',steps:[...press('I0.0'),...press('I0.1'),S.ex({'Q0.0':false},'Apertei Desliga e a esteira não parou. Use um contato NF para o botão Desliga (I0.1).'),S.w(1),S.ex({'Q0.0':false},'A esteira ligou sozinha depois do Desliga!')]},
  {name:'Desliga tem prioridade sobre Liga',steps:[S.set({'I0.0':true,'I0.1':true}),S.w(.4),S.ex({'Q0.0':false},'Apertei Liga e Desliga juntos e a esteira ligou. Na segurança, o Desliga deve mandar mais!')]}
 ]},
{id:4,name:'Misturador com porta de segurança',mach:'mixer',cols:3,rungs:1,par:4,pieces:['NA','NF','COIL'],

function makeEngine(){
 const e={in:{},bits:{},tm:{},ct:{},flow:[],
  get(a){const k=a[0];if(k==='I')return !!e.in[a];if(k==='T')return !!(e.tm[a]&&e.tm[a].done);if(k==='C')return !!(e.ct[a]&&e.ct[a].done);return !!e.bits[a]},
  scan(dt,prog){
   const flow=[];
   for(const r of prog.rungs){
    let p=true;const fcols=[];
    for(const col of r.cols){
     const cin=p;let any=false,cout=false;const cells=[];
     for(let row=0;row<2;row++){
      const c=col[row];if(!c){cells.push(null);continue}
      any=true;const v=e.get(c.addr);const closed=c.kind==='NF'?!v:v;const pass=cin&&closed;
      cells.push({pass});if(pass)cout=true;
     }
     if(!any)cout=cin;
     fcols.push({in:cin,out:cout,cells});p=cout;
    }
    const o=r.out;
    if(o){
     if(o.kind==='COIL')e.bits[o.addr]=p;
     else if(o.kind==='TON'){const t=e.tm[o.addr]||(e.tm[o.addr]={acc:0,done:false});if(p){t.acc+=dt;if(t.acc>=(o.preset||1)-1e-9)t.done=true}else{t.acc=0;t.done=false}}
     else if(o.kind==='CTU'){const c=e.ct[o.addr]||(e.ct[o.addr]={count:0,done:false,prev:false});if(o.reset&&e.get(o.reset))c.count=0;else if(p&&!c.prev)c.count++;c.prev=p;c.done=c.count>=(o.preset||1)}
    }
    flow.push({cols:fcols,p});
   }
   e.flow=flow;
  }};
 return e;
}
function runTests(level,prog){
 const res=[];
 for(const t of level.tests){
  const eng=makeEngine();let fail=null;
  const sc=n=>{for(let i=0;i<n;i++)eng.scan(0.05,prog)};
  for(const s of t.steps){
   if(s.set)Object.assign(eng.in,s.set);
   else if(s.w)sc(Math.round(s.w/0.05));
   else if(s.pulse){eng.in[s.pulse]=true;sc(4);eng.in[s.pulse]=false;sc(4)}
   else if(s.ex){for(const a in s.ex){if(eng.get(a)!==s.ex[a]){fail=s.msg;break}}}
   if(fail)break;
  }
  res.push({name:t.name,ok:!fail,msg:fail});
 }
 return res;
}

function countPieces(p){let n=0;p.rungs.forEach(r=>{r.cols.forEach(c=>c.forEach(x=>{if(x)n++}));if(r.out)n++});return n}

/* ---- simulação ---- */
function resetMs(){for(const k in ms)delete ms[k];Object.assign(ms,{c:{},pv:{},off:0,phys:0,drops:[],lid:0,ang:0,dx:0,pr:0})}
function startSim(){
 if(sim.running)return;
 sim.eng=makeEngine();sim.running=true;sim.last=performance.now();sim.acc=0;resetMs();
 sim.timer=setInterval(tick,50);sfx.run();setBtns();
 say('Rodando! Aperte os botões da máquina e veja a corrente passar em <b style="color:#12a36a">verde</b>.','happy');
 tutUpdate();
}
function tick(){
 const now=performance.now();sim.acc+=Math.min(now-sim.last,300)/1000;sim.last=now;
 let n=0;while(sim.acc>=0.05&&n<8){sim.eng.scan(0.05,PR);sim.acc-=0.05;n++}
 applyFlow();
}
function stopSim(){
 clearInterval(sim.timer);sim.running=false;sim.eng=makeEngine();resetMs();
 applyFlow();setBtns();
}
function setBtns(){$('#run').disabled=sim.running;$('#stop').disabled=!sim.running}
function setInput(a,v){
 if(!sim.running){say('Primeiro aperte o botão verde <b>▶ RODAR</b> para ligar a fábrica!','think');sfx.fail();return false}
 sim.eng.in[a]=v;if(v)tut.pressed=true;tutUpdate();return true;
}
function pulse(a){
 if(sim.running&&sim.eng.in[a])return;
 if(setInput(a,true))setTimeout(()=>{if(sim.running)sim.eng.in[a]=false},170);
}
$('#run').onclick=startSim;
$('#stop').onclick=()=>{stopSim();say('Simulação parada. Edite o circuito com calma!','happy')};
$('#restart').onclick=()=>{const was=sim.running;stopSim();if(was)startSim();else say('Tudo reiniciado!','happy')};

}

mb.addEventListener('pointerdown',e=>{

 if(tut.on){tut.on=false;$$('.hl').forEach(x=>x.classList.remove('hl'))}
 const res=runTests(L,PR),ok=res.every(r=>r.ok);
 const list=`<ul class="tests">${res.map(r=>`<li class="${r.ok?'ok':'bad'}">${r.ok?'✔':'✘'} ${r.name}${r.ok?'':`<small>🤖 ${r.msg}</small>`}</li>`).join('')}</ul>`;
 if(!ok){
  const f=res.find(r=>!r.ok);say(`Quase lá! ${f.msg}`,'bad');sfx.fail();
  modal(`<h2>🔧 Ainda não funcionou</h2><p>${res.filter(r=>r.ok).length} de ${res.length} testes passaram.</p>${list}<div class="mbts"><button class="btn rst" id="m-close">Voltar ao circuito</button><button class="btn" id="m-hint">💡 Pedir dica</button></div>`);
  $('#m-close').onclick=closeModal;$('#m-hint').onclick=()=>{closeModal();$('#hintbtn').click()};
  return;
 }
 const pieces=countPieces(PR),stars=1+(pieces<=L.par?1:0)+(hintsUsed===0?1:0);
 P.stars[L.id]=Math.max(P.stars[L.id]||0,stars);
 if(L.id<LEVELS.length)P.unlocked=Math.max(P.unlocked,L.id+1);
 save();renderHeader();sfx.win();
 const last=L.id===LEVELS.length,boss1=L.id===8;
 say(last?'🏆 Você salvou a Fábrica Maluca de verdade! Eu estou MUITO orgulhoso!':boss1?'🏆 Chefão derrotado! Mas a fábrica tem FASES BÔNUS esperando você!':'🎉 Funcionou! Que técnico(a) incrível!','happy');
 modal(`<h2>${last?'🏆 Fábrica salva!':boss1?'🏆 Chefão derrotado! Fases bônus liberadas!':'🎉 Fase concluída!'}</h2><div class="bigstars">${starsHTML(stars)}</div><p>Peças usadas: <b>${pieces}</b> (meta: ${L.par}) · Dicas usadas: <b>${hintsUsed}</b></p><p style="font-size:12px;opacity:.7">3 estrelas = usar só as peças necessárias e nenhuma dica.</p>${list}<div class="mbts"><button class="btn" id="m-close">Continuar editando</button>${last?'<button class="btn run" id="m-first">Jogar de novo</button>':'<button class="btn run" id="m-next">Próxima fase ▶</button>'}</div>`);
 $('#m-close').onclick=closeModal;
 if(last)$('#m-first').onclick=()=>{closeModal();loadLevel(1)};else $('#m-next').onclick=()=>{closeModal();loadLevel(L.id+1)};
}
$('#chk').onclick=verify;

/* ---- fases ---- */
function validProgram(p,lv){
 try{return p&&p.rungs&&p.rungs.length>=1&&p.rungs.length<=8&&p.rungs.every(r=>r.cols.length===lv.cols&&r.cols.every(c=>c.length===2))}catch(e){return false}
}
function loadLevel(id){
 if(id>P.unlocked)return;
 stopSim();setArmed(null);closeModal();
 L=LEVELS[id-1];hintsUsed=0;
 PR=validProgram(P.programs[id],L)?P.programs[id]:newProgram(L);
 tut.on=(id===1&&!P.stars[1]);tut.st=-1;tut.pressed=false;
 renderHeader();renderPalette();renderRungs();buildMach();setBtns();
 if(tut.on)tutUpdate();else say(`<b>Fase ${L.id}:</b> ${L.story}`,'happy');
 $('#rungs').scrollTop=0;
 maybeLesson();
}
function maybeLesson(){if(P.welcomed&&!P.seen[L.id]&&LESSONS[L.id])openLesson(L.id)}
$('#lv').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b&&!b.classList.contains('lock'))loadLevel(+b.dataset.lv);else if(b){say('Essa fase ainda está trancada. Complete a anterior para liberar!','think');sfx.fail()}});
$('#snd').onclick=()=>{P.sound=!P.sound;save();renderHeader();if(P.sound)sfx.click()};
$('#rstp').onclick=()=>{ask('↺ Zerar tudo','Apagar <b>todo</b> o progresso: estrelas, fases desbloqueadas e circuitos salvos? Não dá para desfazer.','Sim, zerar tudo',()=>{
 try{localStorage.removeItem(KEY)}catch(e){}
 P=Object.assign({},DEF,{stars:{},programs:{},seen:{},unlocked:1,welcomed:true});save();
 loadLevel(1);say('Tudo zerado! Vamos começar a Fábrica Maluca do zero. 🍬','happy');
})};

/* ---- trilha: mini-lições interativas antes de cada fase ---- */
const NAc=a=>({kind:'NA',addr:a}),NFc=a=>({kind:'NF',addr:a});
const RG=(cols,out)=>({cols:cols.map(c=>Array.isArray(c)?[c[0]||null,c[1]||null]:[c,null]),out});
const OC=a=>({kind:'COIL',addr:a}),OT=(a,p)=>({kind:'TON',addr:a,preset:p}),OCT=(a,p,r)=>({kind:'CTU',addr:a,preset:p,reset:r||''});
const IA={a:'I0.6',l:'Botão A',t:'push',c:'green'},IB={a:'I0.7',l:'Botão B',t:'push',c:'blue'},IS={a:'I0.5',l:'Sensor',t:'pulse',c:'yellow'},IR={a:'I0.4',l:'Zerar',t:'push',c:'red'};
const LBL={'Q0.6':'Luz X','Q0.7':'Luz Y','T9':'Temporizador','T8':'Temporizador','C9':'Contador'};
const LESSONS={
1:[
 {t:'O que é Ladder?',p:'Ladder é a linguagem dos CLPs e parece uma <b>escada deitada</b>. Os dois lados são os <b>trilhos</b> (a energia) e cada degrau é uma <b>linha</b>. Se a corrente conseguir ir do trilho esquerdo até o direito, a <b>saída liga</b>.',ex:{inputs:[IA],rungs:[RG([NAc('I0.6')],OC('Q0.6'))],cap:'Exemplo de outra máquina: segure o Botão A e veja a corrente ficar verde e a Luz X acender.'}},
 {t:'As duas peças desta fase',p:'<b>Contato NA</b> (normalmente aberto): deixa a corrente passar só quando a entrada está <b>ligada</b>.<br><b>Bobina</b>: é a saída. Quando recebe corrente, liga a lâmpada, o motor, a esteira...'},
 {t:'Endereços',p:'<b>I</b> = entrada (botões e sensores). <b>Q</b> = saída (lâmpadas e motores). Você escolhe o endereço no seletor em cima de cada peça. Leia a missão para saber quais endereços usar!'}],
2:[
 {t:'Contato NF: o contrário do NA',p:'O <b>Contato NF</b> (normalmente fechado) deixa a corrente passar quando a entrada está <b>desligada</b>. Quando a entrada liga (botão apertado), ele <b>abre</b> e corta a corrente.',ex:{inputs:[IB],rungs:[RG([NFc('I0.7')],OC('Q0.6'))],cap:'Esta luz fica acesa sozinha. Segure o Botão B e ela apaga!'}},
 {t:'Peças em série = E',p:'Peças <b>uma depois da outra</b> (em série) funcionam como <b>E</b>: todas precisam deixar a corrente passar.',ex:{inputs:[IA,IB],rungs:[RG([NAc('I0.6'),NAc('I0.7')],OC('Q0.6'))],cap:'A Luz X só acende com o Botão A E o Botão B apertados juntos.'}},
 {t:'Pense antes de montar',p:'Na esteira, o que precisa estar certo para ela rodar? E o que deve fazê-la parar? Decida quais peças ficam em série.'}],
3:[
 {t:'O problema do botão',p:'Um botão de pressão só fica ligado enquanto você segura. Se a esteira ligasse só assim, ela pararia assim que você soltasse o dedo! A esteira precisa <b>lembrar</b> que foi ligada.'},
 {t:'Paralelo = OU',p:'Peças <b>uma embaixo da outra</b> (em paralelo) funcionam como <b>OU</b>: basta uma deixar a corrente passar. Para pôr em paralelo, solte a peça no espaço "ou".',ex:{inputs:[IA,IB],rungs:[RG([[NAc('I0.6'),NAc('I0.7')]],OC('Q0.6'))],cap:'Qualquer um dos dois botões acende a Luz X.'}},
 {t:'A saída que se lembra',p:'Veja o truque: o <b>próprio contato da saída</b> (Q0.6) em paralelo com o botão. Depois que a saída liga, ela mesma mantém a corrente, e isso é o <b>selo</b>. Neste exemplo falta uma peça: a luz acende, mas nunca mais apaga!',ex:{inputs:[IA],rungs:[RG([[NAc('I0.6'),NAc('Q0.6')]],OC('Q0.6'))],cap:'Aperte e solte o Botão A: a luz fica acesa para sempre. Na sua fase, qual peça faria parar?'}}],
4:[
 {t:'E e OU juntos',p:'<b>Série (E)</b>: todas as peças precisam conduzir. <b>Paralelo (OU)</b>: basta uma conduzir. Você pode combinar os dois na mesma linha.',ex:{inputs:[IA,IB,IS],rungs:[RG([[NAc('I0.6'),NAc('I0.7')]],OC('Q0.6'))],cap:'Exemplo só de OU: A ou B acende a luz.'}},
 {t:'Segurança em série',p:'Travas de segurança, como a porta, ficam <b>em série</b> com todo o resto: se uma delas abrir, a máquina para, não importa o que mais esteja ligado. Pense em onde cada peça da missão deve entrar.'}],
5:[
 {t:'Temporizador TON',p:'O <b>TON</b> (atraso para ligar) conta o tempo enquanto recebe corrente. Ao chegar no tempo programado, liga o seu bit de pronto (aqui <b>T9</b>), que você usa como contato. Se a corrente some, ele zera.',ex:{inputs:[IA],rungs:[RG([NAc('I0.6')],OT('T9',3)),RG([NAc('T9')],OC('Q0.6'))],cap:'Segure o Botão A por 3 segundos: o tempo aparece na caixinha e a Luz X acende no fim.'}},
 {t:'Pense antes de montar',p:'O forno precisa ficar ligado sozinho (você já sabe como) e depois parar sozinho. Que peça poderia cortar a corrente quando o tempo acabar? Lembre que um TON só conta se a sua linha estiver recebendo corrente.'}],
6:[
 {t:'Contador CTU',p:'O <b>CTU</b> soma <b>1</b> cada vez que a entrada vai de desligada para ligada (um pulso). Ao chegar no valor <b>PV</b>, liga o seu bit de pronto (aqui <b>C9</b>), que você usa como contato. A entrada <b>R</b> (reset) zera a contagem.',ex:{inputs:[IS,IR],rungs:[RG([NAc('I0.5')],OCT('C9',3,'I0.4'))],cap:'Aqui PV = 3. Clique em Sensor 3 vezes e veja a contagem. Use Zerar para voltar a 0.'}},
 {t:'Pense antes de montar',p:'Quantas balas a caixa precisa? Quem deve contar, e o que deve acontecer quando a contagem chegar lá? Use o resultado do contador como se fosse um botão.'}],
7:[
 {t:'Temporizadores em cadeia',p:'Para fazer uma sequência, o bit de pronto de um TON pode <b>iniciar</b> o próximo. Assim cada etapa começa quando a anterior termina.',ex:{inputs:[IA],rungs:[RG([NAc('I0.6')],OT('T8',2)),RG([NAc('T8')],OT('T9',2))],cap:'Segure o Botão A: primeiro um temporizador conta 2 s, depois o outro.'}},
 {t:'Pense antes de montar',p:'Desenhe no papel a linha do tempo: o que acende em cada etapa? Cada luz depende de qual relógio? E como o ciclo volta ao começo? Se travar, use as dicas.'}],
8:[
 {t:'Juntando tudo',p:'No chefão você usa tudo: <b>selo</b>, <b>NF</b> de segurança, <b>série</b>, <b>contador</b> e <b>várias saídas</b>. Leia a missão e a história com calma, e transforme cada regra em uma linha ou em uma peça do circuito.'},
 {t:'Dividir para conquistar',p:'Monte um pedaço por vez e use o botão <b>✓ VERIFICAR</b> para ver quais testes já passam. Os testes dizem exatamente o que ainda está errado.'}],
9:[
 {t:'Dois relógios se revezando',p:'Para piscar, o bit de pronto de um TON <b>zera o outro</b>. T1 conta o tempo aceso; quando termina, T2 conta o apagado; quando T2 termina, ele <b>corta T1</b> (com um NF) e tudo recomeça.',ex:{inputs:[IA],rungs:[RG([NAc('I0.6'),NFc('T8')],OT('T9',1)),RG([NAc('T9')],OT('T8',1)),RG([NAc('I0.6'),NFc('T9')],OC('Q0.6'))],cap:'Segure o Botão A: a Luz X pisca sozinha, acesa 1 s e apagada 1 s.'}},
 {t:'Pense antes de montar',p:'Desenhe a linha do tempo: aceso 1 s, apagado 1 s. Quem conta cada parte? Quem faz o ciclo voltar ao começo?'}],
10:[
 {t:'Memória M: a anotação do CLP',p:'A <b>memória (M0.0)</b> é uma bobina interna: não liga nada na máquina, mas <b>guarda uma informação</b>. Ótima para lembrar de um pedido rápido, como o botão do pedestre, que só é apertado por um instante.'},
 {t:'Selo na memória',p:'O selo funciona com qualquer bobina, não só com saídas. A memória liga com o botão, se mantém sozinha e é cortada quando o ciclo termina. Depois é só usar M0.0 como contato nas outras linhas.'}],
11:[
 {t:'Reset automático',p:'O reset do CTU pode ser <b>qualquer endereço</b>, até uma memória. Se um temporizador ligar essa memória, o contador <b>se zera sozinho</b> depois de um tempo.'},
 {t:'Pense antes de montar',p:'Quem conta as 6 balas? Quem mantém a caixa fechada por 3 s? E quem zera o contador no fim? Cada uma dessas tarefas vira uma linha.'}],
12:[
 {t:'Contando ciclos',p:'Um contador pode contar <b>ciclos inteiros</b>: ligue-o ao bit de pronto do último temporizador. Cada vez que a rodada termina, ele soma 1 e, ao chegar no PV, corta o selo do lote.'},
 {t:'Juntando as ideias',p:'Você já sabe: <b>selo</b> (fase 3), <b>revezamento de TON</b> (fase 9), <b>memória</b> (fase 10) e <b>contador</b> (fase 6). Monte um pedaço por vez e use o ✓ VERIFICAR.'}],
13:[
 {t:'Partida com aviso',p:'Em máquina de verdade, uma <b>sirene avisa</b> antes de a esteira partir. A memória M0.0 vira o <b>"sistema armado"</b>: o TON conta 3 s a partir dela, a sirene toca durante a contagem e a esteira liga no fim.'},
 {t:'Último desafio',p:'Todas as condições de segurança (Desliga, Emergência, porta, caixa cheia) cortam o <b>selo de M0.0</b>, e isso para o aviso e a esteira de uma vez. Dividir para conquistar: um pedaço por vez!'}]
};
function fixLessonSelects(root,prog){
 $$('.cell',root).forEach(cell=>{const R=prog.rungs[+cell.dataset.r];const t=cell.dataset.c==='out'?R.out:R.cols[+cell.dataset.c][+cell.dataset.row];if(!t)return;
  $$('select',cell).forEach(sel=>{const v=t[sel.dataset.f];const lab=(LBL[v]||(ALLIN[v]||''));sel.innerHTML=`<option>${v?v+' · '+lab:'sem reset'}</option>`})})}
const ALLIN={'I0.6':'Botão A','I0.7':'Botão B','I0.5':'Sensor','I0.4':'Zerar'};
let lessonTimer=null,lesStep=0,lesEng=null;
function openLesson(id){lesStep=0;renderLesson(id)}
function endLesson(id){clearInterval(lessonTimer);P.seen[id]=1;save();closeModal()}
function renderLesson(id){
 clearInterval(lessonTimer);
 const steps=LESSONS[id],s=steps[lesStep],last=lesStep===steps.length-1,lv=LEVELS[id-1];
 const dots=steps.map((_,i)=>`<span class="${i===lesStep?'on':''}"></span>`).join('');
 modal(`<h2>📖 Trilha · Fase ${id}</h2><div class="dots">${dots}</div><h3>${s.t}</h3><p>${s.p}</p>${s.ex?`<div class="lex" id="lex"></div><div class="lbtns" id="lbtns"></div><p class="lcap">${s.ex.cap||''}</p>`:''}${last?`<p><b>🎯 Missão:</b> ${lv.mission}</p>`:''}<div class="mbts">${lesStep>0?'<button class="btn" id="l-prev">◀ Voltar</button>':''}<button class="btn run" id="l-next">${last?'Começar a fase 🚀':'Próximo ▶'}</button></div><p><a href="#" id="l-skip">pular trilha</a></p>`,true);
 if(s.ex){
  const prog={rungs:s.ex.rungs};lesEng=makeEngine();
  $('#lex').innerHTML=prog.rungs.map(rungHTML).join('');
  $('#lbtns').innerHTML=s.ex.inputs.map(i=>{const a=i.a;return `<button class="mbtn ${i.c} ${i.t}" data-a="${a}" data-t="${i.t}"><b>${i.l}</b><small>${a}${i.t==='toggle'?' · chave':i.t==='pulse'?' · pulso':''}</small></button>`}).join('');
  fixLessonSelects($('#lex'),prog);
  const lb=$('#lbtns');
  lb.onpointerdown=e=>{const b=e.target.closest('.mbtn');if(!b)return;e.preventDefault();const a=b.dataset.a,t=b.dataset.t;sfx.click();
   if(t==='push'){lesEng.in[a]=true;try{b.setPointerCapture(e.pointerId)}catch(_){}}
   else if(t==='toggle')lesEng.in[a]=!lesEng.in[a];
   else if(!lesEng.in[a]){lesEng.in[a]=true;setTimeout(()=>{lesEng.in[a]=false},170)}};
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{lb['on'+ev]=e=>{const b=e.target.closest('.mbtn');if(b&&b.dataset.t==='push')lesEng.in[b.dataset.a]=false}});
  const paint=()=>{lesEng.scan(.05,prog);applyFlowTo($('#lex'),prog,lesEng,true);$$('#lbtns .mbtn').forEach(b=>b.classList.toggle('on',!!lesEng.in[b.dataset.a]))};
  paint();lessonTimer=setInterval(paint,50);
 }
 const prev=$('#l-prev');if(prev)prev.onclick=()=>{lesStep--;renderLesson(id)};
 $('#l-next').onclick=()=>{if(last)endLesson(id);else{lesStep++;renderLesson(id)}};
 $('#l-skip').onclick=e=>{e.preventDefault();endLesson(id)};
}

/* ---- início ---- */
resetMs();
loadLevel(1);
requestAnimationFrame(frame);
if(!P.welcomed){
 modal(`<h2>🍬 Fábrica Maluca do Relê</h2><div style="font-size:60px">🤖</div><p>Oi! Eu sou o <b>Relê</b>, o robozinho da fábrica de doces. As máquinas travaram e só obedecem a quem monta o circuito <b>Ladder</b> certo! São 8 fases e mais 5 fases <b>bônus</b> para os craques.</p><p>Você monta o circuito arrastando peças, aperta <b>RODAR</b> e vê a corrente <b style="color:#12a36a">verde</b> passando. Vou te ajudar em cada fase!</p><div class="mbts"><button class="btn run" id="m-go">Vamos começar! 🚀</button></div>`);
 $('#m-go').onclick=()=>{P.welcomed=true;save();closeModal();sfx.win();maybeLesson()};
}
</script>
