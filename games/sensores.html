<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detetive de Sensores</title>
<style>
:root{--ink:#2b2250;--bg1:#fff3c9;--bg2:#d9f2ff;--purple:#6c4cf1;--pink:#ff5fa2;--yellow:#ffd23f;--teal:#2ec4b6;--orange:#ff9f1c;--green:#19c37d;--grey:#c3bddb;--red:#ff4d5e;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));-webkit-user-select:none;user-select:none}
h1,h2,p{margin:0}
h2{font-size:15px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.hidden{display:none!important}
#app{display:grid;height:100vh;height:100dvh;padding:10px;gap:10px;grid-template-columns:230px minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "cat stage side" "foot foot foot"}
.btn{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:12px}
.btn.run{background:var(--green);color:#fff}.btn.stop{background:var(--red);color:#fff}.btn.rst{background:var(--yellow)}.btn.chk{background:var(--purple);color:#fff}
#top{grid-area:top;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.row1,.row2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;font-size:18px;color:var(--purple);white-space:nowrap}
#lv{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.chip{width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:#fff;font:inherit;font-weight:900;font-size:15px;line-height:1;cursor:pointer;padding:0;color:var(--ink)}
.chip i{display:block;font-style:normal;font-size:8px;color:var(--orange);letter-spacing:-1px;margin-top:1px}
.chip.cur{background:var(--yellow)}.chip.lock{opacity:.45;cursor:not-allowed}
.row2{justify-content:space-between}
.ttl{flex:1;min-width:220px}
.ttl h1{font-size:19px}
.ttl p{font-size:14px;margin-top:2px}
.side{display:flex;align-items:center;gap:10px}
#stars{font-size:26px;color:var(--orange);letter-spacing:2px}
/* catalog */
#cat{grid-area:cat;padding:10px;overflow:auto}
#cat h2{margin-bottom:8px}
.scard{display:flex;gap:8px;align-items:flex-start;padding:7px;border:3px solid var(--ink);border-radius:12px;background:#fff7d6;cursor:grab;margin-bottom:8px;font-size:12px;line-height:1.25}
.scard .em{font-size:26px;line-height:1;flex:none}
.scard b{display:block;font-size:13px}
.scard small{display:block;font-weight:600;font-size:10.5px;opacity:.8;margin-top:2px}
.scard.sel{background:var(--yellow);outline:4px solid var(--green)}
.tip{font-size:11px;opacity:.75;margin-top:6px;line-height:1.3}
/* stage */
#stage{grid-area:stage;display:flex;flex-direction:column;min-height:0;min-width:0;padding:8px;gap:6px}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-weight:800;font-size:13px;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;background:#fff;cursor:pointer;color:var(--ink)}
.tab.cur{background:var(--yellow)}.tab.okk{background:#b8f2d6}
#brief{font-size:13px;font-weight:700;padding:2px 4px}
#scenewrap{flex:1;min-height:0;border:3px dashed var(--grey);border-radius:14px;background:#eaf4ff;overflow:hidden}
#scene{display:block;width:100%;height:100%}
.ct{font-weight:900;font-size:14px;fill:#2b2250;font-family:inherit}
.tiny{font-weight:800;font-size:11px;fill:#2b2250;font-family:inherit}
/* side */
#side{grid-area:side;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.box2{background:#f3efff;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.35}
.box2 b{font-size:14px}
.box2 label{display:block;font-weight:800;margin:6px 0 2px;font-size:12px}
.box2 input[type=range]{width:100%}
.box2 input[type=number]{width:80px;font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 4px}
.val{font-weight:900;color:var(--purple)}
.res{list-style:none;padding:0;margin:4px 0 0}
.res li{padding:5px 8px;border-radius:9px;margin-bottom:4px;font-size:12px;font-weight:700}
.res li.ok{background:#d6f7e7}.res li.bad{background:#ffdde1}
.res li small{display:block;font-weight:600;margin-top:1px}
.badge{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:11px;font-weight:800;background:#fff;margin-right:4px}
/* footer */
#foot{grid-area:foot;display:flex;align-items:center;gap:12px;padding:8px 12px}
#relewrap{width:64px;flex:none}
#rele{width:64px;height:70px;display:block;animation:bob 2.4s ease-in-out infinite}
#bubble{flex:1;position:relative;background:#f3efff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.3;min-height:48px;display:flex;align-items:center}
#bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(43,34,80,.55);display:grid;place-items:center;z-index:50;padding:12px}
.mcard{max-width:540px;width:100%;padding:18px;max-height:92vh;overflow:auto;text-align:center}
.mcard.wide{max-width:720px}
.mcard h2{font-size:22px;margin-bottom:8px}
.mcard h3{margin:8px 0 4px;font-size:17px;color:var(--purple)}
.mcard p{margin:6px 0;font-size:14px;line-height:1.4}
.mcard a{color:var(--purple);font-size:12px;font-weight:700}
.bigstars{font-size:44px;color:var(--orange);letter-spacing:4px}
.pista{text-align:left;background:#fff7d6;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}
.mbts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.hintcard{text-align:left;background:#fff7d6;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;margin:8px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots span{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots span.on{background:var(--yellow)}
.demo{border:3px dashed var(--grey);border-radius:14px;padding:10px;margin:8px 0;background:#fbfaff;text-align:left}
.demo .pcs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.demo .pc{font:inherit;font-weight:800;font-size:12px;border:3px solid var(--ink);border-radius:10px;padding:4px 8px;background:#fff;cursor:pointer;color:var(--ink)}
.demo .pc.sel{background:var(--yellow)}
.demo input[type=range]{width:100%}
.demo .out{margin-top:6px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.led{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:#9a94b8;display:inline-block;flex:none}
.led.on{background:var(--green)}
@media(max-width:900px){
 #app{height:auto;min-height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "cat" "stage" "side" "foot"}
 #app>*{min-width:0}
 #cat{overflow:visible}#cat h2,.tip{display:none}
 #catitems{display:flex;gap:8px;overflow:auto}
 .scard{flex:none;width:200px;margin:0}
 #scenewrap{height:300px;flex:none}
 #foot{position:sticky;bottom:6px;z-index:20;flex-wrap:wrap;padding:6px 8px;gap:8px}
 #relewrap,#rele{width:44px;height:48px}
 #bubble{min-width:150px;font-size:12px;padding:6px 8px;min-height:40px}
 .btns{width:100%;justify-content:center}
 .btn{padding:6px 10px;font-size:13px}
 .logo{font-size:15px}.ttl h1{font-size:16px}
 #lv{flex:1 1 100%;order:5;justify-content:center}
 .chip{width:36px;height:40px;font-size:14px}
 .ttl{min-width:0;flex:1 1 100%}
}
</style>
</head>
<body>
<div id="app">
 <header id="top" class="card">
  <div class="row1">
   <div class="logo">🔍 Detetive de Sensores</div><a class="btn sm" href="../index.html" title="Voltar ao portal">🏠 Portal</a>
   <nav id="lv"></nav>
   <div><button class="btn sm" id="snd" title="Sons">🔊</button> <button class="btn sm" id="rstp" title="Zerar progresso">↺ Zerar</button></div>
  </div>
  <div class="row2">
   <div class="ttl"><h1 id="ltitle"></h1><p id="lmission"></p></div>
   <div class="side"><div id="stars"></div><button class="btn sm" id="lessonbtn">📖 Trilha</button><button class="btn sm rst" id="hintbtn">💡 Dica</button></div>
  </div>
 </header>
 <aside id="cat" class="card"><h2>🧰 Catálogo de sensores</h2><div id="catitems"></div><p class="tip">Clique no sensor para escolher, ou arraste para a cena.</p></aside>
 <main id="stage" class="card">
  <div id="tabs"></div>
  <div id="brief"></div>
  <div id="scenewrap"><svg id="scene" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid meet"></svg></div>
 </main>
 <aside id="side" class="card"></aside>
 <footer id="foot" class="card">
  <div id="relewrap">
   <svg id="rele" viewBox="0 0 90 100">
    <line x1="45" y1="8" x2="45" y2="22" stroke="#2b2250" stroke-width="4"/><circle cx="45" cy="7" r="6" fill="#ff5fa2" stroke="#2b2250" stroke-width="3"/>
    <rect x="22" y="80" width="46" height="16" rx="7" fill="#ff9f1c" stroke="#2b2250" stroke-width="4"/>
    <rect x="3" y="38" width="8" height="22" rx="4" fill="#ffd23f" stroke="#2b2250" stroke-width="3"/><rect x="79" y="38" width="8" height="22" rx="4" fill="#ffd23f" stroke="#2b2250" stroke-width="3"/>
    <rect x="10" y="20" width="70" height="58" rx="17" fill="#7fd8ff" stroke="#2b2250" stroke-width="4"/>
    <rect x="18" y="29" width="54" height="36" rx="11" fill="#2b2250"/>
    <circle class="eye" id="e1" cx="35" cy="44" r="5" fill="#7cff8a"/><circle class="eye" id="e2" cx="55" cy="44" r="5" fill="#7cff8a"/>
    <path id="mouth" d="M36 54Q45 63 54 54" stroke="#7cff8a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="25" cy="58" r="3" fill="#ff5fa2" opacity=".8"/><circle cx="65" cy="58" r="3" fill="#ff5fa2" opacity=".8"/>
   </svg>
  </div>
  <div id="bubble"></div>
  <div class="btns">
   <button class="btn run" id="run">▶ RODAR</button>
   <button class="btn rst" id="restart">↻ REINICIAR</button>
   <button class="btn chk" id="chk">✓ VERIFICAR</button>
  </div>
 </footer>
</div>
<div id="modal" class="overlay hidden"><div class="mcard card" id="mbody"></div></div>

<script>
/*PURE_START*/
const MATN={steel:'aço',inox:'aço inox',alu:'alumínio',plastic:'plástico',carton:'papelão',glass:'vidro',foil:'embalagem metalizada',sugar:'açúcar',liquid:'calda',dust:'pó de açúcar',empty:'parede vazia',rubber:'borracha'};
const COLN={light:'peça clara',dark:'peça escura',shiny:'superfície brilhante',clear:'vidro transparente'};
const F={steel:1,inox:.7,alu:.4};
const DIEL={steel:100,alu:100,inox:100,foil:100,liquid:90,sugar:55,plastic:45,glass:40,carton:35,dust:25,rubber:20,empty:15};
const CF={light:1,shiny:.6,dark:.25,clear:.08};
const SENSORS={
 limit:{type:'limit',name:'Fim de curso',emoji:'🕹️',out:'PNP',det:'qualquer objeto que encoste na alavanca',rng:'contato mecânico'},
 ind12:{type:'ind',range:4,out:'PNP',name:'Indutivo M12',emoji:'🧲',det:'só metais',rng:'4 mm no aço'},
 ind18:{type:'ind',range:8,out:'PNP',name:'Indutivo M18',emoji:'🧲',det:'só metais',rng:'8 mm no aço'},
 ind12n:{type:'ind',range:4,out:'NPN',name:'Indutivo M12 · NPN',emoji:'🧲',det:'só metais',rng:'4 mm no aço · saída NPN'},
 ind12p:{type:'ind',range:4,out:'PNP',name:'Indutivo M12 · PNP',emoji:'🧲',det:'só metais',rng:'4 mm no aço · saída PNP'},
 ind18p:{type:'ind',range:8,out:'PNP',name:'Indutivo M18 · PNP',emoji:'🧲',det:'só metais',rng:'8 mm no aço · saída PNP'},
 capac:{type:'capac',out:'PNP',name:'Capacitivo M30',emoji:'💧',det:'quase tudo: metal, líquido, pó, plástico',rng:'até 15 mm · sensibilidade ajustável'},
 barrier:{type:'barrier',out:'PNP',name:'Óptico barreira',emoji:'🔦',det:'objetos opacos que cortam o feixe',rng:'emissor + receptor'},
 retro:{type:'retro',out:'PNP',name:'Óptico retrorreflexivo',emoji:'🪞',det:'objetos opacos que cortam o feixe até o refletor',rng:'emissor/receptor + refletor'},
 diffuse:{type:'diffuse',out:'PNP',name:'Óptico difuso',emoji:'💡',det:'objetos que refletem a luz',rng:'até 400 mm (peça clara)'},
 ultra:{type:'ultra',out:'PNP',name:'Ultrassônico',emoji:'🔊',det:'superfícies que devolvem o eco',rng:'40 a 300 mm (zona cega abaixo de 40)'},
 pt100:{type:'analog',name:'PT100 + transmissor',emoji:'🌡️',lo:0,hi:300,det:'temperatura precisa e estável',rng:'0 a 300 °C → 4–20 mA'},
 tcK:{type:'analog',name:'Termopar K + transmissor',emoji:'🌡️',lo:0,hi:600,det:'temperatura em faixa larga',rng:'0 a 600 °C → 4–20 mA'},
 ntc:{type:'analog',name:'NTC + transmissor',emoji:'🌡️',lo:0,hi:120,det:'temperatura baixa, barato',rng:'0 a 120 °C → 4–20 mA'}
};
const PARAM={
 limit:{label:'Alavanca aciona após (mm de curso)',unit:'mm',min:0,max:12,step:.5,def:1},
 ind:{label:'Folga sensor ↔ peça',unit:'mm',min:0,max:12,step:.1,def:9},
 capac:{label:'Sensibilidade',unit:'%',min:0,max:100,step:1,def:95},
 barrier:{label:'Altura do feixe acima da esteira',unit:'mm',min:0,max:120,step:1,def:90},
 retro:{label:'Altura do feixe acima da esteira',unit:'mm',min:0,max:120,step:1,def:90},
 diffuse:{label:'Distância sensor ↔ peça',unit:'mm',min:5,max:400,step:1,def:250},
 ultra:{label:'Ponto de comutação',unit:'mm',min:20,max:300,step:1,def:250}
};
const ALL=['limit','ind12','ind18','capac','barrier','retro','diffuse','ultra'];
function sense(e,p,a,st){
 const bad=st.bad&&st.bad[e.type];
 if(bad)return{hit:false,note:bad,bad:true};
 if(st.plc&&e.out&&e.out!==st.plc)return{hit:false,note:`o sensor ${e.out} entrega 0 V ao detectar, mas esta entrada do CLP espera +24 V (PNP): o CLP nunca vê o sinal`,bad:true};
 switch(e.type){
  case 'limit':
   if(a.travel===undefined)return{hit:false,note:'não há como encostar a alavanca nessa peça de forma confiável'};
   return{hit:a.travel>=p,note:`a porta avança ${a.travel} mm e a alavanca aciona em ${p} mm`};
  case 'ind':{
   if(p<1)return{hit:false,crash:true,note:'sensor perto demais: a peça bate nele (folga mínima de 1 mm)'};
   const f=F[a.mat]||0,r=e.range*f;
   if(!f)return{hit:false,note:`o indutivo só enxerga metal: ${MATN[a.mat]||'a peça'} é invisível para ele`};
   return{hit:p<=r,note:`alcance efetivo no ${MATN[a.mat]}: ${r.toFixed(1)} mm (folga em ${p} mm)`};}
  case 'capac':{
   const req=100-(DIEL[a.mat]===undefined?0:DIEL[a.mat]);
   return{hit:p>=req,note:`${MATN[a.mat]||'a peça'} precisa de sensibilidade de pelo menos ${req}% (está em ${p}%)`};}
  case 'barrier':
  case 'retro':
   if(p<5)return{hit:true,crash:true,note:'feixe muito baixo: bate na esteira e fica sempre bloqueado'};
   if(a.color==='clear')return{hit:false,note:'o vidro transparente não interrompe o feixe'};
   if(e.type==='retro'&&a.color==='shiny')return{hit:false,note:'a superfície brilhante devolve o feixe como se fosse o refletor, e o sensor não percebe a peça'};
   return{hit:p<a.h,note:`feixe a ${p} mm e peça de ${a.h} mm de altura`};
  case 'diffuse':{
   if(p<20)return{hit:false,crash:true,note:'perto demais (menos de 20 mm): a lente satura'};
   const r=Math.round(400*(CF[a.color]===undefined?1:CF[a.color]));
   return{hit:p<=r,note:`alcance para ${COLN[a.color]||'a peça'}: ${r} mm (distância em ${p} mm)`};}
  case 'ultra':{
   if(a.foam)return{hit:false,note:'a espuma absorve o som: não volta eco'};
   const d=a.d!==undefined?a.d:200-a.h;
   if(d<40)return{hit:false,note:'a superfície está na zona cega (menos de 40 mm): sem leitura'};
   return{hit:d<=p,note:`superfície a ${d} mm do sensor e ponto de comutação em ${p} mm`};}
 }
 return{hit:false,note:'sensor inválido'};
}
function evalAnalog(st,cfg){
 const e=SENSORS[cfg.sensor],out=[];
 for(const ev of st.events){
  const T=ev.T,fr=Math.max(0,Math.min(1,(T-e.lo)/(e.hi-e.lo))),mA=4+16*fr,span=cfg.hi-cfg.lo;
  const shown=span>0?cfg.lo+(mA-4)/16*span:NaN,err=Math.abs(shown-T);
  const note=T>e.hi?`o sensor satura em ${e.hi} °C (20 mA): o CLP nunca passa disso`:`${mA.toFixed(1)} mA viram ${isNaN(shown)?'?':shown.toFixed(0)} °C na escala do CLP (${cfg.lo} a ${cfg.hi} °C)`;
  out.push({ev,expect:T,got:shown,hit:null,mA,note,ok:err<=3});
 }
 return{results:out,ok:out.every(x=>x.ok),hazard:null};
}
function evalStation(st,cfg){
 if(!cfg||!cfg.sensor)return{results:[],ok:false,hazard:null,missing:true};
 if(st.kind==='analog')return evalAnalog(st,cfg);
 const e=SENSORS[cfg.sensor],out=[];let hazard=null;
 for(const ev of st.events){
  const r=sense(e,cfg.p,ev.a,st);
  if(r.crash&&!hazard)hazard=r.note;
  out.push({ev,expect:ev.expect,hit:r.hit,note:r.note,ok:r.hit===ev.expect&&!r.crash});
 }
 return{results:out,ok:out.every(x=>x.ok)&&!hazard,hazard};
}
function resultMsg(st,r,res){
 if(res&&res.hazard)return res.hazard.charAt(0).toUpperCase()+res.hazard.slice(1)+'.';
 if(st.kind==='analog')return `Com a temperatura em ${r.ev.T} °C o CLP mostrou ${isNaN(r.got)?'?':r.got.toFixed(0)} °C. ${r.note.charAt(0).toUpperCase()+r.note.slice(1)}.`;
 return `${r.ev.n}: ${r.expect?'precisava detectar':'não podia detectar'}, mas ${r.hit?'detectou':'não detectou'}. ${r.note.charAt(0).toUpperCase()+r.note.slice(1)}.`;
}
const ST={
 door:{id:'door',kind:'door',title:'Porta do misturador',
  brief:'Porta de acrílico transparente, com vapor e respingos. O misturador só pode ligar com a porta realmente fechada.',
  catalog:['limit','ind12','capac','diffuse'],
  bad:{capac:'vapor e respingos mantêm o sensor ligado o tempo todo',diffuse:'a porta de acrílico é transparente: o feixe atravessa'},
  events:[{n:'Porta fechada',expect:true,a:{travel:10,mat:'plastic',color:'clear'}},{n:'Porta entreaberta (4 mm)',expect:false,a:{travel:4,mat:'plastic',color:'clear'}},{n:'Porta aberta',expect:false,a:{travel:0,mat:'plastic',color:'clear'}}]},
 caps:{id:'caps',kind:'belt',title:'Tampas na esteira',
  brief:'Tampas de aço e de alumínio devem ser contadas. As de plástico, que vêm misturadas, não.',
  catalog:['ind12','ind18','diffuse','barrier','limit'],
  bad:{capac:'respingos de calda na esteira deixam a sensibilidade instável'},
  events:[{n:'Tampa de aço',expect:true,a:{mat:'steel',color:'shiny',h:15,shape:'cap'}},{n:'Tampa de alumínio',expect:true,a:{mat:'alu',color:'shiny',h:15,shape:'cap'}},{n:'Tampa de plástico',expect:false,a:{mat:'plastic',color:'light',h:15,shape:'cap'}}]},
 silo:{id:'silo',kind:'tank',title:'Silo de açúcar',

function beep(f,d=.1,type='sine',v=.07,delay=0){
 if(!P.sound)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}

 }

 const lo=$('#lo'),hi=$('#hi'),lt=$('#lt');
 if(lo){lo.onchange=()=>{c.lo=parseFloat(lo.value)||0;persist();updMa()};hi.onchange=()=>{c.hi=parseFloat(hi.value)||0;persist();updMa()};lt.oninput=()=>{liveT=+lt.value;$('#tv').textContent=liveT+' °C';updMa();drawIdle()};updMa()}
}
function updMa(){
 const c=scfg(),e=c.sensor&&SENSORS[c.sensor];if(!e||e.type!=='analog'||!$('#ma'))return;
 const fr=Math.max(0,Math.min(1,(liveT-e.lo)/(e.hi-e.lo))),mA=4+16*fr,span=c.hi-c.lo,shown=span>0?c.lo+(mA-4)/16*span:NaN;
 $('#ma').innerHTML=`Sinal: <b>${mA.toFixed(1)} mA</b> → CLP mostra <b>${isNaN(shown)?'?':shown.toFixed(0)} °C</b>`;
}
function pick(id){
 const c=scfg(),e=SENSORS[id];

 c.sensor=id;
 if(e.type==='analog'){if(c.lo===undefined)c.lo=0;if(!c.hi)c.hi=100}
 else if(c.p===null||c.p===undefined||prevType!==e.type)c.p=pdef(e.type).def;
 sfx.pick();persist();renderCatalog();renderSide();drawIdle();

}

const BG=`<rect width="600" height="300" fill="#eaf4ff"/><rect y="262" width="600" height="38" fill="#cdbcff"/><path d="M0 262H600" stroke="${INK}" stroke-width="4"/>`;

function pieceSVG(a,x,BY){

 else if(a.shape==='bottle')s=`<rect x="-16" y="${-hp+16}" width="32" height="${hp-16}" rx="8" fill="${f}" stroke="${INK}" stroke-width="3"/><rect x="-7" y="${-hp}" width="14" height="20" rx="3" fill="${f}" stroke="${INK}" stroke-width="3"/>`;
 else if(a.shape==='tray')s=`<rect x="-34" y="${-hp}" width="68" height="${hp}" rx="4" fill="${f}" stroke="${INK}" stroke-width="3"/>`;
 else if(a.shape==='pack')s=`<rect x="-26" y="${-hp}" width="52" height="${hp}" rx="6" fill="${f}" stroke="${INK}" stroke-width="3"/><path d="M-18 ${-hp+5}L-6 ${-hp+16}M-2 ${-hp+5}L10 ${-hp+16}" stroke="#fff" stroke-width="3"/>`;
 else s=`<rect x="-30" y="${-hp}" width="60" height="${hp}" rx="5" fill="${f}" stroke="${INK}" stroke-width="3"/><path d="M-30 ${-hp+14}H30" stroke="${INK}" stroke-width="2" opacity=".4"/>`;
 return `<g transform="translate(${x} ${BY})">${s}</g>`;
}

function sceneBelt(c){
 const {st,e,p,ev,hit,t}=c,BY=215,sx=300;
 let s=BG+`<rect x="20" y="${BY}" width="560" height="22" rx="11" fill="#4b4570" stroke="${INK}" stroke-width="4"/>`;
 for(let i=0;i<14;i++)s+=`<path d="M${40+i*40+((t||0)*80)%40} ${BY+3}V${BY+19}" stroke="#7b73ad" stroke-width="4"/>`;
 s+=`<path d="M60 242L50 262M540 242L550 262" stroke="${INK}" stroke-width="8"/>`;
 const x=ev?-60+t*720:-999,near=ev&&Math.abs(x-sx)<40,led=ev&&near&&hit;
 let blocked=false;
 if(e){
  const ty=e.type;
  if(ty==='barrier'||ty==='retro'){
   const by=BY-p*1.15,beamEnd=ev&&near&&hit?x-(ev.a.shape==='bottle'?16:30):540;
   blocked=ev&&near&&hit;
   s+=`<rect x="40" y="${by-14}" width="22" height="28" rx="5" fill="#ff9f9f" stroke="${INK}" stroke-width="3"/>`;
   s+=ty==='barrier'?`<rect x="538" y="${by-14}" width="22" height="28" rx="5" fill="#9fd3ff" stroke="${INK}" stroke-width="3"/>`:`<rect x="548" y="${by-16}" width="14" height="32" rx="3" fill="#e9eef7" stroke="${INK}" stroke-width="3"/><path d="M552 ${by-10}L558 ${by-4}M552 ${by+2}L558 ${by+8}" stroke="#ff4d5e" stroke-width="2"/>`;
   s+=`<path d="M62 ${by}H${blocked?beamEnd:538}" stroke="${blocked?'#19c37d':'#ff4d5e'}" stroke-width="3" stroke-dasharray="7 5"/>`;
   s+=`<text x="300" y="${by-12}" class="tiny" text-anchor="middle">${ty==='barrier'?'barreira':'retrorreflexivo'}</text>`;
  }else if(ty==='ultra'){
   const fy=40,sp=fy+p*.9*(165/200),lineY=Math.min(sp,BY);
   s+=sensorBody(sx,fy-26,50,26,'#ffd9a0','ultrassônico');
   s+=`<path d="M${sx-10} ${fy}L${sx-60} ${Math.min(BY,lineY+30)}H${sx+60}L${sx+10} ${fy}Z" fill="${led?'#19c37d':'#ffb84d'}" opacity=".18"/>`;
   s+=`<path d="M${sx-75} ${lineY}H${sx+75}" stroke="#ff4d5e" stroke-width="3" stroke-dasharray="6 4"/><text x="${sx+80}" y="${lineY+4}" class="tiny">comuta aqui (${p} mm)</text>`;
  }else{
   const gp=ty==='ind'?p*5:ty==='diffuse'?p*.4:p*4,sy=BY-24-Math.min(gp,150)-26;
   const col=ty==='ind'?'#c9d6ff':ty==='diffuse'?'#ffe9a0':ty==='capac'?'#b8f2d6':'#ffc2c8';
   s+=sensorBody(sx,sy,48,26,col,SENSORS[c.sensor].name.replace(' · NPN','').replace(' · PNP',''));
   s+=`<path d="M${sx-8} ${sy+26}L${sx-22} ${BY-24}H${sx+22}L${sx+8} ${sy+26}Z" fill="${led?'#19c37d':'#7fd8ff'}" opacity=".28"/>`;
   s+=`<path d="M${sx+34} ${sy+26}V${BY-24}" stroke="${INK}" stroke-width="2"/><text x="${sx+38}" y="${(sy+26+BY-24)/2+4}" class="tiny">${p} mm</text>`;
  }
 }
 if(ev)s+=pieceSVG(ev.a,x,BY);
 const mark=ev&&t>.7?(c.res&&c.res.ok?'  ✔':'  ✘'):'';
 return s+bannerSVG(ev,mark)+ledSVG(!!led,led?'LIGADA':'desligada');
}
function sceneTank(c){
 const {st,e,p,ev,hit,t}=c,TX=220,TW=160,TY=50,TB=240,markY=110;

/* ---- RODAR ---- */
const DUR=2300;
function play(){
 if(run)return;
 const st=station(),c=scfg();
 if(!c.sensor){say('Primeiro escolha um sensor no catálogo!','think');sfx.fail();return}
 const res=evalStation(st,c);
 run={st,res,i:0,t0:performance.now()};
 $('#run').disabled=true;
 say(`Rodando o caso... Observe o LED de saída do sensor em cada situação.`,'happy');
 requestAnimationFrame(loop);
}
function loop(now){
 if(!run)return;
 const {st,res}=run,t=(now-run.t0)/DUR;
 if(t>=1){
  const r=res.results[run.i];
  if(r)sfx[r.ok?'hit':'fail']();
  run.i++;run.t0=now;
  if(run.i>=res.results.length)return endRun();
 }
 const i=run.i,r=res.results[i];
 drawScene(r.ev,Math.min(1,Math.max(0,(now-run.t0)/DUR)),i>0?res.results[i-1].ev:null,r);
 requestAnimationFrame(loop);
}
function endRun(){
 const st=run.st,res=run.res;
 last[st.id]=res;run=null;$('#run').disabled=false;
 renderTabs();renderSide();drawIdle();
 const bad=res.results.find(x=>!x.ok);
 if(res.ok)say('Rodada perfeita! 🎉 Aperte <b>✓ VERIFICAR</b> para fechar o caso.','happy');
 else say(`Hmm... ${resultMsg(st,bad,res)}`,'bad');
}
function stopRun(){run=null;$('#run').disabled=false;drawIdle()}
$('#run').onclick=play;
$('#restart').onclick=()=>{if(run)stopRun();const c=scfg();c.sensor=null;c.p=null;c.lo=0;c.hi=100;delete last[station().id];persist();renderTabs();renderCatalog();renderSide();drawIdle();say('Tudo reiniciado nesta estação. Escolha um sensor!','happy')};

/* ---- verificar ---- */
function complete(){
 const stars=1+(hints===0?1:0)+(fails<=1?1:0);
 P.stars[L.id]=Math.max(P.stars[L.id]||0,stars);
 if(L.id<LEVELS.length)P.unlocked=Math.max(P.unlocked,L.id+1);
 save();renderHeader();sfx.win();
 const lastL=L.id===LEVELS.length;
 say(lastL?'🏆 Você resolveu todos os casos! Detetive nota 10!':'🎉 Caso resolvido! Que detetive incrível!','happy');
 modal(`<h2>${lastL?'🏆 Casos encerrados!':'🎉 Caso resolvido!'}</h2><div class="bigstars">${starsHTML(stars)}</div><p>Dicas usadas: <b>${hints}</b> · Verificações erradas: <b>${fails}</b></p><p style="font-size:12px;opacity:.7">3 estrelas = nenhuma dica e no máximo 1 verificação errada.</p><div class="mbts"><button class="btn" id="m-close">Continuar aqui</button>${lastL?'<button class="btn run" id="m-first">Jogar de novo</button>':'<button class="btn run" id="m-next">Próximo caso ▶</button>'}</div>`);
 $('#m-close').onclick=closeModal;
 if(lastL)$('#m-first').onclick=()=>{closeModal();loadLevel(1)};else $('#m-next').onclick=()=>{closeModal();loadLevel(L.id+1)};
}
function verify(){
 if(run)stopRun();
 const miss=L.stations.findIndex(s=>!(cfg[s.id]&&cfg[s.id].sensor));
 if(miss>=0){
  if(L.stations.length>1){cur=miss;renderTabs();renderCatalog();renderSide();drawIdle()}
  say(L.stations.length>1?`Falta escolher o sensor da estação ${miss+1}.`:'Escolha um sensor primeiro!','think');sfx.fail();return;
 }
 const lv=evalLevel(L,cfg);
 L.stations.forEach(s=>{last[s.id]=lv.per[s.id]});
 renderTabs();renderSide();
 if(lv.ok){complete();return}
 fails++;sfx.fail();
 const badSt=L.stations.find(s=>!lv.per[s.id].ok),res=lv.per[badSt.id],bad=res.results.find(x=>!x.ok);
 const pista=(L.stations.length>1?`<b>Estação ${L.stations.indexOf(badSt)+1} (${badSt.title}):</b> `:'')+resultMsg(badSt,bad,res);
 say('Quase lá! '+pista,'bad');
 const okN=L.stations.filter(s=>lv.per[s.id].ok).length;
 modal(`<h2>🔧 Ainda não resolveu</h2>${L.stations.length>1?`<p>${okN} de ${L.stations.length} estações resolvidas.</p>`:''}<div class="pista">🤖 <b>Pista do Relê:</b> ${pista}</div><div class="mbts"><button class="btn rst" id="m-close">Voltar ao caso</button><button class="btn" id="m-hint">💡 Pedir dica</button></div>`);
 $('#m-close').onclick=()=>{closeModal();if(L.stations.length>1){cur=L.stations.indexOf(badSt);renderTabs();renderCatalog();renderSide();drawIdle()}};
 $('#m-hint').onclick=()=>{if(hints===0)hints=1;openHints()};
}
$('#chk').onclick=verify;

 if(s.demo){const h=$('#demo');if(s.demo==='analog')demoAnalog(h);else demoSense(h,s.demo)}
 const prev=$('#l-prev');if(prev)prev.onclick=()=>openLesson(id,lesStep-1);
 $('#l-next').onclick=()=>{if(last)endLesson(id);else openLesson(id,lesStep+1)};
 $('#l-skip').onclick=e=>{e.preventDefault();endLesson(id)};
}
function endLesson(id){P.seen[id]=1;save();closeModal()}
$('#lessonbtn').onclick=()=>{sfx.click();openLesson(L.id)};
function maybeLesson(){if(P.welcomed&&!P.seen[L.id]&&LESSONS[L.id])openLesson(L.id)}

/* ---- fases ---- */
function loadLevel(id){
 if(id>P.unlocked)return;
 closeModal();run=null;$('#run').disabled=false;
 L=LEVELS[id-1];hints=0;fails=0;cur=0;last={};liveT=25;
 const saved=P.cfg[id];
 cfg={};
 if(saved&&typeof saved==='object'){
  L.stations.forEach(s=>{const c=saved[s.id];if(c&&(c.sensor===null||s.catalog.includes(c.sensor)))cfg[s.id]={sensor:c.sensor,p:c.p,lo:c.lo===undefined?0:c.lo,hi:c.hi||100}});
 }
 renderHeader();renderTabs();renderCatalog();renderSide();drawIdle();
 say(`<b>Caso ${L.id}:</b> ${L.story}`,'happy');
 maybeLesson();
}
$('#lv').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b&&!b.classList.contains('lock'))loadLevel(+b.dataset.lv);else if(b){say('Esse caso ainda está trancado. Resolva o anterior!','think');sfx.fail()}});
$('#snd').onclick=()=>{P.sound=!P.sound;save();renderHeader();if(P.sound)sfx.click()};
$('#rstp').onclick=()=>{ask('↺ Zerar tudo','Apagar <b>todo</b> o progresso: estrelas, casos desbloqueados e ajustes? Não dá para desfazer.','Sim, zerar tudo',()=>{
 try{localStorage.removeItem(KEY)}catch(e){}
 P=Object.assign({},DEF,{stars:{},cfg:{},seen:{},unlocked:1,welcomed:true});save();
 loadLevel(1);say('Tudo zerado! Vamos recomeçar a investigação. 🔍','happy');
})};

/* ---- início ---- */
loadLevel(1);
if(!P.welcomed){
 modal(`<h2>🔍 Detetive de Sensores</h2><div style="font-size:60px">🤖</div><p>Oi! Eu sou o <b>Relê</b>, agora detetive! As máquinas da fábrica de doces não estão enxergando direito.</p><p>Em cada caso você <b>escolhe o sensor certo</b>, <b>ajusta</b> e vê se ele detecta o que deve (e ignora o que não deve). Vou te ajudar a cada passo!</p><div class="mbts"><button class="btn run" id="m-go">Vamos investigar! 🚀</button></div>`);
 $('#m-go').onclick=()=>{P.welcomed=true;save();closeModal();sfx.win();maybeLesson()};
}
</script>
</body>
