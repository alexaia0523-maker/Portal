<style>
:root{--ink:#2b2250;--bg1:#fff3c9;--bg2:#d9f2ff;--purple:#6c4cf1;--yellow:#ffd23f;--green:#19c37d;--orange:#ff9f1c;--red:#ff4d5e;--grey:#c3bddb}
*{box-sizing:border-box}html,body{margin:0}

.btn.sm{padding:4px 10px;font-size:13px;border-radius:12px}.btn.run{background:var(--green);color:#fff}.btn.rst{background:var(--yellow)}.btn.pri{background:var(--purple);color:#fff}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}
#top{padding:8px 12px;display:flex;flex-direction:column;gap:8px}.logo{font-weight:900;font-size:18px;color:var(--purple)}
#lv{display:flex;gap:6px;flex-wrap:wrap}

@keyframes bob{50%{transform:translateY(-4px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

.overlay{position:fixed;inset:0;background:rgba(43,34,80,.55);display:grid;place-items:center;z-index:50;padding:12px}
.mcard{max-width:520px;width:100%;padding:18px;max-height:92vh;overflow:auto;text-align:center}.mcard h2{font-size:22px;margin-bottom:8px}.mcard p{margin:6px 0;font-size:14px;line-height:1.4}
.bigstars{font-size:46px;color:var(--orange);letter-spacing:4px}.mbts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
@keyframes pulse{50%{r:20;opacity:.5}}.blink{animation:pulse .6s infinite}
details.dt{margin-top:8px;border:2px solid var(--grey);border-radius:12px;padding:6px 10px;background:#fcfbff}details.dt summary{cursor:pointer;font-weight:900;font-size:14px}details.dt svg{margin-top:8px}
ul.ci{margin:8px 0;padding-left:18px;font-size:13.5px;line-height:1.45}#cnt.full{color:#0a7a4b}
.wg:hover .wo{stroke-width:10}.wg:hover .wi{stroke-width:6}.wg.lk:hover .wo{stroke-width:6}

</style></head><body>
<div id="app">
 <header id="top" class="card"><div class="row"><div class="logo">Bancada do Relê · Partida com Reversão</div><a class="btn sm" href="../index.html">🏠 Portal</a><span class="sp"></span><button class="btn sm" id="snd">🔊</button></div><nav id="lv"></nav></header>
 <section id="lesson" class="card"></section>
 <section id="benchbox" class="card">
  <div id="tools" class="row"><span style="font-weight:800;font-size:13px">Cor do cabo:</span><span id="cols" class="row" style="gap:6px"></span><span id="cnt" style="font-weight:800;font-size:13px"></span><span class="sp"></span><button class="btn sm" id="zout">➖</button><button class="btn sm" id="zfit">Ajustar</button><button class="btn sm" id="zin">➕</button></div>

 </section>

 <footer id="foot" class="card">
  <svg id="rele" viewBox="0 0 90 100"><line x1="45" y1="8" x2="45" y2="22" stroke="#2b2250" stroke-width="4"/><circle cx="45" cy="7" r="6" fill="#ff5fa2" stroke="#2b2250" stroke-width="3"/><rect x="22" y="80" width="46" height="16" rx="7" fill="#ff9f1c" stroke="#2b2250" stroke-width="4"/><rect x="3" y="38" width="8" height="22" rx="4" fill="#ffd23f" stroke="#2b2250" stroke-width="3"/><rect x="79" y="38" width="8" height="22" rx="4" fill="#ffd23f" stroke="#2b2250" stroke-width="3"/><rect x="10" y="20" width="70" height="58" rx="17" fill="#7fd8ff" stroke="#2b2250" stroke-width="4"/><rect x="18" y="29" width="54" height="36" rx="11" fill="#2b2250"/><circle class="eye" cx="35" cy="44" r="5" fill="#7cff8a"/><circle class="eye" cx="55" cy="44" r="5" fill="#7cff8a"/><path id="mouth" d="M36 54Q45 63 54 54" stroke="#7cff8a" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="25" cy="58" r="3" fill="#ff5fa2" opacity=".8"/><circle cx="65" cy="58" r="3" fill="#ff5fa2" opacity=".8"/></svg>
  <div id="bubble"></div>
  <div class="btns"><button class="btn sm" id="btrail">📖 Trilha</button><button class="btn sm" id="bsch">📐 Esquema</button><button class="btn sm" id="bhint">💡 Dica</button><button class="btn sm" id="blist">📋 Lista de ligações</button><button class="btn sm" id="bundo">↶ Desfazer</button><button class="btn sm" id="bclear">🗑️ Limpar</button><button class="btn run" id="btest">▶ Testar</button></div>
 </footer>
</div>
<div id="modal" class="overlay hidden"><div class="mcard card" id="mbody"></div></div>
<script>
/*PURE_START*/
function UF(){const p=new Map();const f=x=>{if(!p.has(x))p.set(x,x);let r=x;while(p.get(r)!==r)r=p.get(r);let c=x;while(p.get(c)!==r){const n=p.get(c);p.set(c,r);c=n}return r};return{find:f,union:(a,b)=>{const ra=f(a),rb=f(b);if(ra!==rb)p.set(ra,rb)}}}
function mkState(comps){const st={master:true,q:{},k:{},press:{},hold:{},trip:{},blown:{}};comps.forEach(c=>{if(c.type==='Q')st.q[c.id]=false;if(c.type==='K')st.k[c.id]=false;if(c.type==='FU')st.blown[c.id]=false;if(c.type==='F2')st.trip[c.id]=false});return st}
function edgesOf(comps,st,skipFU){const E=[];const add=(id,a,b)=>E.push([id+'.'+a,id+'.'+b]);
 for(const c of comps){const id=c.id;
  if(c.type==='Q'){if(st.q[id]){add(id,1,2);add(id,3,4);add(id,5,6)}}
  else if(c.type==='FU'){if(!st.blown[id]&&!skipFU)add(id,1,2)}
  else if(c.type==='K'){if(st.k[id]){add(id,1,2);add(id,3,4);add(id,5,6);add(id,13,14)}else add(id,21,22)}
  else if(c.type==='F2'){add(id,1,2);add(id,3,4);add(id,5,6);if(st.trip[id])add(id,97,98);else add(id,95,96)}
  else if(c.type==='S0'){if(!st.press[id])add(id,11,12)}
  else if(c.type==='SB'){if(st.press[id])add(id,13,14);else if(c.nf)add(id,21,22)}}
 return E}
function evalOnce(comps,wires,st,skipFU){
 const uf=UF();for(const w of wires)uf.union(w[0],w[1]);for(const e of edgesOf(comps,st,skipFU))uf.union(e[0],e[1]);
 const lab={},shorts=new Set();const src=comps.find(c=>c.type==='SRC');
 if(src&&st.master)for(const n of ['R','S','T','N']){const rt=uf.find(src.id+'.'+n);if(lab[rt]&&lab[rt]!==n)shorts.add(rt);else lab[rt]=n}
 const L=t=>lab[uf.find(t)]||null;
 const volt=(a,b)=>{const ra=uf.find(a),rb=uf.find(b);if(ra===rb||shorts.has(ra)||shorts.has(rb))return 0;const la=lab[ra],lb=lab[rb];if(!la||!lb)return 0;return(la==='N'||lb==='N')?220:380};
 const loads={};
 for(const c of comps){if(c.type==='K')loads[c.id]=volt(c.id+'.A1',c.id+'.A2');if(c.type==='H')loads[c.id]=volt(c.id+'.X1',c.id+'.X2')}
 let motor={state:'off',dir:0};
 for(const c of comps){if(c.type!=='M')continue;
  const l=['U','V','W'].map(n=>L(c.id+'.'+n));const non=l.filter(Boolean);const idx={R:0,S:1,T:2};
  if(non.length===0)motor={state:'off',dir:0,id:c.id};
  else if(l.includes('N'))motor={state:'bad',dir:0,id:c.id};
  else if(non.length===3&&new Set(non).size===3){const a=idx[l[0]],b=idx[l[1]],d=idx[l[2]];motor={state:'run',dir:((b-a+3)%3===1&&(d-b+3)%3===1)?1:-1,id:c.id}}
  else if(new Set(non).size>=2)motor={state:'phase',dir:0,id:c.id};
  else motor={state:'off',dir:0,id:c.id};}
 return{root:uf.find,shorts:[...shorts],loads,motor,L}}
function solve(comps,wires,st){
 const faults=[];let r;
 for(let it=0;it<60;it++){
  r=evalOnce(comps,wires,st,false);
  if(r.shorts.length){
   const r2=evalOnce(comps,wires,st,true);let did=false;
   if(!r2.shorts.length)comps.forEach(c=>{if(c.type==='FU'&&!st.blown[c.id]&&r.shorts.includes(r.root(c.id+'.1'))){st.blown[c.id]=true;faults.push('fuse:'+c.id);did=true}});
   if(!did)comps.forEach(c=>{if(c.type==='Q'&&st.q[c.id]&&[1,2,3,4,5,6].some(p=>r.shorts.includes(r.root(c.id+'.'+p)))){st.q[c.id]=false;faults.push('trip:'+c.id);did=true}});
   if(!did){st.master=false;faults.push('master')}
   continue}
  let ch=false;
  for(const c of comps){if(c.type!=='K')continue;const on=r.loads[c.id]===220||!!st.hold[c.id];if(on!==!!st.k[c.id]){st.k[c.id]=on;ch=true;break}}
  if(!ch){r.faults=faults;return r}}
 r.faults=faults;r.osc=true;return r}
function applyStep(st,s){if(s.q)st.q[s.q[0]]=s.q[1];if(s.p)st.press[s.p]=true;if(s.r)st.press[s.r]=false;if(s.h)st.hold[s.h]=true;if(s.u)st.hold[s.u]=false;if(s.trip)st.trip[s.trip]=true;if(s.reset)st.trip[s.reset]=false;if(s.master)st.master=true;if(s.fuse)st.blown[s.fuse]=false}
function isOn(id,st,r){if(id in st.k)return!!st.k[id];return r.loads[id]===220}
function checkEx(ex,st,r){
 if(ex.M&&r.motor.state!==ex.M)return false;
 if(ex.dir!==undefined&&r.motor.dir!==ex.dir)return false;
 if(ex.on)for(const k in ex.on)if(isOn(k,st,r)!==ex.on[k])return false;
 if(ex.q)for(const k in ex.q)if(!!st.q[k]!==ex.q[k])return false;
 if(ex.fault&&!(r.faults||[]).some(f=>f.indexOf(ex.fault)===0))return false;
 return true}
function runTests(level,wires){
 return level.tests.map(t=>{const st=mkState(level.comps);let r=solve(level.comps,wires,st),fail=null;
  const faultsAll=[];
  for(const s of t.steps){applyStep(st,s);r=solve(level.comps,wires,st);(r.faults||[]).forEach(f=>faultsAll.push(f));
   if(s.ex){r.faults=faultsAll.slice();if(!checkEx(s.ex,st,r)){fail=s.msg||'Algo não saiu como esperado.';break}}}
  return{name:t.name,ok:!fail,msg:fail}})}
function wireSat(wires,a,b){const uf=UF();wires.forEach(w=>uf.union(w[0],w[1]));return uf.find(a)===uf.find(b)}
/*PURE_END*/

/*SCH_START*/
const I_='#2b2250';
const na=(l,p)=>({t:'NA',l,p}),nf=(l,p)=>({t:'NF',l,p}),fu=l=>({t:'FU',l}),sw=l=>({t:'SW',l}),coil=l=>({t:'COIL',l}),lamp=(l,c)=>({t:'LAMP',l,c});
function sym(it){const w=76,cx=38;const tx=(y,t,sz)=>`<text x="${cx}" y="${y}" text-anchor="middle" font-size="${sz||11}" font-weight="800" fill="${I_}">${t}</text>`;
 let s=`<line x1="0" y1="0" x2="${w}" y2="0" stroke="${I_}" stroke-width="2.5"/>`;
 if(it.t==='NA'||it.t==='NF'||it.t==='SW'){s+=`<rect x="${cx-12}" y="-13" width="24" height="26" fill="#fff"/><line x1="${cx-9}" y1="-13" x2="${cx-9}" y2="13" stroke="${I_}" stroke-width="3"/><line x1="${cx+9}" y1="-13" x2="${cx+9}" y2="13" stroke="${I_}" stroke-width="3"/>`;
  if(it.t==='NF')s+=`<line x1="${cx-15}" y1="14" x2="${cx+15}" y2="-14" stroke="#c0182c" stroke-width="2.5"/>`;
  s+=tx(-22,it.l)+(it.p?tx(31,it.p,9):'')}
 else if(it.t==='FU')s+=`<rect x="${cx-16}" y="-8" width="32" height="16" fill="#fff" stroke="${I_}" stroke-width="3"/><line x1="${cx-16}" y1="0" x2="${cx+16}" y2="0" stroke="${I_}" stroke-width="2"/>`+tx(-16,it.l);
 else if(it.t==='COIL')s+=`<circle cx="${cx}" cy="0" r="17" fill="#ffe6f1" stroke="${I_}" stroke-width="3"/>`+tx(4,it.l)+tx(32,'A1-A2',9);
 else if(it.t==='LAMP')s+=`<circle cx="${cx}" cy="0" r="16" fill="${it.c||'#fff'}" stroke="${I_}" stroke-width="3"/><line x1="${cx-11}" y1="-11" x2="${cx+11}" y2="11" stroke="${I_}" stroke-width="2.5"/><line x1="${cx+11}" y1="-11" x2="${cx-11}" y2="11" stroke="${I_}" stroke-width="2.5"/>`+tx(-24,it.l);
 return{w,top:34,bot:36,svg:s}}
function series(items){let x=0,top=0,bot=0,svg='';for(const it of items){const n=it.par?par(it.par):sym(it);svg+=`<g transform="translate(${x},0)">${n.svg}</g>`;x+=n.w;top=Math.max(top,n.top);bot=Math.max(bot,n.bot)}return{w:x,top,bot,svg}}
function par(br){const bs=br.map(series);const w=Math.max(...bs.map(b=>b.w))+20;let y=0,svg='',prev=0,ys=[];
 bs.forEach((b,i)=>{if(i>0)y+=prev+b.top+8;ys.push(y);svg+=`<g transform="translate(10,${y})">${b.svg}</g><line x1="0" y1="${y}" x2="10" y2="${y}" stroke="${I_}" stroke-width="2.5"/><line x1="${10+b.w}" y1="${y}" x2="${w}" y2="${y}" stroke="${I_}" stroke-width="2.5"/>`;prev=b.bot});
 svg+=`<line x1="1" y1="0" x2="1" y2="${y}" stroke="${I_}" stroke-width="2.5"/><line x1="${w-1}" y1="0" x2="${w-1}" y2="${y}" stroke="${I_}" stroke-width="2.5"/>`;
 return{w,top:bs[0].top,bot:y+prev,svg}}
function ladderSVG(rows){const ns=rows.map(r=>series(r.items));const W=Math.max(...ns.map(n=>n.w))+110;let y=ns[0].top+14,out='',ys=[];
 rows.forEach((r,i)=>{ys.push(y);const n=ns[i];out+=`<line x1="14" y1="${y}" x2="34" y2="${y}" stroke="${I_}" stroke-width="2.5"/><g transform="translate(34,${y})">${n.svg}</g><line x1="${34+n.w}" y1="${y}" x2="${W-40}" y2="${y}" stroke="${I_}" stroke-width="2.5"/>`;
  if(r.note)out+=`<text x="38" y="${y+n.bot+14}" font-size="10.5" font-weight="700" fill="#5b5470">${r.note}</text>`;
  const nx=ns[i+1];y+=n.bot+(r.note?22:6)+(nx?nx.top:0)+10});
 const H=y+8;out=`<line x1="14" y1="14" x2="14" y2="${ys[ys.length-1]}" stroke="#e53935" stroke-width="5"/><line x1="${W-40}" y1="14" x2="${W-40}" y2="${ys[ys.length-1]}" stroke="#37474f" stroke-width="5"/><text x="14" y="10" text-anchor="middle" font-size="11" font-weight="900" fill="#e53935">FASE</text><text x="${W-40}" y="10" text-anchor="middle" font-size="11" font-weight="900" fill="#37474f">NEUTRO</text>`+out;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;display:block;margin:0 auto">${out}</svg>`}
function powerSVG(kind){const rev=kind==='rev',C=['#e53935','#fdd835','#1e88e5'],ys=[62,94,126];let s='';
 const box=(x,y,w,h,t,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${f||'#fff'}" stroke="${I_}" stroke-width="3"/><text x="${x+w/2}" y="${y+16}" text-anchor="middle" font-size="11" font-weight="900" fill="${I_}">${t}</text>`;
 const ln=(x1,y1,x2,y2,c,d)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${I_}" stroke-width="7" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="4" stroke-linecap="round"${d?' stroke-dasharray="1 8"':''}/>`;
 const tg=(x,y,t,c)=>`<text x="${x}" y="${y}" font-size="9" font-weight="900" fill="${c||I_}">${t}</text>`;
 s+=box(20,36,70,116,'FONTE','#e4dcff')+box(150,36,70,116,'Q1','#fff')+box(270,36,80,116,rev?'K1 · FRENTE':'K1','#fff')+box(420,36,80,116,'F2 térmico','#fff')+box(560,36,70,116,'MOTOR','#e4dcff');
 ys.forEach((y,i)=>{s+=ln(90,y,150,y,C[i])+ln(220,y,270,y,C[i])+ln(350,y,420,y,C[i])+ln(500,y,560,y,C[i])+tg(96,y-6,['R','S','T'][i])+tg(228,y-6,['2','4','6'][i])+tg(356,y-6,'L'+(i+1))+tg(506,y-6,['U','V','W'][i])});
 let H=190;
 if(rev){const y2=[206,238,270];H=316;s+=box(270,176,80,116,'K2 · REVERSO','#dff0ff');
  [0,1,2].forEach(i=>{const jx=232+i*9;s+=ln(jx,ys[i],jx,y2[i],C[i])+ln(jx,y2[i],270,y2[i],C[i])+`<circle cx="${jx}" cy="${ys[i]}" r="4" fill="${I_}"/>`});
  [0,1,2].forEach(i=>{s+=ln(350,y2[i],420,ys[2-i],C[i])});
  s+=`<text x="385" y="${H-4}" text-anchor="middle" font-size="11" font-weight="900" fill="#c0182c">K2 cruza duas fases: L1 ↔ L3</text><text x="395" y="${y2[0]-36}" font-size="9" font-weight="800" fill="#5b5470">saídas cruzadas</text>`}

  else if(c.type==='K'){const on=st.k[c.id];p(c.id+'_arm').setAttribute('fill',on?'#19c37d':'#c3bddb');p(c.id+'_arm').setAttribute('y',on?84:78);const t=p(c.id+'_stt');t.textContent=on?'LIGADO':'DESLIGADO';if(lastK[c.id]!==undefined&&lastK[c.id]!==on)sfx.clack();lastK[c.id]=on;
   if(res.loads[c.id]===380)msgs.push(`⚠️ Bobina de ${c.id} ligada em 380 V (entre duas fases): queimaria! Use fase e neutro.`)}
  else if(c.type==='F2'){const t=p(c.id+'_st');t.textContent=st.trip[c.id]?'DESARMOU':'OK';t.setAttribute('fill',st.trip[c.id]?'#c0182c':'#0a7a4b')}
  else if(c.type==='H'){const on=res.loads[c.id]===220;p(c.id+'_bulb').setAttribute('fill',on?c.color:'#ddd');p(c.id+'_glow').setAttribute('opacity',on?.55:0);p(c.id+'_glow').setAttribute('filter',on?'url(#glow)':'');if(res.loads[c.id]===380)msgs.push('⚠️ Lâmpada ligada em 380 V: queimaria! Use fase e neutro.')}
  else if(c.type==='S0'||c.type==='SB'){p(c.id+'_b').setAttribute('transform',st.press[c.id]?'translate(0,3) scale(.94)':'');p(c.id+'_b').style.transformOrigin='center'}
  else if(c.type==='SRC'){p(c.id+'_mst').setAttribute('fill',st.master?'#19c37d':'#ff4d5e');p(c.id+'_mst').setAttribute('x',st.master?266:292)}
  else if(c.type==='M'){const m=res.motor,t=p(c.id+'_st');motorRun=m.state==='run'?1:m.state==='phase'?.25:0;motorDir=m.state==='run'?m.dir:1;
   t.textContent={off:'PARADO',run:m.dir>0?'↻ FRENTE':'↺ REVERSO',phase:'🔊 ZUMBINDO (falta fase)',bad:'⚠️ LIGAÇÃO ERRADA'}[m.state]}}
 if(res.motor.state==='phase')msgs.push('🔊 O motor está zumbindo: falta uma fase ou duas fases iguais. Confira U, V e W.');
 if(res.motor.state==='bad')msgs.push('⚠️ O motor foi ligado ao neutro. Ele precisa das 3 fases.');
 if(res.osc)msgs.push('Circuito vibrando (oscila). Revise o intertravamento.');
 if(msgs.length){flash=msgs.join(' ');$('#status').className='bad';$('#status').textContent=flash}
 else{const m=res.motor;$('#status').className=m.state==='run'?'good':'';$('#status').textContent=m.state==='run'?(m.dir>0?'✅ Motor girando para a FRENTE (↻).':'✅ Motor girando em REVERSO (↺).'):'Arraste de um borne a outro para ligar um cabo. Toque num cabo para remover. Clique nos botões e no disjuntor para operar.'}
}
(function spin(){motorAng+=motorRun*motorDir*7;const f=document.getElementById('M1_fan');if(f){const j=motorRun===.25?(Math.random()*4-2):0;f.setAttribute('transform',`rotate(${motorAng+j} 120 124)`)}requestAnimationFrame(spin)})();
const CINFO={SRC:['Fonte','Três fases R, S, T (380 V entre fases) e neutro N (220 V entre fase e neutro). O botão GERAL desarma em curto na fonte.'],
 Q:['Disjuntor Q1','Liga e desliga o circuito e protege contra curto e sobrecarga. Bornes 1-3-5 (entrada) e 2-4-6 (saída). Clique para ligar.'],
 FU:['Fusível F1','Protege o circuito de comando e queima em curto. Clique no fusível queimado para trocar.'],
 K:['Contator K','Chave de potência acionada por uma bobina (A1-A2). Potência 1-3-5 / 2-4-6. Auxiliares: 13-14 (NA) e 21-22 (NF). Segure o corpo para acionar à mão.'],
 F2:['Relé térmico F2','Protege o motor contra sobrecarga. O NF 95-96 corta a bobina; o NA 97-98 serve para sinalizar. Use SOBRECARGA para simular e REARMAR para voltar.'],
 S0:['Botão S0 (DESLIGA)','Vermelho, contato NF nos bornes 11-12. Em série com o comando.'],
 SB:['Botão LIGA','Contato NA nos bornes 13-14 (verde ou azul). Alguns têm também NF nos bornes 21-22.'],
 H:['Lâmpada de sinalização','220 V: ligue entre fase e neutro (X1 e X2).'],
 M:['Motor M1','Trifásico: U1, V1 e W1 recebem as três fases. Trocar duas fases inverte o sentido de giro.']};
function compInfo(){const seen=new Set(),out=[];for(const c of comps){if(seen.has(c.type))continue;seen.add(c.type);const i=CINFO[c.type];if(i)out.push(`<li><b>${i[0]}:</b> ${i[1]}</li>`)}return '<ul class="ci">'+out.join('')+'</ul><p class="hint">Cores dos cabos (automáticas): R vermelho · S amarelo · T azul · N preto · comando sem fase em marrom. Cabos tracejados já vêm prontos e não podem ser removidos.</p>'}
/* ---------- fases ---------- */
function chips(){$('#lv').innerHTML=GAME.levels.map(l=>`<button class="chip${l.id===LV.id?' cur':''}${l.bonus?' bonus':''}${l.boss?' boss':''}" data-i="${l.id}" title="${l.name}">${l.boss?'🏆':l.id}<i>${'★'.repeat(S.stars[l.id]||0)+'☆'.repeat(3-(S.stars[l.id]||0))}</i></button>`).join('')}
$('#lv').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b&&!lock)openLevel(+b.dataset.i)});
function openLevel(id){
 LV=GAME.levels.find(l=>l.id===id);comps=LV.comps;pre=LV.pre.map(w=>[w[0],w[1]]);wires=(S.wires[id]||[]).filter(w=>jposOK(w));hist=[];armed=null;hints=0;attempts=0;listUsed=false;lastK={};st=mkState(comps);
 $('#resbox').classList.add('hidden');$('#cheat').classList.add('hidden');
 const sp=(typeof SCH!=='undefined')&&SCH[id];schemUsed=false;
 $('#lesson').innerHTML=`<h2>${LV.boss?'🏆 ':''}Fase ${id} · ${LV.name}${LV.bonus?' (bônus)':''}</h2><p><b>Missão:</b> ${LV.goal}</p><div class="learn">💡 <b>Aprenda:</b> ${LV.learn}</div><details class="dt"><summary>🔎 Conheça os componentes desta fase</summary>${compInfo()}</details>`;
 $('#btest').textContent=LV.demo?'⚡ Provocar o curto':'▶ Testar';
 chips();buildBench();fit();refresh();say(`<b>Fase ${id}:</b> ${LV.goal}`);
 $('#scroll').scrollTo(0,0);window.scrollTo({top:0});
 if(typeof TRAIL!=='undefined'&&TRAIL[id]&&!S.seen[id])setTimeout(()=>{if(!lock)openTrail(id,0)},0)}
function jposOK(w){return comps.some(c=>w[0].startsWith(c.id+'.'))&&comps.some(c=>w[1].startsWith(c.id+'.'))}
function clearResult(){if(!lock)$('#resbox').classList.add('hidden');if(!$('#cheat').classList.contains('hidden'))renderCheat()}
/* ---------- dicas, lista, desfazer, limpar ---------- */
const allW=()=>[...pre,...wires];
function missing(){return LV.sol.filter(w=>!wireSat(allW(),w[0],w[1]))}
$('#bhint').onclick=()=>{if(lock)return;hints++;const m=missing();
 if(hints===1||!m.length){say('💡 '+LV.tip);return}
 const w=m[0];say(`💡 Falta ligar <b>${termName(w[0])}</b> → <b>${termName(w[1])}</b>. Veja os bornes piscando.`);
 const hl=$('#hl');hl.innerHTML=[w[0],w[1]].map(t=>`<circle class="blink" cx="${jpos[t].x}" cy="${jpos[t].y}" r="14" fill="none" stroke="#6c4cf1" stroke-width="5"/>`).join('');setTimeout(()=>{hl.innerHTML=''},4000)};
function renderCheat(){const s=LV.sol;if(!s.length){$('#cheat').innerHTML='<b>Nesta fase não há cabos para ligar.</b>';return}
 $('#cheat').innerHTML=`<b>📋 Lista de ligações desta fase</b> <span class="hint" style="font-size:12px">(${s.filter(w=>wireSat(allW(),w[0],w[1])).length}/${s.length} feitas)</span><ul>${s.map(w=>`<li class="${wireSat(allW(),w[0],w[1])?'ok':''}">${termName(w[0])} → ${termName(w[1])}</li>`).join('')}</ul>`}
$('#blist').onclick=()=>{if(lock)return;const c=$('#cheat');if(c.classList.contains('hidden')){if(!listUsed){listUsed=true;hints+=2}renderCheat();c.classList.remove('hidden')}else c.classList.add('hidden')};
$('#bundo').onclick=()=>{if(lock||!hist.length)return;wires=JSON.parse(hist.pop());persist();sfx.unplug();renderWires();refresh();clearResult()};
$('#bclear').onclick=()=>{if(lock||!wires.length)return;pushHist();wires=[];persist();sfx.unplug();renderWires();refresh();clearResult()};
/* ---------- teste animado ---------- */
$('#btest').onclick=async()=>{
 if(lock)return;lock=true;attempts++;const box=$('#resbox');box.classList.remove('hidden');
 const all=allW(),out=[];let firstBad=null;
 for(const t of LV.tests){st=mkState(comps);refresh();say('Teste: <b>'+t.name+'</b>');let fail=null;const faultsAll=[];
  await sleep(450);
  for(const s of t.steps){applyStep(st,s);refresh();(res.faults||[]).forEach(f=>faultsAll.push(f));await sleep(s.ex?650:520);
   if(s.ex){res.faults=faultsAll.slice();if(!checkEx(s.ex,st,res)){fail=s.msg||'Não saiu como esperado.';break}}}
  out.push({name:t.name,ok:!fail,msg:fail});if(fail&&!firstBad)firstBad=fail;
  box.innerHTML=`<b>Resultado dos testes</b><ul>${out.map(r=>`<li class="${r.ok?'ok':'bad'}">${r.ok?'✔':'✘'} ${r.name}${r.ok?'':`<small>🤖 ${r.msg}</small>`}</li>`).join('')}</ul>`}
 st=mkState(comps);lastK={};refresh();lock=false;
 if(!firstBad){const stars=hints===0&&attempts<=3?3:hints<=2?2:1;S.stars[LV.id]=Math.max(S.stars[LV.id]||0,stars);save();chips();sfx.win();say(LV.boss?'Chefão derrotado! Você é mestre da bancada! 🏆':'Funcionou! Fase concluída! 🎉');showWin(stars)}
 else{sfx.bad();say('Quase! '+firstBad,'bad')}};
function showWin(stars){const i=GAME.levels.findIndex(l=>l.id===LV.id),nx=GAME.levels[i+1];
 $('#mbody').innerHTML=`<h2>${LV.boss?'🏆':'🎉'} Fase ${LV.id} concluída!</h2><div class="bigstars">${'★'.repeat(stars)+'☆'.repeat(3-stars)}</div><p>${LV.learn}</p><p style="font-size:12px;opacity:.7">3 estrelas: sem dicas e em até 3 testes · 2 estrelas: poucas dicas</p><div class="mbts"><button class="btn rst" id="m-stay">Continuar na bancada</button>${nx?'<button class="btn run" id="m-next">Próxima fase ▶</button>':''}</div>`;
 $('#modal').classList.remove('hidden');$('#m-stay').onclick=()=>$('#modal').classList.add('hidden');if(nx)$('#m-next').onclick=()=>{$('#modal').classList.add('hidden');openLevel(nx.id)}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){e.target.classList.add('hidden');$('#mbody').style.maxWidth=''}});
$('#snd').textContent=S.sound?'🔊':'🔇';
window.addEventListener('resize',()=>{});
openLevel(GAME.levels.find(l=>!S.stars[l.id])?GAME.levels.find(l=>!S.stars[l.id]).id:1);

$('#bsch').onclick=()=>{if(lock)return;const sp=SCH[LV.id];if(!sp)return;if(LV.boss&&!schemUsed){schemUsed=true;hints++}
 $('#mbody').innerHTML=`<h2>📐 Esquema · Fase ${LV.id}</h2>${schemHTML(sp)}${LV.boss?'<p class="hint">Abrir o esquema nesta fase conta como 1 dica.</p>':''}<div class="mbts"><button class="btn run" id="m-x">Voltar à bancada</button></div>`;
 $('#mbody').style.maxWidth='980px';$('#modal').classList.remove('hidden');$('#m-x').onclick=()=>{$('#modal').classList.add('hidden');$('#mbody').style.maxWidth=''}};

/* ---------- trilha antes de cada fase ---------- */
function figPhases(){const C=['#e53935','#fdd835','#1e88e5','#37474f'],N=['R','S','T','N'];let s='';
 N.forEach((n,i)=>{const x=60+i*70;s+=`<line x1="${x}" y1="40" x2="${x}" y2="130" stroke="${INK}" stroke-width="9" stroke-linecap="round"/><line x1="${x}" y1="40" x2="${x}" y2="130" stroke="${C[i]}" stroke-width="5" stroke-linecap="round"/><text x="${x}" y="30" text-anchor="middle" font-size="14" font-weight="900" fill="${INK}">${n}</text>`});
 s+=`<path d="M60 150V158H270V150" fill="none" stroke="#19c37d" stroke-width="3.5"/><text x="165" y="178" text-anchor="middle" font-size="12" font-weight="900" fill="#0a7a4b">fase ↔ neutro = 220 V ✔ (lâmpada e bobina)</text>`;
 s+=`<path d="M60 190V198H130V190" fill="none" stroke="#e53935" stroke-width="3.5"/><text x="200" y="202" font-size="12" font-weight="900" fill="#c0182c">fase ↔ fase = 380 V ✘ (queimaria)</text>`;
 return `<svg viewBox="0 0 440 215" style="width:100%;max-width:440px;height:auto;display:block;margin:6px auto">${s}</svg>`}
function figContacts(){const g=(x,it,t1,t2,c)=>`<g transform="translate(${x},52)">${sym(it).svg}</g><text x="${x+38}" y="104" text-anchor="middle" font-size="12" font-weight="900" fill="${c}">${t1}</text><text x="${x+38}" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="${INK}">${t2}</text>`;
 return `<svg viewBox="0 0 420 140" style="width:100%;max-width:420px;height:auto;display:block;margin:6px auto">${g(30,na('NA','13-14'),'Em repouso: ABERTO','Apertou: FECHA','#0a7a4b')}${g(240,nf('NF','11-12'),'Em repouso: FECHADO','Apertou: ABRE','#c0182c')}</svg>`}
let trStep=0;
function openTrail(id,step){
 const steps=TRAIL[id];if(!steps)return;trStep=step||0;const s=steps[trStep],last=trStep===steps.length-1,lv=GAME.levels.find(l=>l.id===id);
 const fig=s.fig==='phases'?figPhases():s.fig==='contacts'?figContacts():s.fig==='schem'&&SCH[id]?`<div style="margin:6px 0">${schemHTML(SCH[id])}</div>`:'';
 const dots=steps.map((_,i)=>`<span style="display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid ${INK};margin:0 3px;background:${i===trStep?'var(--yellow)':i<trStep?'var(--green)':'#fff'}"></span>`).join('');
 $('#mbody').innerHTML=`<h2>📖 Trilha · Fase ${id}</h2><div>${dots}</div><h3 style="margin:8px 0 2px">${s.t}</h3><p style="text-align:left">${s.p}</p>${fig}${last?`<p style="background:#f3efff;border-radius:10px;padding:8px"><b>🎯 Missão:</b> ${lv.goal}</p>`:''}<div class="mbts">${trStep>0?'<button class="btn" id="t-prev">◀ Voltar</button>':''}<button class="btn run" id="t-next">${last?'Começar a fase 🚀':'Próximo ▶'}</button></div><p><a href="#" id="t-skip" style="font-size:12px">pular trilha</a></p>`;
 $('#mbody').style.maxWidth='720px';$('#modal').classList.remove('hidden');
 const end=()=>{S.seen[id]=1;save();$('#modal').classList.add('hidden')};
 const pv=document.getElementById('t-prev');if(pv)pv.onclick=()=>openTrail(id,trStep-1);
 $('#t-next').onclick=()=>{sfx.tick();if(last)end();else openTrail(id,trStep+1)};
 $('#t-skip').onclick=e=>{e.preventDefault();end()}}
new MutationObserver(()=>{if($('#modal').classList.contains('hidden'))$('#mbody').style.maxWidth=''}).observe($('#modal'),{attributes:true});
$('#btrail').onclick=()=>{if(!lock){sfx.tick();openTrail(LV.id,0)}};

</script></body></html>
