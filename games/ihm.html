<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mestre da IHM</title>
<style>
:root{--ink:#2b2250;--bg1:#fff3c9;--bg2:#d9f2ff;--purple:#6c4cf1;--pink:#ff5fa2;--yellow:#ffd23f;--teal:#2ec4b6;--orange:#ff9f1c;--green:#19c37d;--grey:#c3bddb;--red:#ff4d5e;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));-webkit-user-select:none;user-select:none}
h1,h2,p{margin:0}
h2{font-size:15px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.hidden{display:none!important}
#app{display:grid;height:100vh;height:100dvh;padding:10px;gap:10px;grid-template-columns:370px minmax(0,1fr) 270px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "cat stage side" "foot foot foot"}
.btn{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:12px}
.btn.run{background:var(--green);color:#fff}.btn.stop{background:var(--red);color:#fff}.btn.rst{background:var(--yellow)}.btn.chk{background:var(--purple);color:#fff}
#top{grid-area:top;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.row1,.row2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;font-size:18px;color:var(--purple);white-space:nowrap}
#lv{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.chip{width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:#fff;font:inherit;font-weight:900;font-size:15px;line-height:1;cursor:pointer;padding:0;color:var(--ink)}
.chip i{display:block;font-style:normal;font-size:8px;color:var(--orange);letter-spacing:-1px;margin-top:1px}
.chip.cur{background:var(--yellow)}.chip.lock{opacity:.45;cursor:not-allowed}
.row2{justify-content:space-between}
.ttl{flex:1;min-width:220px}
.ttl h1{font-size:19px}
.ttl p{font-size:14px;margin-top:2px}
.side{display:flex;align-items:center;gap:10px}
#stars{font-size:26px;color:var(--orange);letter-spacing:2px}
/* catalog */
#cat{grid-area:cat;padding:10px;overflow:auto}
#cat h2{margin-bottom:8px}
.scard{display:flex;gap:8px;align-items:flex-start;padding:7px;border:3px solid var(--ink);border-radius:12px;background:#fff7d6;cursor:grab;margin-bottom:8px;font-size:12px;line-height:1.25}
.scard .em{font-size:26px;line-height:1;flex:none}
.scard b{display:block;font-size:13px}
.scard small{display:block;font-weight:600;font-size:10.5px;opacity:.8;margin-top:2px}
.scard.sel{background:var(--yellow);outline:4px solid var(--green)}
.tip{font-size:11px;opacity:.75;margin-top:6px;line-height:1.3}
/* stage */
#stage{grid-area:stage;display:flex;flex-direction:column;min-height:0;min-width:0;padding:8px;gap:6px}
#tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-weight:800;font-size:13px;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;background:#fff;cursor:pointer;color:var(--ink)}
.tab.cur{background:var(--yellow)}.tab.okk{background:#b8f2d6}
#brief{font-size:13px;font-weight:700;padding:2px 4px}
#scenewrap{flex:1;min-height:0;border:3px dashed var(--grey);border-radius:14px;background:#eaf4ff;overflow:hidden}
#scene{display:block;width:100%;height:100%}
.ct{font-weight:900;font-size:14px;fill:#2b2250;font-family:inherit}
.tiny{font-weight:800;font-size:11px;fill:#2b2250;font-family:inherit}
/* side */
#side{grid-area:side;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.box2{background:#f3efff;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.35}
.box2 b{font-size:14px}
.box2 label{display:block;font-weight:800;margin:6px 0 2px;font-size:12px}
.box2 input[type=range]{width:100%}
.box2 input[type=number]{width:80px;font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 4px}
.val{font-weight:900;color:var(--purple)}
.res{list-style:none;padding:0;margin:4px 0 0}
.res li{padding:5px 8px;border-radius:9px;margin-bottom:4px;font-size:12px;font-weight:700}
.res li.ok{background:#d6f7e7}.res li.bad{background:#ffdde1}
.res li small{display:block;font-weight:600;margin-top:1px}
.badge{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:11px;font-weight:800;background:#fff;margin-right:4px}
/* footer */
#foot{grid-area:foot;display:flex;align-items:center;gap:12px;padding:8px 12px}
#relewrap{width:64px;flex:none}
#rele{width:64px;height:70px;display:block;animation:bob 2.4s ease-in-out infinite}
#bubble{flex:1;position:relative;background:#f3efff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.3;min-height:48px;display:flex;align-items:center}
#bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(43,34,80,.55);display:grid;place-items:center;z-index:50;padding:12px}
.mcard{max-width:540px;width:100%;padding:18px;max-height:92vh;overflow:auto;text-align:center}
.mcard.wide{max-width:720px}
.mcard h2{font-size:22px;margin-bottom:8px}
.mcard h3{margin:8px 0 4px;font-size:17px;color:var(--purple)}
.mcard p{margin:6px 0;font-size:14px;line-height:1.4}
.mcard a{color:var(--purple);font-size:12px;font-weight:700}
.bigstars{font-size:44px;color:var(--orange);letter-spacing:4px}
.pista{text-align:left;background:#fff7d6;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}
.mbts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.hintcard{text-align:left;background:#fff7d6;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;margin:8px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots span{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots span.on{background:var(--yellow)}
.demo{border:3px dashed var(--grey);border-radius:14px;padding:10px;margin:8px 0;background:#fbfaff;text-align:left}
.demo .pcs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.demo .pc{font:inherit;font-weight:800;font-size:12px;border:3px solid var(--ink);border-radius:10px;padding:4px 8px;background:#fff;cursor:pointer;color:var(--ink)}
.demo .pc.sel{background:var(--yellow)}
.demo input[type=range]{width:100%}
.demo .out{margin-top:6px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.led{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:#9a94b8;display:inline-block;flex:none}
.led.on{background:var(--green)}
@media(max-width:900px){
 #app{height:auto;min-height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "stage" "cat" "side" "foot"}
 #app>*{min-width:0}
 #cat{overflow:visible}#cat h2,.tip{display:none}
 #catitems{display:flex;gap:8px;overflow:auto}
 .scard{flex:none;width:200px;margin:0}
 #scenewrap{height:300px;flex:none}
 #foot{position:sticky;bottom:6px;z-index:20;flex-wrap:wrap;padding:6px 8px;gap:8px}
 #relewrap,#rele{width:44px;height:48px}
 #bubble{min-width:150px;font-size:12px;padding:6px 8px;min-height:40px}
 .btns{width:100%;justify-content:center}
 .btn{padding:6px 10px;font-size:13px}
 .logo{font-size:15px}.ttl h1{font-size:16px}
 #lv{flex:1 1 100%;order:5;justify-content:center}
 .chip{width:36px;height:40px;font-size:14px}
 .ttl{min-width:0;flex:1 1 100%}
}
.fld{display:block;margin-bottom:10px;font-size:12.5px;font-weight:800}
.fld span{display:block;margin-bottom:3px}
.fld select{width:100%;font:inherit;font-weight:700;font-size:12.5px;border:3px solid var(--ink);border-radius:10px;padding:5px;background:#fff;color:var(--ink)}
.fld input[type=range]{width:100%}
.res li.tst{background:#fff;border:2px dashed var(--grey);font-weight:600}
.res b{font-size:inherit}
#scene{overflow:visible}
#howto{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:800}
#howto .st{flex:1 1 150px;background:#fff7d6;border:3px solid var(--ink);border-radius:12px;padding:5px 9px;line-height:1.25}
#howto .st b{display:inline-block;background:var(--purple);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;margin-right:5px}
.fld select:focus,.fld input:focus{outline:3px solid var(--yellow)}
.pbar{height:10px;background:#ece8f7;border:2px solid var(--ink);border-radius:8px;overflow:hidden;margin:2px 0 8px}
.pbar i{display:block;height:100%;background:var(--green);transition:width .3s}
.steptitle{font-size:17px;font-weight:900;color:var(--purple);margin:4px 0 6px}
#cat .box2{margin-bottom:8px}.box2.dados{background:#fff7d6}
.dt{width:100%;border-collapse:collapse;margin-top:4px;font-size:12px}.dt th,.dt td{border:2px solid var(--ink);padding:2px 5px;text-align:left}.dt th{background:#e4dcff}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{font:inherit;font-weight:700;font-size:13px;text-align:left;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);cursor:pointer}
.opt:hover{background:#f3efff}.opt.sel{background:var(--yellow);outline:3px solid var(--green)}
.numrow{display:flex;align-items:center;gap:6px}
.numrow input{flex:1;min-width:0;font:inherit;font-weight:900;font-size:20px;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:6px;color:var(--ink)}
.nb{font:inherit;font-weight:900;font-size:22px;width:44px;height:44px;border:3px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.un{font-weight:800;min-width:34px}
.ctrl{margin:8px 0}
.fb{border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.35;margin:6px 0;font-weight:600}
.fb.ok{background:#d6f7e7}.fb.bad{background:#ffdde1}
.slist{list-style:none;padding:0;margin:4px 0 0}.slist li{padding:5px 8px;border-radius:9px;margin-bottom:3px;font-size:12px;font-weight:700;cursor:pointer;background:#fff;border:2px solid var(--grey)}
.slist li.ok{background:#d6f7e7}.slist li.cur{border-color:var(--ink);background:#fff7d6}
.sum{list-style:none;padding:0;margin:4px 0 0;font-size:12px}.sum li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--grey);padding:3px 0}.sum li b{font-size:12px;text-align:right}
.fig{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0;font-size:12px;font-weight:800}
.fig .n{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 8px;min-width:78px}.fig .n span{display:block;font-size:26px}
.fig .a{font-size:18px;color:var(--purple)}
</style>
</head>
<body>
<div id="app">
 <header id="top" class="card">
  <div class="row1">
   <div class="logo">🖥️ Mestre da IHM</div><a class="btn sm" href="../index.html" title="Voltar ao portal">🏠 Portal</a>
   <nav id="lv"></nav>
   <div><button class="btn sm" id="snd" title="Sons">🔊</button> <button class="btn sm" id="rstp" title="Zerar progresso">↺ Zerar</button></div>
  </div>
  <div class="row2">
   <div class="ttl"><h1 id="ltitle"></h1><p id="lmission"></p></div>
   <div class="side"><div id="stars"></div><button class="btn sm" id="howbtn">❓ Como jogar</button><button class="btn sm" id="lessonbtn">📖 Trilha</button><button class="btn sm rst" id="hintbtn">💡 Dica</button></div>
  </div>
 </header>
 <aside id="cat" class="card"></aside>
 <main id="stage" class="card">
    <div id="howto"></div>
  <div id="scenewrap"><svg id="scene" viewBox="0 0 600 380" preserveAspectRatio="xMidYMid meet"></svg></div>
 </main>
 <aside id="side" class="card"></aside>
 <footer id="foot" class="card">
  <div id="relewrap">
   <svg id="rele" viewBox="0 0 90 100">
    <line x1="45" y1="8" x2="45" y2="22" stroke="#2b2250" stroke-width="4"/><circle cx="45" cy="7" r="6" fill="#ff5fa2" stroke="#2b2250" stroke-width="3"/>
    <rect x="22" y="80" width="46" height="16" rx="7" fill="#ff9f1c" stroke="#2b2250" stroke-width="4"/>
    <rect x="3" y="38" width="8" height="22" rx="4" fill="#ffd23f" stroke="#2b2250" stroke-width="3"/><rect x="79" y="38" width="8" height="22" rx="4" fill="#ffd23f" stroke="#2b2250" stroke-width="3"/>
    <rect x="10" y="20" width="70" height="58" rx="17" fill="#7fd8ff" stroke="#2b2250" stroke-width="4"/>
    <rect x="18" y="29" width="54" height="36" rx="11" fill="#2b2250"/>
    <circle class="eye" id="e1" cx="35" cy="44" r="5" fill="#7cff8a"/><circle class="eye" id="e2" cx="55" cy="44" r="5" fill="#7cff8a"/>
    <path id="mouth" d="M36 54Q45 63 54 54" stroke="#7cff8a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="25" cy="58" r="3" fill="#ff5fa2" opacity=".8"/><circle cx="65" cy="58" r="3" fill="#ff5fa2" opacity=".8"/>
   </svg>
  </div>
  <div id="bubble"></div>
  <div class="btns">
   <button class="btn run" id="run">▶ RODAR</button>
   <button class="btn rst" id="restart">↻ REINICIAR</button>
   <button class="btn chk" id="chk">✓ VERIFICAR</button>
  </div>
 </footer>
</div>
<div id="modal" class="overlay hidden"><div class="mcard card" id="mbody"></div></div>

<script>
/*PURE_START*/
const fmt=(v,d)=>Number(v).toFixed(d).replace('.',',');
const ACC=['Operador','Manutenção','Engenharia'];
const accOpts=ACC.map((t,i)=>[i,t]);
const TAGOPT=[['I00','I0.0 · Sensor de porta (entrada física)'],['M00','M0.0 · Memória LIGA'],['M01','M0.1 · Memória DESLIGA'],['Q00','Q0.0 · Saída do motor'],['M05','M0.5 · Memória sem uso']];
const MODOPT=[['mom','Momentâneo (só enquanto segura)'],['alt','Alternado (liga/desliga a cada toque)'],['set','Seta (liga e fica ligado)']];
function tagMsg(role,tag){
 const good={start:'M00',stop:'M01',lamp:'Q00'}[role];
 if(tag===good)return null;
 const m={
  I00:'I0.0 é uma <b>entrada física</b>: a IHM não consegue escrever nela, e ela só mostra o sensor da porta.',
  M05:'M0.5 não é usada pelo programa do CLP: nada acontece.',
  M00:role==='stop'?'M0.0 é a memória LIGA: o botão DESLIGAR passou a ligar o motor!':'M0.0 só dá um pulso quando o operador aperta LIGAR: a lâmpada não mostra o estado do motor.',
  M01:role==='start'?'M0.1 é a memória DESLIGA: o botão LIGAR passou a desligar!':'M0.1 é o pulso de DESLIGAR: a lâmpada não mostra o estado do motor.',
  Q00:role==='lamp'?null:'Q0.0 é a saída do motor. Escrever direto nela <b>passa por cima do programa</b> (ignora intertravamentos e o desligar). A IHM deve escrever em memórias.'};
 return m[tag];
}
function t1(role,label){return {n:label,f:c=>{const tag=c[role],msg=tagMsg(role,tag);
 if(role==='lamp')return {ok:!msg,note:msg||'A lâmpada acompanha o motor.',show:['Lâmpada lê: '+tag],st:{motor:true,lamp:!msg}};
 const on=role==='start';return {ok:!msg,note:msg||(on?'Motor ligou.':'Motor desligou.'),show:['Botão escreve em '+tag],st:{motor:!msg?on:!on}}}}}
function lvl2(){return [
 {n:'Apertar e soltar LIGAR',f:c=>{const on=c.ligaMode!=='mom';return {ok:on,note:on?'O motor continua ligado depois de soltar.':'Com botão <b>momentâneo</b>, o sinal volta a zero quando o operador solta e o motor para.',show:['LIGAR solto'],st:{motor:on}}}},
 {n:'Apertar LIGAR com o motor já ligado',f:c=>{const on=c.ligaMode==='set';return {ok:on,note:on?'O motor segue ligado.':'O <b>alternado</b> inverte o estado a cada toque: um toque a mais e a máquina para sozinha.',show:['LIGAR apertado 2x'],st:{motor:on}}}},
 {n:'Segurar o botão JOG (ajuste manual)',f:c=>({ok:true,note:'Enquanto segura, o motor gira.',show:['JOG pressionado'],st:{motor:true}})},
 {n:'Soltar o botão JOG',f:c=>{const off=c.jogMode==='mom';return {ok:off,note:off?'Soltou, parou. É o comportamento seguro do ajuste manual.':'O motor ficou ligado depois de soltar o JOG: perigoso para quem está ajustando a máquina!',show:['JOG solto'],st:{motor:!off}}}}]}
function scaleT(raw,exp,c){const rm=Math.max(1,c.rawMax),v=c.engMin+raw/rm*(c.engMax-c.engMin);return {v,ok:Math.abs(v-exp)<=0.5}}
function lvl3(){const T=(raw,exp,n)=>({n,f:c=>{const r=scaleT(raw,exp,c),dec=c.dec;return {ok:r.ok,note:r.ok?'Leitura correta.':`Mostrou <b>${fmt(r.v,dec)} ${c.unit}</b> mas o certo é ${fmt(exp,1)}. Confira o valor bruto máximo do módulo e a faixa do sensor.`,show:['Valor bruto: '+raw,'Tela: '+fmt(r.v,dec)+' '+c.unit],st:{frac:Math.max(0,Math.min(1,r.v/150)),txt:fmt(r.v,dec)+' '+c.unit}}}});
 return [T(0,0,'Sensor no mínimo (valor bruto 0)'),T(13824,75,'Sensor na metade (valor bruto 13824)'),T(27648,150,'Sensor no máximo (valor bruto 27648)'),
 {n:'Leitura fina: 73,5 °C (valor bruto 13548)',f:c=>{const r=scaleT(13548,73.5,c),okd=c.dec>=1;return {ok:r.ok&&okd,note:!okd?'Com <b>0 casas decimais</b> o operador não enxerga os décimos (73,5 vira '+Math.round(r.v)+'). Aqui o processo exige 0,1 °C.':r.ok?'Leitura correta.':'Escala errada: mostrou '+fmt(r.v,c.dec)+'.',show:['Tela: '+fmt(r.v,c.dec)+' '+c.unit],st:{frac:r.v/150,txt:fmt(r.v,c.dec)+' '+c.unit}}}},
 {n:'Unidade na tela',f:c=>{const ok=c.unit==='°C';return {ok,note:ok?'Unidade correta.':'O sensor mede temperatura em <b>°C</b>. A unidade na tela precisa combinar com o que se mede.',show:['Unidade: '+c.unit],st:{frac:.5,txt:'75 '+c.unit}}}}]}
function lvl4(){const acc=(x,c)=>x>=c.limMin&&x<=c.limMax;
 const A=(x,exp,n)=>({n,f:c=>{const a=acc(x,c);return {ok:a===exp,note:a===exp?(exp?'Valor aceito.':'Valor recusado.'):(exp?`O valor ${x} rpm é bom para o produto, mas a IHM o recusou.`:`A IHM aceitou ${x} rpm, que estraga o produto ou força o motor.`),show:['Operador digita '+x,a?'Aceito':'Recusado'],st:{rpm:a?x:0}}}});
 return [A(300,true,'Operador digita 300 rpm (mínimo do produto)'),A(900,true,'Operador digita 900 rpm (máximo do produto)'),A(250,false,'Operador digita 250 rpm (pouco: o produto empelota)'),A(950,false,'Operador digita 950 rpm (muito: derrama)'),
 {n:'Valor inicial ao ligar a máquina',f:c=>{const ok=acc(c.defv,c)&&c.defv>=300&&c.defv<=900;return {ok,note:ok?'Valor inicial seguro.':'O valor inicial precisa estar dentro da faixa boa (300 a 900 rpm).',show:['Inicial: '+c.defv+' rpm'],st:{rpm:c.defv}}}}]}
function lvl5(){const al=(lv,c)=>lv<=c.lo?'lo':lv>=c.hh?'hh':lv>=c.hi?'hi':null;
 const N=(lv,exp,n,why)=>({n,f:c=>{const a=al(lv,c),ok=a===exp;return {ok,note:ok?(exp?'Alarme correto.':'Sem alarme, como deve ser.'):(a?`Disparou o alarme ${({lo:'BAIXO',hi:'ALTO',hh:'CRÍTICO'})[a]}: ${why[0]}`:`Não disparou nada: ${why[1]}`),show:['Nível '+lv+'%',a?'ALARME '+a.toUpperCase():'Normal'],st:{level:lv,alarm:a}}}});
 return [N(35,null,'Nível 35% (operação normal)',['alarme falso, o operador vai ignorar de tanto repetir.','']),N(75,null,'Nível 75% (operação normal)',['alarme falso, nível ainda é normal.','']),

function evalLevel(L,cfg){const c=withDefaults(L,cfg),results=L.tests.map(t=>Object.assign({n:t.n},t.f(c)));return {ok:results.every(r=>r.ok),results}}

const DUR=1900;
function play(){
 const lv=evalLevel(L,cfg);run={lv,i:0,t0:performance.now(),stop:false};$('#run').disabled=true;
 say('Rodando os testes na máquina. Observe a tela da IHM e o que a máquina faz!','think');
 requestAnimationFrame(loop);
}
function loop(now){
 if(!run)return;
 const el=now-run.t0,r=run.lv.results[run.i];
 drawStep(r,el>DUR*.55?(r.ok?' ✔':' ✘'):'');
 if(el>DUR*.55&&!r._s){r._s=1;r.ok?sfx.ok():sfx.fail()}
 if(el>=DUR){run.i++;run.t0=now;if(run.i>=run.lv.results.length)return endRun()}
 requestAnimationFrame(loop);
}
function endRun(){
 const lv=run.lv;run=null;$('#run').disabled=false;last=lv;renderSide(lv);
 const n=lv.results.filter(x=>x.ok).length;
 say(lv.ok?'Tudo passou nos testes! Aperte ✓ VERIFICAR para fechar a fase.':`Passaram ${n} de ${lv.results.length} testes. Veja a lista ao lado e ajuste os parâmetros.`,lv.ok?'happy':'think');
 lv.results.forEach(r=>delete r._s);
}
function stopRun(){run=null;$('#run').disabled=false;drawIdle()}

function openHints(){
 const n=Math.min(hints,3);
 modal(`<h2>💡 Dicas da fase ${L.id}</h2><p style="font-size:12px;opacity:.7">As dicas já abertas ficam aqui. Usar dicas diminui as estrelas.</p>${L.hints.slice(0,n).map((h,i)=>`<div class="hintcard"><b>Dica ${i+1} de 3</b><p>${h}</p></div>`).join('')}<div class="mbts"><button class="btn" id="m-close">Fechar</button>${n<3?`<button class="btn rst" id="m-more">Mostrar a dica ${n+1} de 3</button>`:''}</div>`);
 $('#m-close').onclick=closeModal;const more=$('#m-more');if(more)more.onclick=()=>{hints=n+1;openHints()};
}
$('#hintbtn').onclick=()=>{if(hints===0)hints=1;sfx.click();openHints()};

/* ---- verificar ---- */
function complete(){
 const stars=1+(hints===0?1:0)+(fails<=2?1:0);
 P.stars[L.id]=Math.max(P.stars[L.id]||0,stars);if(L.id<LEVELS.length)P.unlocked=Math.max(P.unlocked,L.id+1);
 save();renderHeader();sfx.win();const lastL=L.id===LEVELS.length;
 say(lastL?'🏆 Você configurou a fábrica inteira! Mestre da IHM!':'🎉 Fase concluída! A IHM está perfeita!','happy');
 modal(`<h2>${lastL?'🏆 Mestre da IHM!':'🎉 Fase concluída!'}</h2><div class="bigstars">${starsHTML(stars)}</div><p>Dicas usadas: <b>${hints}</b> · Erros: <b>${fails}</b></p><p style="font-size:12px;opacity:.7">3 estrelas = nenhuma dica e no máximo 2 erros.</p><div class="mbts"><button class="btn" id="m-close">Continuar aqui</button>${lastL?'<button class="btn run" id="m-first">Jogar de novo</button>':'<button class="btn run" id="m-next">Próxima fase ▶</button>'}</div>`);
 $('#m-close').onclick=closeModal;if(lastL)$('#m-first').onclick=()=>{closeModal();loadLevel(1)};else $('#m-next').onclick=()=>{closeModal();loadLevel(L.id+1)};
}
function verify(){
 if(run)stopRun();
 if(!allDone()){say('Faça todos os passos primeiro: veja a lista de passos ao lado.','think');sfx.fail();return}
 const lv=evalLevel(L,cfg);last=lv;renderSide(lv);
 if(lv.ok){complete();return}
 fails++;sfx.fail();const pista=firstMsg(lv);say('Quase lá! '+pista,'bad');
 const n=lv.results.filter(x=>x.ok).length;
 modal(`<h2>🔧 Ainda não está certo</h2><p>${n} de ${lv.results.length} testes passaram.</p><div class="pista">🤖 <b>Pista do Relê:</b> ${pista}</div><div class="mbts"><button class="btn rst" id="m-close">Voltar aos parâmetros</button><button class="btn" id="m-hint">💡 Pedir dica</button></div>`);
 $('#m-close').onclick=closeModal;$('#m-hint').onclick=()=>{if(hints===0)hints=1;openHints()};
}
$('#chk').onclick=verify;

/* ---- trilha ---- */
function demoScale(host){
 let raw=10000;
 host.innerHTML=`<label style="font-size:12px;font-weight:800">Exemplo: módulo de 0 a 1000 para um sensor de 20 a 80 kg. Valor bruto: <span class="val" id="dp"></span></label><input type="range" id="dr" min="0" max="1000" value="10000" step="10"><div class="out"><span id="dt"></span></div><p style="font-size:12px;opacity:.8;margin-top:4px">valor = mín + bruto ÷ bruto máx × (máx − mín)</p>`;
 const r=$('#dr',host);r.value=400;raw=400;
 const upd=()=>{$('#dp',host).textContent=raw;$('#dt',host).innerHTML=`Tela mostra: <b>${(20+raw/1000*60).toFixed(1).replace('.',',')} kg</b>`};
 r.oninput=e=>{raw=+e.target.value;upd()};upd();
}
const LESSONS={
1:[{t:'O que é uma IHM?',p:'IHM (Interface Homem-Máquina) é a <b>telinha</b> onde o operador vê o que a máquina faz e dá comandos. Ela <b>não pensa</b>: quem pensa é o CLP. A IHM só lê e escreve valores nele.'},
 {t:'Tags e endereços',p:'Cada botão, lâmpada ou número na tela está ligado a uma <b>tag</b>, um endereço de memória do CLP. Entradas (I) são físicas, saídas (Q) acionam a máquina e memórias (M) servem para conversar. Ligar o objeto no endereço errado é o erro mais comum de IHM.'}],
2:[{t:'Botão momentâneo',p:'Vale 1 só <b>enquanto você segura</b> e volta a 0 ao soltar. Ideal para ajuste manual (jog) e para quem precisa de segurança: soltou, parou.'},
 {t:'Alternado e seta',p:'<b>Alternado</b> inverte o estado a cada toque. <b>Seta</b> coloca em 1 e fica, e outro botão (reset) volta a 0. Escolher o tipo errado causa máquinas que param sozinhas ou nunca param.'}],
3:[{t:'Valor bruto e valor real',p:'O módulo analógico entrega um <b>número bruto</b> (por exemplo, de 0 a um máximo fixo). A IHM precisa converter esse número para a unidade real do processo.',demo:'scale',fig:'<div class="fig"><div class="n"><span>0</span>bruto<br>= 0 °C</div><div class="a">➜</div><div class="n"><span>13824</span>bruto<br>= 75 °C</div><div class="a">➜</div><div class="n"><span>27648</span>bruto<br>= 150 °C</div></div>'},
 {t:'Casas decimais e unidade',p:'Mostrar casas decimais demais confunde; de menos esconde o que o processo exige. E a <b>unidade</b> na tela precisa combinar com o que se mede.'}],
4:[{t:'Limites de entrada',p:'Quando o operador digita um valor, a IHM pode checar <b>mínimo e máximo</b> e recusar o que for perigoso. É a primeira barreira contra erro de digitação (um zero a mais!).'},
 {t:'Valor inicial',p:'Ao ligar a máquina, o campo mostra um valor inicial. Ele precisa estar <b>dentro da faixa segura</b> para a máquina não partir já errada.'}],
5:[{t:'Níveis de alarme',p:'Alarmes têm degraus: <b>aviso</b> (atenção), <b>alto</b> e <b>crítico</b>. Cada um precisa ficar fora da faixa normal de operação, senão toca à toa. Alarme falso demais faz o operador <b>ignorar todos</b>.',fig:'<div class="fig"><div class="n" style="background:#ffe0e3"><span>🔴</span>crítico<br>perto de 100%</div><div class="n" style="background:#fff0d1"><span>🟠</span>alto<br>acima do normal</div><div class="n" style="background:#d6f7e7"><span>🟢</span>normal<br>30% a 80%</div><div class="n" style="background:#fff0d1"><span>🟠</span>baixo<br>abaixo do normal</div></div>'},
 {t:'Reconhecimento (ACK)',p:'Um alarme importante deve ficar <b>retentivo</b>: continua aparecendo até alguém reconhecer (ACK), mesmo que a condição já tenha passado. Assim ninguém perde a ocorrência. Em risco grave, o CLP deve também <b>agir</b>, não só avisar.'}],
6:[{t:'O que é uma receita?',p:'Receita é um <b>conjunto de parâmetros</b> salvo com um nome (temperatura, tempo, velocidade). O operador troca de produto com um toque, sem digitar tudo de novo.'},
 {t:'Cuidado com a unidade de tempo',p:'A IHM pode guardar o tempo em segundos ou minutos, e o CLP precisa saber qual. 20 <b>minutos</b> lidos como 20 <b>segundos</b> estragam o lote inteiro!'}],
7:[{t:'Níveis de usuário',p:'A IHM pode pedir <b>login</b> para algumas funções. Em geral: <b>Operador</b> faz a rotina; <b>Manutenção</b> ajusta limites e receitas; <b>Engenharia</b> mexe em escala e calibração.',fig:'<div class="fig"><div class="n"><span>🧑‍🏭</span>Operador<br>rotina</div><div class="a">⊂</div><div class="n"><span>🔧</span>Manutenção<br>ajustes</div><div class="a">⊂</div><div class="n"><span>👷</span>Engenharia<br>configuração</div></div>'},
 {t:'Nem de mais, nem de menos',p:'Proteção de menos: qualquer um mexe no que não deve. Proteção demais: o operador não consegue trabalhar. E o <b>logout automático</b> fecha o acesso quando ninguém toca na tela por um tempo.'}],
8:[{t:'Juntando tudo',p:'Na dosadora, cada decisão das fases anteriores aparece junta: endereço, tipo de botão, escala, limites, alarme e acesso.'},
 {t:'Confira os testes',p:'Use ▶ <b>RODAR</b> para ver cada situação e leia a lista ao lado. O Relê aponta o primeiro erro em ✓ <b>VERIFICAR</b>.'}]};
let lesStep=0;
function openLesson(id,step){
 lesStep=step||0;const steps=LESSONS[id],s=steps[lesStep],lastS=lesStep===steps.length-1,lv=LEVELS[id-1];
 const dots=steps.map((_,i)=>`<span class="${i===lesStep?'on':''}"></span>`).join('');
 modal(`<h2>📖 Trilha · Fase ${id}</h2><div class="dots">${dots}</div><h3>${s.t}</h3><p>${s.p}</p>${s.fig||''}${s.demo?'<div class="demo" id="demo"></div>':''}${lastS?`<p><b>🎯 Missão:</b> ${lv.mission}</p>`:''}<div class="mbts">${lesStep>0?'<button class="btn" id="l-prev">◀ Voltar</button>':''}<button class="btn run" id="l-next">${lastS?'Começar a fase 🚀':'Próximo ▶'}</button></div><p><a href="#" id="l-skip">pular trilha</a></p>`,true);
 if(s.demo)demoScale($('#demo'));
 const prev=$('#l-prev');if(prev)prev.onclick=()=>openLesson(id,lesStep-1);
 $('#l-next').onclick=()=>{if(lastS)endLesson(id);else openLesson(id,lesStep+1)};
 $('#l-skip').onclick=e=>{e.preventDefault();endLesson(id)};
}
function endLesson(id){P.seen[id]=1;save();closeModal()}
$('#howbtn').onclick=()=>{sfx.click();openHow()};
$('#lessonbtn').onclick=()=>{sfx.click();openLesson(L.id)};
function maybeLesson(){if(P.welcomed&&!P.seen[L.id]&&LESSONS[L.id])openLesson(L.id)}

/* ---- fases ---- */
function loadLevel(id){
 if(id>P.unlocked)return;
 closeModal();run=null;$('#run').disabled=false;
 L=LEVELS[id-1];hints=0;fails=0;last=null;
 const saved=P.cfg[id]||{};cfg={};
 L.fields.forEach(f=>{const v=saved[f.id];const okv=v!==undefined&&v!==null&&(f.type==='num'?isFinite(+v):f.opts.some(o=>String(o[0])===String(v)));cfg[f.id]=okv?(f.type==='num'?+v:String(v)):f.def});
 P.done=P.done||{};const sd=P.done[id]||{};done={};L.fields.forEach(f=>{if(sd[f.id])done[f.id]=true});stepI=L.fields.findIndex(f=>!done[f.id]);if(stepI<0)stepI=L.fields.length;pend=L.fields[stepI]&&done[L.fields[stepI].id]?cfg[L.fields[stepI].id]:null;fb='';
 renderHeader();renderForm();renderSide();drawIdle();
 say(`<b>Fase ${L.id}:</b> ${L.story}`,'happy');maybeLesson();
}
$('#lv').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b&&!b.classList.contains('lock'))loadLevel(+b.dataset.lv);else if(b){say('Essa fase ainda está trancada. Resolva a anterior!','think');sfx.fail()}});
$('#snd').onclick=()=>{P.sound=!P.sound;save();renderHeader();if(P.sound)sfx.click()};
$('#rstp').onclick=()=>{ask('↺ Zerar tudo','Apagar <b>todo</b> o progresso: estrelas, fases desbloqueadas e ajustes? Não dá para desfazer.','Sim, zerar tudo',()=>{
 try{localStorage.removeItem(KEY)}catch(e){}
 P=Object.assign({},DEF,{stars:{},cfg:{},seen:{},done:{},unlocked:1,welcomed:true});save();loadLevel(1);say('Tudo zerado! Vamos recomeçar. 🖥️','happy')})};
loadLevel(1);
if(!P.welcomed){
 modal(`<h2>🖥️ Mestre da IHM</h2><div style="font-size:60px">🤖</div><p>Oi! Eu sou o <b>Relê</b>. A fábrica ganhou telas de IHM novas, mas ninguém configurou nada!</p><p>Em cada fase eu te guio <b>passo a passo</b>: explico o assunto, mostro os dados da máquina e você responde. Depois testamos a máquina com a sua configuração.</p><div class="mbts"><button class="btn run" id="m-go">Vamos configurar! 🚀</button></div>`);
 $('#m-go').onclick=()=>{P.welcomed=true;save();sfx.win();openHow();$('#m-close').onclick=()=>{closeModal();maybeLesson()}};
}
</script>
</body>
</html>
