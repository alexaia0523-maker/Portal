<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sala de Questões · Aluno</title>
<style>
:root{--ink:#2b2250;--bg1:#fff3c9;--bg2:#d9f2ff;--purple:#6c4cf1;--pink:#ff5fa2;--yellow:#ffd23f;--teal:#2ec4b6;--orange:#ff9f1c;--green:#19c37d;--grey:#c3bddb;--red:#ff4d5e;--card:#fff;--blue:#2a8de0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
h1,h2,h3,p{margin:0}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.hidden{display:none!important}
#app{max-width:1000px;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:100vh;min-height:100dvh}
.btn{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .06s;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:12px}
.btn.run{background:var(--green);color:#fff}.btn.rst{background:var(--yellow)}.btn.chk{background:var(--purple);color:#fff}
#top{padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:900;font-size:18px;color:var(--purple);white-space:nowrap}
.sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-weight:900;font-size:14px;border:3px solid var(--ink);border-radius:12px;padding:5px 12px;background:#fff;cursor:pointer;color:var(--ink)}
.tab.cur{background:var(--yellow)}
#lv{display:flex;gap:6px;flex-wrap:wrap}
.chip{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);background:#fff;font:inherit;font-weight:900;font-size:15px;line-height:1;cursor:pointer;padding:0;color:var(--ink)}
.chip i{display:block;font-style:normal;font-size:8px;color:var(--orange);letter-spacing:-1px;margin-top:1px}
.chip.cur{background:var(--yellow)}.chip.bonus{border-color:var(--purple)}
#main{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
#qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:14px}
#qhead b{color:var(--purple)}
.dots{display:flex;gap:6px;margin-left:auto}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots span.cur{background:var(--yellow)}.dots span.ok{background:var(--green)}.dots span.part{background:var(--orange)}.dots span.bad{background:var(--red)}
#qtext{font-size:17px;line-height:1.45;font-weight:700}
#qfig,#afig{text-align:center}
#qfig img,#afig img{max-width:100%;height:auto;border:2px dashed var(--grey);border-radius:12px;padding:6px;background:#fff}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-weight:700;font-size:15px;border:3px solid var(--ink);border-radius:12px;padding:9px 12px;background:#fff;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 var(--ink);text-align:left;line-height:1.35}
.opt.sel{background:var(--yellow);outline:3px solid var(--green)}
.opt.right{background:#b8f2d6}.opt.wrong{background:#ffc2c8}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,230px);gap:8px;align-items:center;padding:6px 8px;border:3px solid var(--ink);border-radius:12px;background:#f3efff;font-weight:700;font-size:15px;line-height:1.3}
.frow.right{background:#d6f7e7}.frow.wrong{background:#ffdde1}
.frow select,.frow input{font:inherit;font-weight:700;font-size:15px;border:3px solid var(--ink);border-radius:10px;padding:6px 8px;background:#fff;color:var(--ink);width:100%}
.frow small{grid-column:1/-1;font-weight:800;font-size:13px}
.vfrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border:3px solid var(--ink);border-radius:12px;background:#f3efff;font-weight:700;font-size:15px;line-height:1.3}
.vfrow.right{background:#d6f7e7}.vfrow.wrong{background:#ffdde1}
.vfrow small{grid-column:1/-1;font-weight:800;font-size:13px}
.tg{font:inherit;font-weight:900;font-size:15px;border:3px solid var(--ink);border-radius:12px;padding:6px 14px;background:#fff;cursor:pointer;margin-left:4px;color:var(--ink)}
.tg.on{background:var(--yellow);outline:3px solid var(--green)}
.hint{font-size:13px;opacity:.8}
#fb{border:3px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45}
#fb.ok{background:#d6f7e7}#fb.part{background:#fff0c4}#fb.bad{background:#ffdde1}
#fb h3{font-size:17px;margin-bottom:4px}
#fb ul{list-style:none;padding:0;margin:6px 0}
#fb li{padding:5px 9px;border-radius:9px;margin-bottom:4px;font-size:13.5px;font-weight:700;background:#fff}
#fb li.ok{background:#d6f7e7}#fb li.bad{background:#ffdde1}
#fb li small{display:block;font-weight:600}
.exp{margin-top:6px;padding:8px 10px;background:#fff;border-radius:10px;border:2px dashed var(--grey)}
/* montador */
.rung{display:flex;align-items:stretch;gap:0;border:3px solid var(--ink);border-radius:12px;background:#f3efff;padding:6px;margin-bottom:8px;overflow-x:auto}
.rung .rl{font-weight:900;font-size:13px;writing-mode:vertical-rl;transform:rotate(180deg);padding:0 6px;text-align:center}
.rail{width:6px;background:var(--ink);border-radius:3px;flex:none}
.rcols{display:flex;gap:6px;align-items:center;padding:0 6px;flex:1}
.rcol{display:flex;flex-direction:column;gap:3px;min-width:120px;flex:1}
.rcol select,.rout select{font:inherit;font-weight:700;font-size:13px;border:3px solid var(--ink);border-radius:10px;padding:5px 4px;background:#fff;color:var(--ink);width:100%}
.rcol select.par{background:#e9f4ff;border-style:dashed}
.rcol small{font-size:10.5px;font-weight:800;text-align:center;opacity:.65}
.rout{min-width:170px;flex:1;display:flex;flex-direction:column;gap:3px;justify-content:center}
.rout select{background:#fff7d6}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
/* rodape */
#foot{display:flex;align-items:center;gap:12px;padding:8px 12px;position:sticky;bottom:8px;z-index:20}
#rele{width:56px;height:62px;display:block;flex:none;animation:bob 2.4s ease-in-out infinite}
#bubble{flex:1;position:relative;background:#f3efff;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.3;min-height:46px;display:flex;align-items:center}
#bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(43,34,80,.55);display:grid;place-items:center;z-index:50;padding:12px}
.mcard{max-width:560px;width:100%;padding:18px;max-height:92vh;overflow:auto;text-align:center}
.mcard h2{font-size:22px;margin-bottom:8px}
.mcard p{margin:6px 0;font-size:14px;line-height:1.4}
.mcard input[type=text],.mcard input[type=password]{font:inherit;font-weight:700;font-size:16px;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;width:100%;margin:6px 0}
.bigstars{font-size:46px;color:var(--orange);letter-spacing:4px}
.mbts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.rtab{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0;text-align:left}
.rtab th,.rtab td{border:2px solid var(--ink);padding:4px 7px}
.rtab th{background:#e4dcff}
.res{list-style:none;padding:0;margin:8px 0;text-align:left}
.res li{padding:6px 10px;border-radius:10px;margin-bottom:4px;font-size:13.5px;font-weight:700}
.res li.ok{background:#d6f7e7}.res li.part{background:#fff0c4}.res li.bad{background:#ffdde1}
/* modo quadro */
body.board #qtext{font-size:30px;line-height:1.4}
body.board .opt,body.board .frow,body.board .vfrow{font-size:24px}
body.board #qfig img,body.board #afig img{width:100%}
body.board .exp{font-size:22px}
body.board #fb{font-size:22px}
@media(max-width:700px){
 #qtext{font-size:15.5px}
 .frow{grid-template-columns:1fr}
 .logo{font-size:15px}
 #foot{flex-wrap:wrap}
 #rele{width:42px;height:46px}
 #bubble{min-width:140px;font-size:12.5px}
 .btns{width:100%;justify-content:center}
 body.board #qtext{font-size:22px}
 body.board .opt,body.board .frow,body.board .vfrow{font-size:17px}
}
@media print{
 body{background:#fff}
 body>*:not(#printarea){display:none!important}
 #printarea{display:block!important}
}
#printarea{display:none;padding:16px;font-family:inherit}
#printarea h1{font-size:22px;margin-bottom:4px}
</style>
</head>
<body>
<div id="app">
 <header id="top" class="card">
  <div class="row">
   <div class="logo">📝 Fábrica Maluca do Relê · Sala de Questões</div><a class="btn sm" href="../index.html">🎮 Jogos</a>
   <span class="sp"></span>
   <button class="btn sm" id="bname" title="Sair da conta">👤 <span id="nm"></span> · Sair</button>
   <button class="btn sm" id="brep">📄 Relatório</button>

  </div>
  <div class="row"><div class="tabs" id="games"></div><nav id="lv"></nav></div>

 </main>
 <footer id="foot" class="card">
  <svg id="rele" viewBox="0 0 90 100">

   <rect x="22" y="80" width="46" height="16" rx="7" fill="#ff9f1c" stroke="#2b2250" stroke-width="4"/>
   <rect x="3" y="38" width="8" height="22" rx="4" fill="#ffd23f" stroke="#2b2250" stroke-width="3"/><rect x="79" y="38" width="8" height="22" rx="4" fill="#ffd23f" stroke="#2b2250" stroke-width="3"/>
   <rect x="10" y="20" width="70" height="58" rx="17" fill="#7fd8ff" stroke="#2b2250" stroke-width="4"/>

   <path id="mouth" d="M36 54Q45 63 54 54" stroke="#7cff8a" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  </svg>

  <div class="btns" id="btns"></div>
 </footer>
</div>
<div id="modal" class="overlay hidden"><div class="mcard card" id="mbody"></div></div>

<script>
const DATA={"games": [{"id": "ladder", "name": "Lógica Ladder", "color": "#6c4cf1", "phases": [{"n": 1, "num": 1, "name": "Lâmpada da entrada", "obj": "Entradas e saídas, contato NA e bobina.", "bonus": false, "qs": [{"t": "mc", "q": "Qual destes endereços representa uma <b>ENTRADA<\/b> digital do CLP?", "o": ["Q0.0", "I0.0", "M0.0", "T1"], "a": 1, "id": "L1.1", "exp": "<b>B) I0.0.<\/b> I vem de Input (entrada). Q é saída (Output), M é memória e T é temporizador."}, {"t": "vf", "q": "Julgue cada frase com V ou F:", "items": [["O contato NA deixa a corrente lógica passar quando o bit é 1.", true], ["A bobina é uma entrada do CLP.", false], ["Em cada degrau a corrente lógica vai do trilho esquerdo ao direito.", true]], "id": "L1.2", "exp": "<b>(a) V · (b) F · (c) V.<\/b> A bobina é uma saída: ela é o resultado do degrau."}, {"t": "fields", "f": [{"t": "sel", "l": "Com o botão apertado (I0.0 = 1), a lâmpada Q0.0 fica:", "o": ["ligada", "desligada"], "a": 0}, {"t": "sel", "l": "Com o botão solto (I0.0 = 0), a lâmpada fica:", "o": ["ligada", "desligada"], "a": 1}], "q": "Com o botão apertado (I0.0 = 1) a lâmpada Q0.0 fica ligada ou desligada? E com o botão solto (I0.0 = 0)?", "fig": "L1.3q", "af": "L1.3a", "id": "L1.3", "exp": "<b>Apertado: LIGADA<\/b> (o NA fecha e a corrente chega à bobina). <b>Solto: desligada<\/b> (o NA abre)."}, {"t": "lad", "inputs": [{"a": "I0.3", "l": "Botão", "t": "push", "c": "green"}], "addrs": ["I0.3", "Q0.1"], "cols": 2, "rungs": [{"outs": [{"l": "Bobina Q0.1 (lâmpada)", "o": {"kind": "COIL", "addr": "Q0.1"}}, {"l": "Bobina Q0.0", "o": {"kind": "COIL", "addr": "Q0.0"}}]}], "tests": [{"name": "Sem apertar: apagada", "steps": [{"w": 0.3}, {"ex": {"Q0.1": false}, "msg": "A lâmpada Q0.1 acendeu sozinha."}]}, {"name": "Apertou: acende", "steps": [{"set": {"I0.3": true}}, {"w": 0.3}, {"ex": {"Q0.1": true}, "msg": "Com o botão I0.3 apertado a lâmpada Q0.1 deve acender."}]}, {"name": "Soltou: apaga", "steps": [{"set": {"I0.3": true}}, {"w": 0.3}, {" /* ---- correção ---- */
const numOk=(v,f)=>Math.abs(v-f.a)<=Math.max(f.tol||0,1e-9);
function grade(q,ans){
 if(q.t==='mc')return {score:ans===q.a?1:0};
 if(q.t==='vf'){const ok=ans.map((v,i)=>v===q.items[i][1]);return {score:ok.filter(Boolean).length/ok.length,ok}}
 if(q.t==='fields'){const ok=ans.map((v,i)=>q.f[i].t==='sel'?v===q.f[i].a:numOk(v,q.f[i]));return {score:ok.filter(Boolean).length/ok.length,ok}}
}
function fbHTML(res,q,extra){
 const sc=res.score,cls=sc>=.999?'ok':sc>0?'part':'bad';
 const t=sc>=.999?rnd(['Isso mesmo! 🎉','Perfeito! ✔','Mandou bem! 👏']):sc>0?'Quase! Você acertou parte. 🙂':rnd(['Ainda não foi dessa vez. 💪','Vamos entender o porquê. 🔎']);
 return `<h3>${t}</h3>${extra||''}<div class="exp"><b>Explicação:</b> ${q.exp}</div>`;
}
function finish(score,fbcls,html){
 const q=PH.qs[qi];cur.locked=true;sess.scores[qi]=score;
 const f=$('#fb');f.className=fbcls;f.innerHTML=html;
 $('#afig').innerHTML=q.af?`<p class="hint" style="margin:6px 0">Resposta em figura:</p>`+figImg(q.af):'';
 score>=.999?sfx.ok():sfx.bad();say(score>=.999?rnd(['Acertou! Que técnico(a) incrível!','Isso aí, continue assim!']):score>0?'Quase lá! Leia a explicação.':'Sem problemas, errar faz parte. Leia a explicação!',score>=.999?'happy':score>0?'think':'bad');
 renderDots();setBtns();f.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderDots(){$$('#qhead .dots span').forEach((s,i)=>{const v=sess.scores[i];s.className=(i===qi?'cur ':'')+(v===null?'':v>=.999?'ok':v>0?'part':'bad')})}
function answer(){
 const q=PH.qs[qi];if(cur.locked)return;
 if(q.t==='lad'){return runLad(q)}
 const ans=collect();if(ans===null)return;const res=grade(q,ans);
 if(q.t==='mc'){$$('.opt').forEach((o,i)=>{o.classList.toggle('right',i===q.a);o.classList.toggle('wrong',i===ans&&i!==q.a)});}
 if(q.t==='vf'){$$('.vfrow').forEach((r,i)=>{r.classList.add(res.ok[i]?'right':'wrong');if(!res.ok[i])r.insertAdjacentHTML('beforeend',`<small>✘ O correto era: ${q.items[i][1]?'Verdadeiro':'Falso'}</small>`)})}
 if(q.t==='fields'){$$('.frow').forEach((r,i)=>{const f=q.f[i];r.classList.add(res.ok[i]?'right':'wrong');r.querySelectorAll('select,input').forEach(x=>x.disabled=true);if(!res.ok[i])r.insertAdjacentHTML('beforeend',`<small>✘ O correto era: ${f.t==='sel'?f.o[f.a]:String(f.a).replace('.',',')+(f.u?' '+f.u:'')}</small>`)})}
 finish(res.score,res.score>=.999?'ok':res.score>0?'part':'bad',fbHTML(res,q,q.t!=='mc'?`<p>Você acertou ${Math.round(res.score*(q.t==='vf'?q.items.length:q.f.length))} de ${q.t==='vf'?q.items.length:q.f.length}.</p>`:''));
}
/* ---- montador Ladder ---- */
function addrLabel(q,a){const i=q.inputs.find(x=>x.a===a);if(i)return i.l;if(a[0]==='T')return 'Temporizador';if(a[0]==='C')return 'Contador';if(a[0]==='M')return 'Memória';return 'Saída'}
function ladHTML(q){
 const copts=`<option value="">— vazio —</option>`+q.addrs.flatMap(a=>['NA','NF'].map(k=>`<option value="${k}|${a}">${k} ${a} · ${addrLabel(q,a)}</option>`)).join('');
 const mach=q.inputs.length?`<p class="hint" style="margin-bottom:6px"><b>Entradas:</b> ${q.inputs.map(i=>`${i.a} = ${i.l}`).join(' · ')}</p>`:'';
 return mach+q.rungs.map((r,ri)=>`<div class="rung" data-r="${ri}"><div class="rl">Linha ${ri+1}</div><div class="rail"></div><div class="rcols">${Array.from({length:q.cols},(_,ci)=>`<div class="rcol" data-c="${ci}"><select data-row="0">${copts}</select><select class="par" data-row="1">${copts}</select><small>${ci+1}ª peça (E) · embaixo: OU</small></div>`).join('')}</div><div class="rout"><small>Saída (fim da linha)</small><select data-out><option value="">— saída —</option>${r.outs.map((o,i)=>`<option value="${i}">${o.l}</option>`).join('')}</select></div><div class="rail"></div></div>`).join('')+`<div id="ladres"></div>`;
}
function buildProg(q){
 const rungs=$$('.rung').map((el,ri)=>{
  const cols=$$('.rcol',el).length?[...el.querySelectorAll('.rcol')].map(c=>[...c.querySelectorAll('select')].map(s=>{if(!s.value)return null;const [k,a]=s.value.split('|');return{kind:k,addr:a}})):[];
  const ov=el.querySelector('[data-out]').value;const out=ov===''?null:JSON.parse(JSON.stringify(q.rungs[ri].outs[+ov].o));
  return{cols,out};
 });
 return{rungs};
}
function makeEngine(){
 const e={in:{},bits:{},tm:{},ct:{},
  get(a){const k=a[0];if(k==='I')return !!e.in[a];if(k==='T')return !!(e.tm[a]&&e.tm[a].done);if(k==='C')return !!(e.ct[a]&&e.ct[a].done);return !!e.bits[a]},
  scan(dt,prog){
   for(const r of prog.rungs){let p=true;
    for(const col of r.cols){const cin=p;let any=false,cout=false;
     for(let row=0;row<2;row++){const c=col[row];if(!c)continue;any=true;const v=e.get(c.addr);const closed=c.kind==='NF'?!v:v;if(cin&&closed)cout=true}
     if(!any)cout=cin;p=cout}
    const o=r.out;if(!o)continue;
    if(o.kind==='COIL')e.bits[o.addr]=p;
    else if(o.kind==='TON'){const t=e.tm[o.addr]||(e.tm[o.addr]={acc:0,done:false});if(p){t.acc+=dt;if(t.acc>=(o.preset||1)-1e-9)t.done=true}else{t.acc=0;t.done=false}}
    else if(o.kind==='CTU'){const c=e.ct[o.addr]||(e.ct[o.addr]={count:0,done:false,prev:false});if(o.reset&&e.get(o.reset))c.count=0;else if(p&&!c.prev)c.count++;c.prev=p;c.done=c.count>=(o.preset||1)}
   }}};
 return e;
}
function runTests(q,prog){
 return q.tests.map(t=>{const eng=makeEngine();let fail=null;const sc=n=>{for(let i=0;i<n;i++)eng.scan(.05,prog)};
  for(const s of t.steps){
   if(s.set)Object.assign(eng.in,s.set);
   else if(s.w)sc(Math.round(s.w/.05));
   else if(s.pulse){eng.in[s.pulse]=true;sc(4);eng.in[s.pulse]=false;sc(4)}
   else if(s.ex){for(const a in s.ex){if(eng.get(a)!==s.ex[a]){fail=s.msg;break}}}
   if(fail)break}
  return{name:t.name,ok:!fail,msg:fail}});
}
function runLad(q,giveUp){
 const prog=buildProg(q);
 if(!giveUp&&!prog.rungs.some(r=>r.out)){say('Escolha pelo menos uma saída para testar o circuito.','think');return}
 cur.attempts++;const res=runTests(q,prog),ok=res.every(r=>r.ok),frac=res.filter(r=>r.ok).length/res.length;
 const list=`<ul>${res.map(r=>`<li class="${r.ok?'ok':'bad'}">${r.ok?'✔':'✘'} ${r.name}${r.ok?'':`<small>🤖 ${r.msg}</small>`}</li>`).join('')}</ul>`;
 if(ok){
  const sc=Math.max(.5,1-.25*(cur.attempts-1));
  $$('.rung select').forEach(s=>s.disabled=true);
  finish(sc,'ok',`<h3>Seu circuito funciona! 🎉</h3>${list}<p>Tentativas: ${cur.attempts}${sc<1?' (cada tentativa extra reduz um pouco a nota)':''}.</p><div class="exp"><b>Explicação:</b> ${q.exp}</div>`);return;
 }
 if(giveUp){$$('.rung select').forEach(s=>s.disabled=true);finish(frac*.5,frac>0?'part':'bad',`<h3>Resposta revelada</h3>${list}<div class="exp"><b>Modelo:</b> ${q.exp}</div>`);return}
 const f=$('#fb');f.className='bad';f.classList.remove('hidden');f.innerHTML=`<h3>Ainda não funcionou 🔧</h3><p>${res.filter(r=>r.ok).length} de ${res.length} testes passaram.</p>${list}<div class="ctl"><button class="btn sm rst" id="bgive">Ver resposta (vale menos)</button></div>`;
 say('Quase! '+res.find(r=>!r.ok).msg,'bad');sfx.bad();f.scrollIntoView({behavior:'smooth',block:'nearest'});
}
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.id==='bgo')answer();
 else if(t.id==='bgive'){runLad(PH.qs[qi],true)}
 else if(t.id==='bnext'){if(board){qi++;reveal=false;renderQ();return}if(qi<PH.qs.length-1){qi++;renderQ();window.scrollTo({top:0,behavior:'smooth'})}else showResult()}
 else if(t.id==='bprev'){qi--;reveal=false;renderQ()}
 else if(t.id==='bshow'){reveal=!reveal;showBoardAnswer()}
});

 else if(q.t==='fields')h=`<div class="opts">${q.f.map(f=>`<div class="frow"><span>${f.l}</span><b>${f.t==='sel'?'escolha':'valor'}</b></div>`).join('')}</div>`;

 else if(q.t==='fields')det=`<p><b>Respostas:</b></p><ul>${q.f.map(x=>`<li>${x.l} <b>→ ${x.t==='sel'?x.o[x.a]:String(x.a).replace('.',',')+(x.u?' '+x.u:'')}</b></li>`).join('')}</ul>`;

}
async function boot(){
 let s=null;try{s=JSON.parse(sessionStorage.getItem('qs_user')||'null')}catch(e){}
 if(s&&CFG.url){try{const j=await rpc('student_login',{p_name:s.name,p_class:s.cls,p_pin:s.pin});U={pin:s.pin};applyUser(j);U.pin=s.pin;renderTop();return}catch(e){}}
 authScreen('in');
}
/* ---- modal, nome e relatório ---- */
function modal(h){$('#mbody').innerHTML=h;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!modalLock)closeModal()});
$('#bname').onclick=()=>{if(confirm('Sair desta conta?'))logout()};
function reportData(){
 const d=new Date().toLocaleDateString('pt-BR');let tot=0,n=0;
 const rows=DATA.games.map(g=>({g,rows:g.phases.map(p=>({p,pct:P.best[p.n],st:P.stars[p.n]||0,tr:P.tries[p.n]||0}))}));
 rows.forEach(r=>r.rows.forEach(x=>{if(x.pct!==undefined){tot+=x.pct;n++}}));
 return{d,rows,media:n?Math.round(tot/n):0,feitas:n,total:DATA.games.reduce((a,g)=>a+g.phases.length,0)};
}
function reportHTML(){
 const r=reportData();
 return `<h1>Relatório de questões</h1><p><b>Aluno(a):</b> ${who()} · <b>Data:</b> ${r.d}</p><p><b>Fases feitas:</b> ${r.feitas} de ${r.total} · <b>Média:</b> ${r.media}%</p>`+r.rows.map(g=>`<table class="rtab"><tr><th colspan="4">${g.g.name}</th></tr><tr><th>Fase</th><th>Melhor nota</th><th>Estrelas</th><th>Tentativas</th></tr>${g.rows.map(x=>`<tr><td>${x.p.num}. ${x.p.name}${x.p.bonus?' (bônus)':''}</td><td>${x.pct===undefined?'—':x.pct+'%'}</td><td>${x.pct===undefined?'—':starsTxt(x.st)}</td><td>${x.tr||'—'}</td></tr>`).join('')}</table>`).join('');
}
function reportText(){
 const r=reportData();let t=`RELATÓRIO DE QUESTÕES\nAluno(a): ${who()}\nData: ${r.d}\nFases feitas: ${r.feitas}/${r.total} · Média: ${r.media}%\n`;
 r.rows.forEach(g=>{t+=`\n${g.g.name}\n`;g.rows.forEach(x=>{t+=`  Fase ${x.p.num} - ${x.p.name}: ${x.pct===undefined?'não feita':x.pct+'% '+starsTxt(x.st)}\n`})});return t;
}
function openReport(){
 modal(`${reportHTML()}<div class="mbts"><button class="btn run" id="r-copy">📋 Copiar texto</button><button class="btn chk" id="r-print">🖨️ Imprimir / salvar PDF</button><button class="btn" id="r-close">Fechar</button></div><p class="hint">Envie o texto ou o PDF para o professor.</p>`);
 $('#r-close').onclick=closeModal;
 $('#r-copy').onclick=()=>{const t=reportText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>say('Relatório copiado! Cole na mensagem ao professor.','happy')).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');say('Relatório copiado!','happy')}catch(e){say('Não consegui copiar. Use a opção de imprimir.','think')}ta.remove()})};
 $('#r-print').onclick=()=>{$('#printarea').innerHTML=reportHTML();window.print()};
}
$('#brep').onclick=openReport;
/* ---- início ---- */
G=DATA.games[0];PH=G.phases[0];startSession();renderTop();renderQ();
say('Oi! Eu sou o Relê. Escolha a fase e responda as questões. Eu corrijo e explico cada uma!','happy');
boot();
</script>
